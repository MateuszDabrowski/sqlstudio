<script runat="server">
    /* -------------------------------------------------------------------------
    SQL Studio Backend. Code Resource, type JSON.
    Copyright (c) 2026 Mateusz Dąbrowski. Licensed under the EUPL 1.2.
    Free to use, change and share, commercial use included, as long as this notice stays.

    Fill in section 1 (CONFIGURATION) once, when you first deploy this Code
    Resource. On every later update, keep everything above the "APP CODE" line
    unchanged and replace everything from that line to the end of the file
    with the new release.

    /* ----------------------------------------------------------------------- */
    /* -------------------------- 1. CONFIGURATION ---------------------------- */
    /* ----------------------------------------------------------------------- */

    var configVersion = 2;                             // bumped only when a release adds/renames a setting below; see REQUIRED_CONFIG_VERSION
    var pageURL = 'SQL_STUDIO_PAGE_URL';                // the published URL of "SQL Studio", the Cloud Page; also where an auth error is shown
    var backendURL = 'SQL_STUDIO_BACKEND_URL';          // the published URL of "SQL Studio Backend", the JSON Code Resource (this file)
    var clientID = 'CLIENT_ID';                         // Installed Package, API Integration component: Client ID
    var clientSecret = 'CLIENT_SECRET';                 // Installed Package, API Integration component: Client Secret
    var clientBase = 'API_BASE_URI';                    // tenant subdomain only, e.g. mc563885gzs27c5t9-63k636ttgm
    var authDE = 'SQL Studio Auth Log';                 // sign-in sessions; created on first sign-in; add 'ENT.' prefix when shared
    var errorDE = 'SQL Studio Error Log';               // backend error log; created on first sign-in
    var historyDE = '';                                 // optional server-side query history DE name; empty = history stays in the browser's localStorage
    var allowedReferrers = [];                          // optional allowlist of URL prefixes; empty = disabled
    var debugging = false;                              // true writes debug output instead of logging to ErrorLog; keep false in production

    /* =================== APP CODE - replace from here on update =================== */

    Platform.Load('core', '1');

    /* REQUIRED_CONFIG_VERSION guards against an old "1. CONFIGURATION" section being paired with a
    newer "APP CODE" section after an update: every POST then returns a CONFIG_OUTDATED error instead
    of running against settings a newer release may have added fields for, and GET writes the same
    message as plain JSON (there is no session yet to redirect with). Enforced at the section 4/5
    dispatch below. Bump this only when a release adds, removes or renames a section 1 variable. */
    var REQUIRED_CONFIG_VERSION = 2;
    var isConfigOutdated = (typeof configVersion === 'undefined') || (configVersion < REQUIRED_CONFIG_VERSION);

    /**
     * @function findClientBaseProblem
     * @description Checks the clientBase setting before any sign-in. A wrong one sends the browser to an
     * authorize host that does not exist, and it shows only "server IP address could not be found"
     * (the author's org, 2026-09-29: a double-click had copied the subdomain only up to its hyphen).
     * Salesforce documents the tenant
     * subdomain as 28 characters that begin with "mc". The answer names the likely mistake and never
     * the value, which may be the Client ID or the Client Secret pasted into the wrong line.
     * @returns {string} what is wrong, or '' when clientBase has a tenant subdomain's shape
     */
    function findClientBaseProblem() {
        var value = (typeof clientBase === 'string') ? clientBase : '';
        if (value === '' || value === 'API_BASE_URI') return 'is not filled in';
        if (value === clientID) return 'holds the Client ID';
        if (value === clientSecret) return 'holds the Client Secret';
        if (value.indexOf('://') !== -1 || value.indexOf('.') !== -1) return 'holds a URL, not only the subdomain';
        if (/\s/.test(value)) return 'has a space in it';
        if (/^mc[a-zA-Z0-9]+$/.test(value) && value.length < 28) return 'stops short of the subdomain\'s 28 characters, likely at its hyphen, where a double-click stops selecting';
        if (!/^mc[a-zA-Z0-9-]{26}$/.test(value)) return 'is not a tenant subdomain';
        return '';
    };

    /**
     * @function findUnsetSetting
     * @description Finds the first of the four settings every sign-in needs (pageURL, backendURL,
     * clientID and clientSecret) that still holds its placeholder or is empty. Without them the
     * sign-in sends the browser to an authorize address with a placeholder Client ID, or sends it
     * back to a placeholder address. The answer is the setting's name and never its value: the
     * Client Secret is one of them.
     * @returns {string} the setting's name, or '' when all four are filled in
     */
    function findUnsetSetting() {
        var settings = [
            { name: 'pageURL', value: pageURL, placeholder: 'SQL_STUDIO_PAGE_URL' },
            { name: 'backendURL', value: backendURL, placeholder: 'SQL_STUDIO_BACKEND_URL' },
            { name: 'clientID', value: clientID, placeholder: 'CLIENT_ID' },
            { name: 'clientSecret', value: clientSecret, placeholder: 'CLIENT_SECRET' }
        ];
        for (var i = 0; i < settings.length; i++) {
            var value = settings[i].value;
            if (typeof value !== 'string' || /^\s*$/.test(value) || value === settings[i].placeholder) {
                return settings[i].name;
            };
        };
        return '';
    };
    var unsetSetting = isConfigOutdated ? '' : findUnsetSetting();
    var clientBaseProblem = (isConfigOutdated || unsetSetting !== '') ? '' : findClientBaseProblem();

    /* -------------------------------------------------------------------------

    Authenticates the visitor against Marketing Cloud Engagement with the OAuth
    2.0 web-app flow and serves a JSON API to the SQL Studio Cloud Page.

    Ad-hoc runs (runQuery) reuse a pool of Query Activities per user, identified
    by an 8-hex-char FNV-1a hash of the user's Marketing Cloud Engagement user id
    (userHash). Only "Save as" (saveQueryActivity) creates additional, permanent
    activities. The Auth Log holds the SHA256 of each session id, never the id, and
    each access token encrypted with AMPscript's EncryptSymmetric. There
    are no refresh tokens: a session lasts about 20 minutes and then the
    frontend's expiry modal re-authenticates with one click. See
    docs/EXTENDING.md for why refresh tokens are not shipped and what it
    would take to add them back.

    There is no separate error Cloud Page: an authentication failure logs to
    errorDE and redirects to pageURL with ?error=&error_description=, which the
    Cloud Page (src/cloud-page/sql-studio.html) renders as its own error block
    instead of booting the app.

    2. Global Variables
    3. Helper Functions
    3.1. Debugging
    3.2. Errors and responses
    3.3. XML helpers
    3.4. HTTP and SOAP helpers
    3.5. Validation helpers
    3.6. Session, naming and misc helpers
    3.7. Data Extension provisioning (WSProxy)
    4. Authentication Flow (GET)
    4.1. Authorization
    4.2. Authentication with REST Token
    4.3. Authorization Error
    5. Backend Flow (POST)
    5.1. Parse and validate the request
    5.2. Session lookup, expiry and refresh
    5.3. Action dispatch
    5.4. Action handlers
    5.5. Backend error handling

    -------------------------------------------------------------------------- */

    /* ----------------------------------------------------------------------- */
    /* ---------------------- 2. GLOBAL VARIABLES ----------------------------- */
    /* ----------------------------------------------------------------------- */

    var appName        = 'SQLStudio';
    var appVersion      = '1.0.0';
    // No refresh tokens: see docs/EXTENDING.md ("Refresh tokens (optional, not shipped)") for why
    // and what it would take to add one back. Sessions last about 20 minutes; the frontend's
    // expiry modal re-authenticates with one click.
    var scopes          = 'data_extensions_read data_extensions_write automations_read automations_write automations_execute';
    var tempFolderName  = 'SQL Studio';                // folder created under Data Extensions and under Query activities
    var tempPrefix      = 'SQLStudio_';               // name and key prefix of temporary objects
    var QUERY_SLOT_COUNT = 4;                          // per-user pool size for the ad-hoc Query Activity (M6); raising it is a one-line change here, up to 9: slot 2's temporary Data Extension key is 36 characters, the key limit, so a two-digit slot needs a shorter key

    // Derived endpoints.
    var authBase = 'https://' + clientBase + '.auth.marketingcloudapis.com';
    var restBase = 'https://' + clientBase + '.rest.marketingcloudapis.com';
    var soapURL  = 'https://' + clientBase + '.soap.marketingcloudapis.com/Service.asmx';

    // Fixed description stamped on every temporary object SQL Studio creates.
    var TEMP_OBJECT_DESCRIPTION = 'Temporary object created by SQL Studio. Safe to delete.';

    var method = Platform.Request.Method();
    var apiCallCount = 0;                              // SOAP + REST calls made while serving this request; returned as meta.apiCalls

    /* ----------------------------------------------------------------------- */
    /* ---------------------- 3. HELPER FUNCTIONS ----------------------------- */
    /* ----------------------------------------------------------------------- */

    /* ---------------------- 3.1. Debugging ---------------------------------- */

    /**
     * @function debugValue
     * @description Outputs a description and value to the response in a type-safe way.
     * @param {string} description - Explains the value that follows.
     * @param {*} value - The value to inspect.
     */
    function debugValue(description, value) {
        var text = (typeof value == 'object') ? Stringify(value) : String(value);
        Write(description + ': ' + text + '\n\n');
    };

    /* ---------------------- 3.2. Errors and responses ------------------------ */

    /**
     * @function apiError
     * @description Builds a plain error object carrying one of the documented error codes.
     * @param {string} code - One of BAD_REQUEST, SESSION_INVALID, SESSION_EXPIRED, UNKNOWN_ACTION, MCE_ERROR, NOT_FOUND, RUN_IN_PROGRESS, HISTORY_OLD_LAYOUT, INTERNAL.
     * @param {string} message - Human readable message.
     * @param {string} [details] - Optional raw detail text.
     * @returns {Object} error object with code, message, details.
     */
    function apiError(errorCode, message, details) {
        var err = {
            code: errorCode,
            message: message,
            details: (details === undefined) ? null : details
        };
        return err;
    };

    /**
     * @function mostSpecificMessage
     * @description Picks the most specific error text out of an MCE REST error body.
     * @param {Object} res - Result of httpJSON: { status, text, json }.
     * @returns {string} best available message.
     */
    function mostSpecificMessage(res) {
        var message = 'The Marketing Cloud Engagement API returned an error.';
        if (res && res.json) {
            if (typeof res.json.message == 'string' && res.json.message !== '') {
                message = res.json.message;
            } else if (res.json.errors && res.json.errors.length > 0) {
                var first = res.json.errors[0];
                if (typeof first == 'string') {
                    message = first;
                } else if (first && typeof first.message == 'string') {
                    message = first.message;
                };
            } else if (typeof res.json.StatusMessage == 'string' && res.json.StatusMessage !== '') {
                message = res.json.StatusMessage;
            } else if (typeof res.json.error_description == 'string' && res.json.error_description !== '') {
                message = res.json.error_description;
            };
        };
        return message;
    };

    /**
     * @function sfmcErrorFromResponse
     * @description Builds an MCE_ERROR from a failed REST call.
     * @param {Object} res - Result of httpJSON.
     * @returns {Object} apiError.
     */
    function sfmcErrorFromResponse(res) {
        var message = mostSpecificMessage(res);
        var details = truncate(res ? res.text : '', 2000);
        var err = apiError('MCE_ERROR', message, details);
        return err;
    };

    /**
     * @function sfmcErrorFromSoap
     * @description Builds an MCE_ERROR from a failed SOAP call.
     * @param {Object} soapRes - Result of soap().
     * @returns {Object} apiError.
     */
    function sfmcErrorFromSoap(soapRes) {
        var message = 'The Marketing Cloud Engagement SOAP API returned an error.';
        if (soapRes && soapRes.results && soapRes.results.length > 0) {
            var statusMessage = xmlValue(soapRes.results[0], 'StatusMessage');
            if (statusMessage) {
                message = statusMessage;
            };
        };
        var statusLine = (soapRes && soapRes.httpStatus) ? 'HTTP status: ' + soapRes.httpStatus + '\n' : '';
        var details = truncate(statusLine + (soapRes ? soapRes.raw : ''), 2000);
        var err = apiError('MCE_ERROR', message, details);
        return err;
    };

    /**
     * @function isSoapError
     * @description Tells whether a SOAP OverallStatus represents a failure.
     * @param {string} overallStatus
     * @returns {boolean}
     */
    function isSoapError(overallStatus) {
        if (!overallStatus) {
            return true;
        };
        if (overallStatus === 'OK' || overallStatus === 'MoreDataAvailable') {
            return false;
        };
        return true;
    };

    /**
     * @function isSoapSessionFault
     * @description [Guessing] Marketing Cloud Engagement's exact SOAP fault text for an expired or
     *              revoked access token is not documented, so this is a defensive, case-insensitive
     *              check for "token" alongside "expired", "invalid" or "authoriz(s)ed" in the raw
     *              response. Used only to skip a pointless REST fallback after a failed SOAP Perform
     *              start (actionRunQuery): a miss here still falls back to REST, which then fails
     *              with its own normal error, so nothing is lost when this heuristic does not match.
     * @param {string} raw - soap()'s raw response text.
     * @returns {boolean}
     */
    function isSoapSessionFault(raw) {
        var text = ('' + (raw || '')).toLowerCase();
        if (text.indexOf('token') === -1) {
            return false;
        };
        return text.indexOf('expired') !== -1 || text.indexOf('invalid') !== -1 || text.indexOf('authoriz') !== -1;
    };

    /**
     * @function logError
     * @description Logs an unexpected error either to the response (debugging) or to errorDE.
     * @param {string} message
     * @param {string} description
     */
    function logError(message, description) {
        if (debugging) {
            debugValue('Backend error', { message: message, description: description });
        } else {
            /* M4: a failed write to errorDE (missing DE, a description over 2000 chars) must never
            replace the real error being reported, so this can never throw out of logError. */
            try {
                Platform.Function.InsertData(errorDE, ['id', 'appName', 'errorMessage', 'errorDescription', 'errorDate'],
                    [GUID(), appName, truncate(message, 2000), truncate(description, 2000), Platform.Function.Now()]);
            } catch (logErr) {
                // ignore: the caller's own response already carries the real error.
            };
        };
    };

    /**
     * @function buildErrorResponse
     * @description Converts any caught value into the documented error envelope.
     * @param {*} err - Whatever was thrown: an apiError object or a runtime error.
     * @returns {Object} { ok: false, error: { code, message, details } }
     */
    function buildErrorResponse(err) {
        /* The response is built before logError runs. On MCE, a caught platform exception (logError's
        failed ErrorLog write) was seen to wipe a local named code, so nothing here is read after it,
        and no local is named code. */
        var errorCode = 'INTERNAL';
        var errorText = 'An unexpected error occurred.';
        var errorDetails = null;

        if (err && typeof err.code == 'string') {
            errorCode = err.code;
            errorText = (typeof err.message == 'string' && err.message !== '') ? err.message : errorText;
            errorDetails = (err.details === undefined) ? null : err.details;
        } else if (err && typeof err.message == 'string') {
            errorText = err.message;
            errorDetails = (err.description === undefined) ? null : String(err.description);
        };

        var result = {
            ok: false,
            error: { code: errorCode, message: errorText, details: errorDetails }
        };

        if (errorCode === 'INTERNAL') {
            var logDescription = errorDetails;
            if (logDescription === null) {
                try {
                    logDescription = Stringify(err);
                } catch (stringifyErr) {
                    logDescription = String(err);
                };
            };
            logError(errorText, logDescription);
        };
        return result;
    };

    /* ---------------------- 3.3. XML helpers ---------------------------------- */

    /**
     * @function xmlDecode
     * @description Decodes the small set of XML entities used by SOAP responses.
     * @param {string} text
     * @returns {string}
     */
    function xmlDecode(text) {
        /* split and join, not replace: on the org a regular-expression replace failed with "Object
        expected: replace" in listRuns and the Data Extension search action 0.6.0 removed, and
        nowhere else. */
        var result = '' + text;
        result = result.split('&lt;').join('<');
        result = result.split('&gt;').join('>');
        result = result.split('&quot;').join('"');
        result = result.split('&apos;').join('\'');
        result = result.split('&amp;').join('&');
        return result;
    };

    /**
     * @function xmlEscape
     * @description Escapes a value for safe embedding as XML text content.
     * @param {*} value
     * @returns {string}
     */
    function xmlEscape(value) {
        var text = '' + value;
        text = text.split('&').join('&amp;');
        text = text.split('<').join('&lt;');
        text = text.split('>').join('&gt;');
        text = text.split('"').join('&quot;');
        text = text.split('\'').join('&apos;');
        return text;
    };

    /**
     * @function isXmlNameChar
     * @description Tells whether a character can be part of an XML element name, prefix included.
     * @param {string} ch
     * @returns {boolean}
     */
    function isXmlNameChar(ch) {
        return (ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || (ch >= '0' && ch <= '9') ||
            ch === '_' || ch === ':' || ch === '-' || ch === '.';
    };

    /**
     * @function findXmlElement
     * @description Finds the first element named tag, with or without a namespace prefix, at or after
     *              fromIndex. Self-closing elements such as <MaxLength xsi:nil="true" /> are skipped, so a
     *              nil property is never confused with the next sibling of the same name. The content ends
     *              at the first matching closing tag. Only indexOf and substring are used: on the first org
     *              deployment, the regular expressions this replaced misread OverallStatus in an OK answer,
     *              and a global exec() loop over <Results> ran until MCE stopped the call at 30 seconds.
     * @param {string} source
     * @param {string} tag - the element name without a prefix, e.g. 'OverallStatus'.
     * @param {number} fromIndex
     * @returns {?{start: number, contentStart: number, contentEnd: number, end: number}}
     */
    function findXmlElement(source, tag, fromIndex) {
        var searchFrom = fromIndex;
        while (searchFrom < source.length) {
            var openAt = source.indexOf('<', searchFrom);
            if (openAt === -1) {
                return null;
            };
            var nameEnd = openAt + 1;
            while (nameEnd < source.length && isXmlNameChar(source.charAt(nameEnd))) {
                nameEnd++;
            };
            var tagEnd = source.indexOf('>', nameEnd);
            if (tagEnd === -1) {
                return null;
            };
            var name = source.substring(openAt + 1, nameEnd);
            var colonAt = name.lastIndexOf(':');
            var localName = (colonAt === -1) ? name : name.substring(colonAt + 1);
            if (name !== '' && localName === tag && source.charAt(tagEnd - 1) !== '/') {
                var closeTag = '</' + name + '>';
                var closeAt = source.indexOf(closeTag, tagEnd + 1);
                if (closeAt === -1) {
                    return null;
                };
                var element = {
                    start: openAt,
                    contentStart: tagEnd + 1,
                    contentEnd: closeAt,
                    end: closeAt + closeTag.length
                };
                return element;
            };
            searchFrom = tagEnd + 1;
        };
        return null;
    };

    /**
     * @function xmlRaw
     * @description First inner XML of a tag (optionally namespace-prefixed), not decoded. Use for nested blocks.
     * @param {string} xml
     * @param {string} tag
     * @returns {string|null}
     */
    function xmlRaw(xml, tag) {
        if (!xml) {
            return null;
        };
        var source = String(xml);
        var element = findXmlElement(source, tag, 0);
        if (!element) {
            return null;
        };
        return source.substring(element.contentStart, element.contentEnd);
    };

    /**
     * @function xmlWithout
     * @description A copy of the XML with the first element named tag removed, content and all.
     * @param {string} xml
     * @param {string} tag
     * @returns {string}
     */
    function xmlWithout(xml, tag) {
        var source = String(xml);
        var element = findXmlElement(source, tag, 0);
        if (!element) {
            return source;
        };
        return source.substring(0, element.start) + source.substring(element.end);
    };

    /**
     * @function soapPropertyValues
     * @description Reads an ObjectExtension's Name/Value pairs, as AsyncActivityStatus answers with:
     *              <Properties><Property><Name>Status</Name><Value>Complete</Value></Property>...</Properties>.
     * @param {string} block - one Results block
     * @returns {Object} value by name, empty when the block has none
     */
    function soapPropertyValues(block) {
        var values = {};
        var propertiesXml = xmlRaw(block, 'Properties');
        if (!propertiesXml) {
            return values;
        };
        var properties = xmlBlocks(propertiesXml, 'Property');
        for (var i = 0; i < properties.length; i++) {
            var name = xmlValue(properties[i], 'Name');
            if (name) {
                values[name] = xmlValue(properties[i], 'Value');
            };
        };
        return values;
    };

    /**
     * @function xmlValue
     * @description First inner text of a tag (optionally namespace-prefixed), entity-decoded. Use for leaf values.
     * @param {string} xml
     * @param {string} tag
     * @returns {string|null}
     */
    function xmlValue(xml, tag) {
        var raw = xmlRaw(xml, tag);
        if (raw === null) {
            return null;
        };
        return xmlDecode(raw);
    };

    /**
     * @function xmlBlocks
     * @description All inner XML occurrences of a tag (optionally namespace-prefixed), not decoded (blocks hold nested XML).
     * @param {string} xml
     * @param {string} tag
     * @returns {string[]}
     */
    function xmlBlocks(xml, tag) {
        var blocks = [];
        if (!xml) {
            return blocks;
        };
        var source = String(xml);
        /* Each search starts after the element before it, so the loop always ends. */
        var element = findXmlElement(source, tag, 0);
        while (element) {
            blocks.push(source.substring(element.contentStart, element.contentEnd));
            element = findXmlElement(source, tag, element.end);
        };
        return blocks;
    };

    /**
     * @function xmlParentFolderId
     * @description Reads the nested <ParentFolder><ID> of a DataFolder result block.
     * @param {string} block
     * @returns {string|null}
     */
    function xmlParentFolderId(block) {
        var parentBlock = xmlRaw(block, 'ParentFolder');
        if (parentBlock === null) {
            return null;
        };
        return xmlValue(parentBlock, 'ID');
    };

    /* ---------------------- 3.4. HTTP and SOAP helpers ------------------------ */

    /**
     * @function toStatusNumber
     * @description Turns an HTTP status from Script.Util.HttpRequest into a JavaScript number. The org
     *              probe showed it is a CLR value: === 401, == 401 and even Number() === 401 are all
     *              false for it, while String() gives "401".
     * @param {*} value - res.statusCode.
     * @returns {number} the status, or 0 when it cannot be read.
     */
    function toStatusNumber(value) {
        var statusNumber = parseInt(String(value), 10);
        return isNaN(statusNumber) ? 0 : statusNumber;
    };

    /**
     * @function httpJSON
     * @description Calls a REST endpoint and returns a normalised, never-throwing result.
     * @param {string} httpMethod - GET, POST, PATCH, DELETE, ...
     * @param {string} url
     * @param {Object} [body] - Serialised as JSON when provided.
     * @param {string} [token] - Bearer token; omitted for anonymous calls.
     * @returns {{status:number,text:string,json:Object|null}}
     */
    function httpJSON(httpMethod, url, body, token) {
        var req = new Script.Util.HttpRequest(url);
        req.method = httpMethod;
        req.contentType = 'application/json';
        req.encoding = 'UTF-8';
        req.continueOnError = true;
        /* 0, not true: the org probe showed true throws "System.Boolean cannot be converted to
        System.Byte", although the documentation calls the property a Boolean. */
        req.emptyContentHandling = 0;
        /* Never retry writes: a retried POST could create a second Data Extension or Query Activity. */
        req.retries = (httpMethod === 'GET') ? 1 : 0;
        if (token) {
            req.setHeader('Authorization', 'Bearer ' + token);
        };
        if (body !== null && body !== undefined) {
            req.postData = Stringify(body);
        };

        apiCallCount++;
        var res = null;
        try {
            res = req.send();
        } catch (sendErr) {
            /* The contract is "never throws": a request that fails outright comes back as status 0
            with the error text, so every caller's non-2xx path handles it. */
            var failedResult = {
                status: 0,
                text: 'Request failed: ' + describeError(sendErr),
                json: null
            };
            return failedResult;
        };
        var text = (res.content === null || res.content === undefined) ? '' : String(res.content);
        var json = null;
        if (text.length > 0) {
            try {
                json = Platform.Function.ParseJSON(text);
            } catch (parseErr) {
                json = null;
            };
        };

        var result = {
            status: toStatusNumber(res.statusCode),
            text: text,
            json: json
        };
        return result;
    };

    /**
     * @function soap
     * @description Sends a SOAP envelope to the tenant Service.asmx endpoint with the user token.
     * @param {string} action - The SOAPAction header, e.g. Retrieve, Create, Update, Delete.
     * @param {string} bodyXml - The inner XML placed inside <s:Body>.
     * @param {string} token
     * @returns {{status:number,httpStatus:string,ok:boolean,overallStatus:string|null,requestId:string|null,results:string[],raw:string}}
     */
    function soap(action, bodyXml, token) {
        var envelope = '<?xml version="1.0" encoding="UTF-8"?>' +
            '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
            '<s:Header><fueloauth xmlns="http://exacttarget.com">' + token + '</fueloauth></s:Header>' +
            '<s:Body>' + bodyXml + '</s:Body>' +
            '</s:Envelope>';

        var req = new Script.Util.HttpRequest(soapURL);
        req.method = 'POST';
        req.contentType = 'text/xml; charset=UTF-8';
        req.encoding = 'UTF-8';
        req.continueOnError = true;
        /* 0, not true: the org probe showed true throws "System.Boolean cannot be converted to System.Byte". */
        req.emptyContentHandling = 0;
        /* No retries: MCE ends a Code Resource call that runs too long with a 408, and a retried slow
        SOAP call spends that time twice. The app retries its read-only actions once on its own. */
        req.retries = 0;
        req.setHeader('SOAPAction', action);
        req.postData = envelope;
        apiCallCount++;
        var res = null;
        try {
            res = req.send();
        } catch (sendErr) {
            var failedSoap = {
                status: 0,
                httpStatus: '',
                ok: false,
                overallStatus: 'Error',
                requestId: null,
                results: [],
                raw: 'Request failed: ' + describeError(sendErr)
            };
            return failedSoap;
        };
        var raw = (res.content === null || res.content === undefined) ? '' : String(res.content);
        var overallStatus = xmlValue(raw, 'OverallStatus');

        /* The envelope decides success: OverallStatus says whether the request worked, and a SOAP
        fault has none. The HTTP status goes into the error details. */
        var result = {
            status: toStatusNumber(res.statusCode),
            httpStatus: String(res.statusCode),
            ok: !isSoapError(overallStatus),
            overallStatus: overallStatus,
            requestId: xmlValue(raw, 'RequestID'),
            results: xmlBlocks(raw, 'Results'),
            raw: raw
        };
        return result;
    };

    /**
     * @function likeFilter
     * @description Builds a "Field%20like%20'value'" REST $filter fragment matching MCE's own examples.
     * @param {string} field
     * @param {string} value
     * @returns {string}
     */
    function likeFilter(field, value) {
        var safeValue = ('' + value).split('\'').join('');
        return urlEncode(String(field)) + '%20like%20%27' + urlEncode(safeValue) + '%27';
    };

    /**
     * @function urlEncode
     * @description Percent-encodes a value for use in a query string.
     * @param {*} value
     * @returns {string}
     */
    function urlEncode(value) {
        var text = String(value);
        var result = '';
        var hex = '0123456789ABCDEF';
        for (var i = 0; i < text.length; i++) {
            var ch = text.charAt(i);
            var charCode = text.charCodeAt(i);
            var isSafe = (charCode >= 65 && charCode <= 90) || (charCode >= 97 && charCode <= 122) || (charCode >= 48 && charCode <= 57) ||
                ch === '-' || ch === '_' || ch === '.' || ch === '~';
            if (isSafe) {
                result += ch;
            } else if (charCode < 128) {
                result += '%' + hex.charAt((charCode >> 4) & 0xF) + hex.charAt(charCode & 0xF);
            } else if (charCode < 2048) {
                var b1 = 0xC0 | (charCode >> 6);
                var b2 = 0x80 | (charCode & 0x3F);
                result += '%' + hex.charAt((b1 >> 4) & 0xF) + hex.charAt(b1 & 0xF);
                result += '%' + hex.charAt((b2 >> 4) & 0xF) + hex.charAt(b2 & 0xF);
            } else {
                var b1x = 0xE0 | (charCode >> 12);
                var b2x = 0x80 | ((charCode >> 6) & 0x3F);
                var b3x = 0x80 | (charCode & 0x3F);
                result += '%' + hex.charAt((b1x >> 4) & 0xF) + hex.charAt(b1x & 0xF);
                result += '%' + hex.charAt((b2x >> 4) & 0xF) + hex.charAt(b2x & 0xF);
                result += '%' + hex.charAt((b3x >> 4) & 0xF) + hex.charAt(b3x & 0xF);
            };
        };
        return result;
    };

    /* ---------------------- 3.5. Validation helpers ---------------------------- */

    /**
     * @function isArray
     * @description ES3-safe replacement for Array.isArray.
     * @param {*} value
     * @returns {boolean}
     */
    function isArray(value) {
        return Object.prototype.toString.call(value) === '[object Array]';
    };

    /**
     * @function trimString
     * @description ES3-safe replacement for String.prototype.trim, with charAt and substring only. On
     *              the first org deployment the regular-expression version failed with "Object expected:
     *              replace" in listRuns and the Data Extension search action 0.6.0 removed, both of
     *              which called it twice in a row with no other regular expression in between [likely
     *              the trigger].
     * @param {string} value
     * @returns {string}
     */
    function trimString(value) {
        /* Concatenation, not String(): whatever failed in listRuns, this calls no function. */
        var text = '' + value;
        var start = 0;
        var end = text.length;
        while (start < end && ' \t\n\r\f\v\u00a0'.indexOf(text.charAt(start)) !== -1) {
            start++;
        };
        while (end > start && ' \t\n\r\f\v\u00a0'.indexOf(text.charAt(end - 1)) !== -1) {
            end--;
        };
        return text.substring(start, end);
    };

    /**
     * @function requireString
     * @description Validates that a value is a string within a length range; throws BAD_REQUEST otherwise.
     * @param {*} value
     * @param {string} fieldName
     * @param {number} minLen
     * @param {number} [maxLen] - null/undefined = unbounded.
     * @returns {string} the original value.
     */
    function requireString(value, fieldName, minLen, maxLen) {
        if (typeof value !== 'string') {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be a string.', null);
        };
        var trimmed = trimString(value);
        var isTooShort = trimmed.length < minLen;
        var isTooLong = (maxLen !== null && maxLen !== undefined) && trimmed.length > maxLen;
        if (isTooShort || isTooLong) {
            var bound = (maxLen === null || maxLen === undefined) ? (minLen + ' or more') : (minLen + ' to ' + maxLen);
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be ' + bound + ' characters.', null);
        };
        return value;
    };

    /**
     * @function requireInt
     * @description Validates that a value is an integer within range; throws BAD_REQUEST otherwise.
     * @param {*} value
     * @param {string} fieldName
     * @param {number} [min]
     * @param {number} [max]
     * @returns {number}
     */

        var n = value;
        if (typeof n === 'string' && /^-?[0-9]+$/.test(n)) {
            n = parseInt(n, 10);
        };
        if (typeof n !== 'number' || isNaN(n) || Math.floor(n) !== n) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be an integer.', null);
        };
        if (min !== null && min !== undefined && n < min) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be at least ' + min + '.', null);
        };
        if (max !== null && max !== undefined && n > max) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be at most ' + max + '.', null);
        };
        return n;
    };

    /**
     * @function requireGuid
     * @description Validates that a value looks like a GUID (as used by session ids and MCE object ids).
     * @param {*} value
     * @param {string} fieldName
     * @returns {string}
     */
    function requireGuid(value, fieldName) {
        requireString(value, fieldName, 1, 64);
        if (!/^[0-9a-fA-F-]{36}$/.test(value)) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be a valid GUID.', null);
        };
        return value;
    };

    /**
     * @function requireTaskId
     * @description Validates a SOAP Perform Task ID (actionRunQuery's taskId, read back by
     *              getRunOutcome): letters, digits and hyphens only, 1 to 64 characters. The
     *              exact shape Marketing Cloud Engagement returns is not documented, so this only
     *              guards against a value that is clearly not an identifier.
     * @param {*} value
     * @param {string} fieldName
     * @returns {string}
     */
    function requireTaskId(value, fieldName) {
        requireString(value, fieldName, 1, 64);
        if (!/^[A-Za-z0-9-]+$/.test(value)) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must contain only letters, digits and hyphens.', null);
        };
        return value;
    };

    /**
     * @function requireArray
     * @description Validates that a value is an array; throws BAD_REQUEST otherwise.
     * @param {*} value
     * @param {string} fieldName
     * @returns {Array}
     */
    function requireArray(value, fieldName) {
        if (!isArray(value)) {
            throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be an array.', null);
        };
        return value;
    };

    /**
     * @function validateColumns
     * @description Validates the runQuery column list per the naming rules in the spec.
     * @param {*} columns
     * @returns {string[]} the trimmed, validated column names.
     */
    function validateColumns(columns) {
        requireArray(columns, 'columns');
        if (columns.length < 1 || columns.length > 500) {
            throw apiError('BAD_REQUEST', 'Field "columns" must contain 1 to 500 items.', null);
        };

        var validPattern = /^[A-Za-z0-9 _.-]+$/;
        var allDigits = /^[0-9]+$/;
        var cleaned = [];
        var offenders = [];
        var seen = {};

        for (var i = 0; i < columns.length; i++) {
            var raw = columns[i];
            if (typeof raw !== 'string') {
                offenders.push(String(raw));
                continue;
            };
            var trimmed = trimString(raw);
            var isBad = false;

            if (trimmed.length < 1 || trimmed.length > 128) {
                isBad = true;
            };
            if (!isBad && !validPattern.test(trimmed)) {
                isBad = true;
            };
            if (!isBad && trimmed.charAt(0) === '_') {
                isBad = true;
            };
            if (!isBad && allDigits.test(trimmed)) {
                isBad = true;
            };
            var lower = trimmed.toLowerCase();
            if (!isBad && seen.hasOwnProperty(lower)) {
                isBad = true;
            };

            if (isBad) {
                offenders.push(raw);
            } else {
                seen[lower] = true;
                cleaned.push(trimmed);
            };
        };

        if (offenders.length > 0) {
            throw apiError('BAD_REQUEST', 'Invalid column name(s): ' + offenders.join(', '), null);
        };
        return cleaned;
    };

    /* What a typed column of a run's temporary Data Extension may hold. Marketing Cloud Engagement
    documents a Decimal field's MaxLength (its precision) as 29 at most and its Scale as 8 at most
    (the Fields.Add reference in the MCE developer documentation), and Create refuses more. */
    var DECIMAL_MAX_PRECISION = 29;
    var DECIMAL_MAX_SCALE = 8;
    var DECIMAL_DEFAULT_PRECISION = 18;
    var DECIMAL_DEFAULT_SCALE = 4;

    /**
     * @function isWholeNumberIn
     * @description Tells whether a value is a whole number of type number within a range. A string is
     *              not one: a column type is read strictly, and anything else becomes Text.
     * @param {*} value
     * @param {number} min
     * @param {number} max
     * @returns {boolean}
     */
    function isWholeNumberIn(value, min, max) {
        return typeof value === 'number' && !isNaN(value) && Math.floor(value) === value && value >= min && value <= max;
    };

    /**
     * @function validateColumnType
     * @description Reads one runQuery column type strictly. Date, Number and Boolean pass by name, and
     *              a Decimal needs a whole precision from 1 to 29 and a whole scale from 0 to the smaller
     *              of the precision and 8, taking 18 and 4 (4 at most the precision) for either that is
     *              absent. Anything else, an unknown type, Text included, a value that is not an object
     *              or a Decimal with a bad precision or scale, is Text (null). Never throws: a column
     *              type is a request for better fields, and the run does not fail over it.
     * @param {*} entry - { type, precision?, scale? } as the frontend sends it.
     * @returns {?Object} { type } or, for a Decimal, { type, precision, scale }; null for Text.
     */
    function validateColumnType(entry) {
        if (entry === null || entry === undefined || typeof entry !== 'object' || isArray(entry)) {
            return null;
        };
        var type = entry.type;
        if (type === 'Date' || type === 'Number' || type === 'Boolean') {
            return { type: type };
        };
        if (type !== 'Decimal') {
            return null;
        };
        var precision = DECIMAL_DEFAULT_PRECISION;
        if (entry.precision !== undefined && entry.precision !== null) {
            if (!isWholeNumberIn(entry.precision, 1, DECIMAL_MAX_PRECISION)) {
                return null;
            };
            precision = entry.precision;
        };
        var scale = (DECIMAL_DEFAULT_SCALE < precision) ? DECIMAL_DEFAULT_SCALE : precision;
        if (entry.scale !== undefined && entry.scale !== null) {
            var maxScale = (precision < DECIMAL_MAX_SCALE) ? precision : DECIMAL_MAX_SCALE;
            if (!isWholeNumberIn(entry.scale, 0, maxScale)) {
                return null;
            };
            scale = entry.scale;
        };
        var decimalType = {
            type: 'Decimal',
            precision: precision,
            scale: scale
        };
        return decimalType;
    };

    /**
     * @function validateColumnTypes
     * @description Reads the optional runQuery columnTypes into one entry per column, in the columns'
     *              order: the validated type, or null (Text). A missing, non-array or too short list
     *              gives Text for the columns it does not cover, and entries past the last column are
     *              ignored. Never throws.
     * @param {*} columnTypes - the payload's columnTypes, whatever it is.
     * @param {number} count - how many columns the run has.
     * @returns {Array} count entries, each an object or null.
     */
    function validateColumnTypes(columnTypes, count) {
        var validated = [];
        for (var i = 0; i < count; i++) {
            var entry = (isArray(columnTypes) && i < columnTypes.length) ? columnTypes[i] : null;
            validated.push(validateColumnType(entry));
        };
        return validated;
    };

    /* ---------------------- 3.6. Session, naming and misc helpers --------------- */

    /**
     * @function describeError
     * @description Turns a caught error into plain text for ErrorLog or debug output: its message and
     *              description, with the client secret and the token key material masked in case a
     *              platform error ever quotes a request body or an argument, cut to 2000 characters.
     * @param {*} err - Whatever was caught.
     * @returns {string}
     */

        var text = '';
        try {
            text = (err && err.message) ? String(err.message) : String(err);
            if (err && err.description) {
                text += ' ' + String(err.description);
            };
        } catch (describeErr) {
            text = 'Unknown error';
        };
        if (clientSecret && String(clientSecret).length > 3) {
            text = text.split(String(clientSecret)).join('[redacted]');
        };
        if (tokenKeyMaterial) {
            text = text.split(tokenKeyMaterial.password).join('[redacted]');
            text = text.split(tokenKeyMaterial.salt).join('[redacted]');
            text = text.split(tokenKeyMaterial.iv).join('[redacted]');
        };
        return truncate(text, 2000);
    };

    /**
     * @function truncate
     * @description Caps a string at a maximum length.
     * @param {*} text
     * @param {number} max
     * @returns {string}
     */
    function truncate(text, max) {
        var s = (text === null || text === undefined) ? '' : String(text);
        if (s.length > max) {
            return s.substring(0, max);
        };
        return s;
    };

    /**
     * @function padNumber
     * @description Zero-pads a number to a fixed width.
     * @param {number} value
     * @param {number} width
     * @returns {string}
     */
    function padNumber(value, width) {
        var text = String(value);
        while (text.length < width) {
            text = '0' + text;
        };
        return text;
    };

    /**
     * @function isoDate
     * @description Formats a Date as yyyy-MM-ddTHH:mm:ss.
     * @param {Date} date
     * @returns {string}
     */
    function isoDate(date) {
        var year = padNumber(date.getFullYear(), 4);
        var month = padNumber(date.getMonth() + 1, 2);
        var day = padNumber(date.getDate(), 2);
        var hours = padNumber(date.getHours(), 2);
        var minutes = padNumber(date.getMinutes(), 2);
        var seconds = padNumber(date.getSeconds(), 2);
        return year + '-' + month + '-' + day + 'T' + hours + ':' + minutes + ':' + seconds;
    };

    /**
     * @function fnvMultiply32
     * @description Multiplies two 32-bit unsigned integers modulo 2^32 using 16-bit halves, so the
     *              intermediate products never exceed the float-safe integer range (avoids Math.imul,
     *              which the SSJS engine does not provide).
     * @param {number} a
     * @param {number} b
     * @returns {number} unsigned 32-bit product.
     */
    function fnvMultiply32(a, b) {
        var aLow = a & 0xffff;
        var aHigh = (a >>> 16) & 0xffff;
        var bLow = b & 0xffff;
        var bHigh = (b >>> 16) & 0xffff;
        var cross = (aHigh * bLow + aLow * bHigh) & 0xffff;
        return ((cross << 16) + aLow * bLow) >>> 0;
    };

    /**
     * @function toHex8
     * @description Formats an unsigned 32-bit integer as exactly 8 lowercase hex characters.
     * @param {number} value
     * @returns {string}
     */
    function toHex8(value) {
        var hex = (value >>> 0).toString(16);
        while (hex.length < 8) {
            hex = '0' + hex;
        };
        return hex;
    };

    /**
     * @function fnv1aHex
     * @description Pure-JavaScript FNV-1a 32-bit hash of a string, as 8 lowercase hex characters.
     *              No platform/native hashing functions are used.
     * @param {string} text
     * @returns {string}
     */
    function fnv1aHex(text) {
        var str = '' + text;
        var hash = 2166136261; // FNV-1a 32-bit offset basis (0x811c9dc5)
        for (var i = 0; i < str.length; i++) {
            hash = hash ^ str.charCodeAt(i);
            hash = fnvMultiply32(hash, 16777619); // FNV prime (0x01000193)
        };
        return toHex8(hash);
    };

    /**
     * @function computeUserHash
     * @description 8-hex-char FNV-1a hash identifying a user: the lowercased AuthLog userId, which
     *              sign-in took from /v2/userinfo (user.sub, else user.preferred_username). The
     *              e-mail is never part of it: an address can change or be reused. The 8 characters
     *              are all a Data Extension key has room for (see makeTempDeKey).
     * @param {Object} authRow
     * @returns {string}
     * @throws {Object} apiError SESSION_INVALID when the session has no userId, since every such
     *         session would then share one user's Query Activities and Data Extensions.
     */
    function computeUserHash(authRow) {
        var userId = trimString((authRow && authRow.userId) ? authRow.userId : '');
        if (userId === '') {
            throw apiError('SESSION_INVALID', 'No session found. Please sign in again.', null);
        };
        return fnv1aHex(userId.toLowerCase());
    };

    /* The longest user id the Auth Log's userId field takes (Text 100). A longer one is not a usable
    id: the upsert would fail on it, and read as an old Auth Log layout. */
    var USER_ID_MAX_LENGTH = 100;

    /**
     * @function pickUserIdentity
     * @description Reads who signed in from the "user" object of /v2/userinfo: its `sub`, the user id,
     *              or, when that is missing, its `preferred_username`, the Marketing Cloud Engagement
     *              username. The e-mail is never used: it is for display only.
     * @param {?Object} user - json.user of the /v2/userinfo answer
     * @returns {{userId: string, source: string}} source is 'sub' or 'preferred_username'. Both are
     *          '' when the object holds neither, or holds one that is blank or longer than the Auth
     *          Log's userId field.
     */
    function pickUserIdentity(user) {
        var identity = {
            userId: '',
            source: ''
        };
        if (!user) {
            return identity;
        };
        var sources = ['sub', 'preferred_username'];
        for (var i = 0; i < sources.length; i++) {
            var raw = user[sources[i]];
            if (raw === undefined || raw === null) {
                continue;
            };
            var text = trimString(String(raw));
            if (text !== '' && text.length <= USER_ID_MAX_LENGTH) {
                identity.userId = text;
                identity.source = sources[i];
                return identity;
            };
        };
        return identity;
    };

    /**
     * @function clearAmpVariables
     * @description Empties AMPscript variables that held a token or key material, so nothing stays in
     *              the request's variable table longer than the one call that needed it.
     * @param {string[]} names - '@name' each
     */
    function clearAmpVariables(names) {
        for (var i = 0; i < names.length; i++) {
            try {
                Platform.Variable.SetValue(names[i], '');
            } catch (clearErr) {
                // nothing more to do: the value only lives in this request's memory.
            };
        };
    };

    /**
     * @function sha256Hex
     * @description SHA256 of a text as 64 lowercase hex characters, from AMPscript's SHA256 through
     *              TreatAsContent, the way readRowCount reads DataExtensionRowCount. The AMPscript is
     *              built in pieces so this file never holds a literal AMPscript block for the page to
     *              run on its own. Salesforce's example output is lowercase, and the answer is
     *              lowercased in case an org returns it in capitals.
     * @param {string} text
     * @returns {string}
     * @throws {Object} apiError INTERNAL when the platform does not answer with 64 hex characters.
     */
    function sha256Hex(text) {
        var hashed = '';
        try {
            Platform.Variable.SetValue('@ssHashInput', String(text));
            hashed = String(Platform.Function.TreatAsContent('%' + '%=SHA256(@ssHashInput)=%' + '%')).toLowerCase();
        } catch (hashErr) {
            hashed = '';
        };
        clearAmpVariables(['@ssHashInput']);
        if (!/^[0-9a-f]{64}$/.test(hashed)) {
            throw apiError('INTERNAL', 'SQL Studio could not compute a SHA256 hash with AMPscript.', null);
        };
        return hashed;
    };

    /* The access token is stored encrypted, with AMPscript's EncryptSymmetric (AES). Salesforce's
    reference for it takes a password, a salt as an 8-byte hex string (16 characters) and an IV as a
    16-byte hex string (32 characters). All three come from the clientSecret setting, so an admin sets
    nothing new: each is SHA256 of the secret plus a fixed label, the salt and the IV cut to length.
    A new secret makes every stored token unreadable and ends its session, which lasts about 20
    minutes anyway. All rows share that key, so the plain text also carries the row's own session key
    and user id, and a read accepts it only for that row: a ciphertext copied into another row, or a
    row whose userId was changed, reads as no session. The marker in front tells a token decrypted
    with the wrong key apart. */
    var TOKEN_KEY_LABEL = 'SQLStudio.access-token.v1';
    var TOKEN_PLAIN_PREFIX = 'ss2:';
    var AUTH_LOG_TOKEN_LENGTH = 2000;
    var tokenKeyMaterial = null;
    var CRYPT_VARIABLES = ['@ssCryptText', '@ssCryptPassword', '@ssCryptSalt', '@ssCryptIv'];

    /**
     * @function tokenKey
     * @description The password, salt and IV that encrypt and decrypt the stored access token, derived
     *              once per request from the clientSecret setting. The key material stays in this
     *              request's memory: it is never logged, returned or written.
     * @returns {{password: string, salt: string, iv: string}}
     */
    function tokenKey() {
        if (!tokenKeyMaterial) {
            tokenKeyMaterial = {
                password: sha256Hex(String(clientSecret) + '|' + TOKEN_KEY_LABEL + '|password'),
                salt: sha256Hex(String(clientSecret) + '|' + TOKEN_KEY_LABEL + '|salt').substring(0, 16),
                iv: sha256Hex(String(clientSecret) + '|' + TOKEN_KEY_LABEL + '|iv').substring(0, 32)
            };
        };
        return tokenKeyMaterial;
    };

    /**
     * @function cryptToken
     * @description Runs EncryptSymmetric or DecryptSymmetric over one text, through TreatAsContent, with
     *              the key from tokenKey(). The values go in through AMPscript variables and are cleared
     *              afterwards. A platform error is never passed on, as its text could quote an argument.
     * @param {string} functionName - 'EncryptSymmetric' or 'DecryptSymmetric'
     * @param {string} text
     * @returns {string} the answer, or '' when the platform failed
     */
    function cryptToken(functionName, text) {
        var key = tokenKey();
        var answer = '';
        try {
            Platform.Variable.SetValue('@ssCryptText', text);
            Platform.Variable.SetValue('@ssCryptPassword', key.password);
            Platform.Variable.SetValue('@ssCryptSalt', key.salt);
            Platform.Variable.SetValue('@ssCryptIv', key.iv);
            var rendered = Platform.Function.TreatAsContent('%' + '%=' + functionName +
                '(@ssCryptText, "aes", @null, @ssCryptPassword, @null, @ssCryptSalt, @null, @ssCryptIv)=%' + '%');
            /* A null or undefined answer is a failure: String() would turn it into "null", which looks
            like base64. */
            answer = (rendered === null || rendered === undefined) ? '' : String(rendered);
        } catch (cryptErr) {
            answer = '';
        };
        clearAmpVariables(CRYPT_VARIABLES);
        return answer;
    };

    /**
     * @function encryptToken
     * @description Encrypts an access token for one Auth Log row: AES through EncryptSymmetric, as base64
     *              text, over the marker, the row's session key, its user id and the token. It hands back
     *              only a ciphertext that decryptToken reads back to the same token for that row, so a
     *              platform that cannot encrypt, or cannot decrypt what it encrypted, stops the sign-in
     *              here instead of storing a session that no call can use.
     * @param {string} plainToken
     * @param {string} sessionKey - the row's session field, sha256Hex of the session id
     * @param {string} userId - the row's userId field
     * @returns {string} the ciphertext
     * @throws {Object} apiError INTERNAL when the token cannot be encrypted
     */
    function encryptToken(plainToken, sessionKey, userId) {
        var cipherText = cryptToken('EncryptSymmetric', TOKEN_PLAIN_PREFIX + sessionKey + '|' + trimString(userId) + '|' + plainToken);
        var isBase64 = /^[A-Za-z0-9+\/]+={0,2}$/.test(cipherText);
        var isCipherOk = isBase64 && cipherText.length <= AUTH_LOG_TOKEN_LENGTH && cipherText.indexOf(plainToken) === -1;
        if (!isCipherOk || decryptToken(cipherText, sessionKey, userId) !== plainToken) {
            throw apiError('INTERNAL', 'SQL Studio could not encrypt the session token in this account.', null);
        };
        return cipherText;
    };

    /**
     * @function decryptToken
     * @description Decrypts a stored access token with DecryptSymmetric, and gives it only to the row it
     *              was encrypted for: the session key and the user id inside must be this row's.
     * @param {string} cipherText - the Auth Log's token field
     * @param {string} sessionKey - the session key the row was looked up by
     * @param {string} userId - the row's userId field
     * @returns {string} the access token, or '' when it cannot be read: after a new clientSecret, for a
     *          value that encryptToken did not write, or for one written for another row or user

    function decryptToken(cipherText, sessionKey, userId) {

        var rowPrefix = TOKEN_PLAIN_PREFIX + sessionKey + '|';
        if (plainText.indexOf(rowPrefix) !== 0) {
            return '';
        };
        var rest = plainText.substring(rowPrefix.length);
        /* A token has no '|', so the last one ends the user id, whatever the id holds. */
        var separator = rest.lastIndexOf('|');
        if (separator < 0) {
            return '';
        };
        if (rest.substring(0, separator) !== trimString(userId)) {
            return '';
        };
        return rest.substring(separator + 1);
    };

    /**
     * @function slotSuffix
     * @description The suffix every per-user pool name/key carries for a slot: '' for slot 1 (so slot
     *              1 keeps today's exact shape), '_2' up to '_' + QUERY_SLOT_COUNT for the others.
     * @param {number} slot - 1 to QUERY_SLOT_COUNT
     * @returns {string}
     */
    function slotSuffix(slot) {
        return (slot === 1) ? '' : ('_' + slot);
    };

    /**
     * @function adHocActivityKey
     * @description The per-user ad-hoc Query Activity key/CustomerKey: 'SQLStudio_' + userHash (19
     *              chars) for slot 1, with '_2' to '_' + QUERY_SLOT_COUNT appended for the other slots
     *              in the pool (M6).
     * @param {string} userHash
     * @param {number} slot - 1 to QUERY_SLOT_COUNT
     * @returns {string}
     */
    function adHocActivityKey(userHash, slot) {
        return tempPrefix + userHash + slotSuffix(slot);
    };

    /**
     * @function adHocActivityName
     * @description The per-user ad-hoc Query Activity name: 'SQL Studio - <userName> - <userHash>' for
     *              slot 1, with ' - 2' to ' - ' + QUERY_SLOT_COUNT appended for the other slots in the
     *              pool (M6). userName is trimmed to 60 characters; a blank userName becomes 'user'.
     * @param {string} userName
     * @param {string} userHash
     * @param {number} slot - 1 to QUERY_SLOT_COUNT
     * @returns {string}
     */
    function adHocActivityName(userName, userHash, slot) {
        var name = trimString(userName || '');
        if (name === '') {
            name = 'user';
        };
        if (name.length > 60) {
            name = name.substring(0, 60);
        };
        var base = 'SQL Studio - ' + name + ' - ' + userHash;
        return (slot === 1) ? base : (base + ' - ' + slot);
    };

    /**
     * @function adHocActivityDescription
     * @description The fixed description stamped on the per-user ad-hoc Query Activity.
     * @param {string} userEmail
     * @returns {string}
     */
    function adHocActivityDescription(userEmail) {
        var email = trimString(userEmail || '');
        return 'Ad-hoc query activity used by SQL Studio for ' + email + '. Overwritten on every run. Safe to delete.';
    };

    /**
     * @function makeTempDeKey
     * @description Builds the temporary run Data Extension name/key: tempPrefix + userHash + '_' +
     *              yyyyMMdd_HHmmss (35 chars, under the 36-char key limit) for slot 1, with '_2' to
     *              '_' + QUERY_SLOT_COUNT appended for the other slots in the pool (M6). No random
     *              suffix beyond that: one slot never starts two runs in the same second through the UI.
     * @param {string} userHash
     * @param {number} slot - 1 to QUERY_SLOT_COUNT
     * @returns {string}
     */
    function makeTempDeKey(userHash, slot) {
        var nowDate = Platform.Function.Now();
        var stamp = padNumber(nowDate.getFullYear(), 4) + padNumber(nowDate.getMonth() + 1, 2) + padNumber(nowDate.getDate(), 2) +
            '_' + padNumber(nowDate.getHours(), 2) + padNumber(nowDate.getMinutes(), 2) + padNumber(nowDate.getSeconds(), 2);
        return tempPrefix + userHash + '_' + stamp + slotSuffix(slot);
    };

    /**
     * @function stripTempDeKeySlotSuffix
     * @description Removes a trailing slot suffix ('_2' up to '_' + QUERY_SLOT_COUNT, from a run on
     *              slot 2-QUERY_SLOT_COUNT) from a temporary Data Extension key, so every slot's key can
     *              be read as if it were slot 1's. A slot-1 key (ending in a 6-digit HHmmss stamp) never
     *              matches one of these suffixes, so it is always returned unchanged.
     * @param {string} key
     * @returns {string}
     */
    function stripTempDeKeySlotSuffix(key) {
        var text = '' + (key || '');
        for (var slot = 2; slot <= QUERY_SLOT_COUNT; slot++) {
            var suffix = slotSuffix(slot);
            if (text.length > suffix.length && text.substring(text.length - suffix.length) === suffix) {
                return text.substring(0, text.length - suffix.length);
            };
        };
        return text;
    };

    /**
     * @function tempDeKeyAgeSeconds
     * @description Returns how old a temporary run Data Extension is, from the yyyyMMdd_HHmmss stamp
     *              makeTempDeKey put in its key (any slot's - see stripTempDeKeySlotSuffix). The stamp
     *              and nowDate both come from the MCE server clock, so the age is right whatever time
     *              zone the browser is in.
     * @param {string} key - temporary Data Extension key
     * @param {Date} nowDate - Platform.Function.Now()
     * @returns {number|null} age in whole seconds, or null when the key carries no stamp.
     */
    function tempDeKeyAgeSeconds(key, nowDate) {
        /* Read with substring, not exec() capture groups, which misbehaved on the first org deployment. */
        var text = stripTempDeKeySlotSuffix(String(key || ''));
        var stamp = text.substring(text.length - 16);
        var digits = stamp.substring(1, 9) + stamp.substring(10);
        if (stamp.length !== 16 || stamp.charAt(0) !== '_' || stamp.charAt(9) !== '_' || !/^[0-9]{14}$/.test(digits)) {
            return null;
        };
        var stampDate = new Date(Number(digits.substring(0, 4)), Number(digits.substring(4, 6)) - 1, Number(digits.substring(6, 8)),
            Number(digits.substring(8, 10)), Number(digits.substring(10, 12)), Number(digits.substring(12, 14)));
        if (isNaN(stampDate.getTime())) {
            return null;
        };
        return Math.floor((nowDate.getTime() - stampDate.getTime()) / 1000);
    };

    /**
     * @function toNullableInt
     * @description Parses text to an integer, or null when empty/unparseable.
     * @param {*} text
     * @returns {number|null}
     */
    function toNullableInt(text) {
        if (text === null || text === undefined || text === '') {
            return null;
        };
        var n = parseInt(text, 10);
        if (isNaN(n)) {
            return null;
        };
        return n;
    };

    /**
     * @function computeExpiry
     * @description Computes the local Date at which a freshly issued token should be treated as expired.
     * @param {number} expiresIn - seconds, from the token response.
     * @returns {Date}
     */
    function computeExpiry(expiresIn) {
        /* As the author's Cloud Page App template does in production: setMinutes on the date
        SystemDateToLocalDate returns. expires_in comes from ParseJSON, so it is read through
        String(), and a value that cannot be read gives the usual 20-minute token lifetime. */
        var lifetimeSeconds = parseInt(String(expiresIn), 10);
        if (isNaN(lifetimeSeconds) || lifetimeSeconds < 300) {
            lifetimeSeconds = 1200;
        };
        var nowDate = Platform.Function.SystemDateToLocalDate(Platform.Function.Now());
        nowDate.setMinutes(nowDate.getMinutes() + Math.floor((lifetimeSeconds - 120) / 60));
        return nowDate;
    };

    /**
     * @function lookupSessionText
     * @description Reads one text field of the session's AuthLog row, blank when it is missing.
     * @param {string} fieldName
     * @param {string} sessionKey - the SHA256 of the session id, the way the row is keyed
     * @returns {string}
     */
    function lookupSessionText(fieldName, sessionKey) {
        var fieldValue = Platform.Function.Lookup(authDE, fieldName, ['appName', 'session'], [appName, sessionKey]);
        return (fieldValue === null || fieldValue === undefined) ? '' : String(fieldValue);
    };

    /**
     * @function secondsUntil
     * @description Computes whole seconds between now and a stored expiry value (Date or string).
     * @param {Date|string} tokenExpire
     * @returns {number}
     */
    function secondsUntil(tokenExpire) {
        var expireMs = toTimeMs(tokenExpire);
        if (expireMs === null) {
            return null;
        };
        var nowDate = Platform.Function.SystemDateToLocalDate(Platform.Function.Now());
        return Math.floor((expireMs - nowDate.getTime()) / 1000);
    };

    /**
     * @function toTimeMs
     * @description Reads a Date field value back from a Data Extension, whatever shape the platform
     *              returns it in: a Date, a number, an ISO string, a US string such as
     *              9/27/2026 3:45:00 PM, or a day.month.year string. Text is read as wall-clock
     *              components, the same way the value was written, so both sides of a comparison
     *              share one time basis. The first org deployment showed the plain new Date() path
     *              cannot be relied on.
     * @param {*} value - the field value.
     * @returns {number|null} milliseconds, or null when the value cannot be read.
     */
    function toTimeMs(value) {
        if (value === null || value === undefined || value === '') {
            return null;
        };
        try {
            if (typeof value === 'number') {
                return value;
            };
            if (typeof value.getTime === 'function') {
                var dateMs = value.getTime();
                return isNaN(dateMs) ? null : dateMs;
            };
        } catch (shapeErr) {
            // not a Date: read it as text below.
        };
        var text = String(value);
        var match = /^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(Z|[+-]\d{2}:?\d{2})?/.exec(text);
        if (match) {
            if (match[7]) {
                /* An explicit zone makes it an absolute time: read it as one, not as wall-clock text. */
                var offsetMinutes = 0;
                if (match[7] !== 'Z') {
                    var zoneDigits = String(match[7]).split(':').join('');
                    offsetMinutes = (Number(zoneDigits.substring(1, 3)) * 60 + Number(zoneDigits.substring(3, 5))) * (zoneDigits.charAt(0) === '-' ? -1 : 1);
                };
                return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]), Number(match[4]), Number(match[5]), Number(match[6] || 0)) - offsetMinutes * 60000;
            };
            return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), Number(match[4]), Number(match[5]), Number(match[6] || 0)).getTime();
        };
        match = /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/.exec(text);
        if (match) {
            var hours = Number(match[4]);
            if (match[7]) {
                var isPm = /^[Pp]/.test(match[7]);
                if (hours === 12) {
                    hours = isPm ? 12 : 0;
                } else if (isPm) {
                    hours = hours + 12;
                };
            };
            return new Date(Number(match[3]), Number(match[1]) - 1, Number(match[2]), hours, Number(match[5]), Number(match[6] || 0)).getTime();
        };
        match = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(text);
        if (match) {
            return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]), Number(match[4]), Number(match[5]), Number(match[6] || 0)).getTime();
        };
        var parsedMs = new Date(text).getTime();
        return isNaN(parsedMs) ? null : parsedMs;
    };

    /**
     * @function mergeKeysValues
     * @description Merges the .keys and .values maps of a rowset item into a single object.
     * @param {Object} item
     * @returns {Object}
     */
    function mergeKeysValues(item) {
        var merged = {};
        if (item && item.keys) {
            for (var k1 in item.keys) {
                if (item.keys.hasOwnProperty(k1)) {
                    merged[k1] = item.keys[k1];
                };
            };
        };
        if (item && item.values) {
            for (var k2 in item.values) {
                if (item.values.hasOwnProperty(k2)) {
                    merged[k2] = item.values[k2];
                };
            };
        };
        return merged;
    };

    /**
     * @function updateTypeIdFromName
     * @description Maps a targetUpdateTypeName to its numeric id.
     * @param {string} name
     * @returns {number}
     */
    function updateTypeIdFromName(name) {
        if (name === 'Overwrite') {
            return 0;
        };
        if (name === 'Update') {
            return 1;
        };
        if (name === 'Append') {
            return 2;
        };
        return 0;
    };

    /* ---------------------- 3.7. Data Extension provisioning (WSProxy) --------- */

    /**

     * @description Builds one WSProxy Text field definition.
     * @param {string} name
     * @param {?number} maxLength - null/undefined omits MaxLength (unbounded text).
     * @param {boolean} [isPrimaryKey]
     * @param {boolean} [isRequired]
     * @returns {Object}
     */
    function dataExtensionTextField(name, maxLength, isPrimaryKey, isRequired) {
        var field = {
            Name: name,
            FieldType: 'Text'
        };
        if (maxLength !== null && maxLength !== undefined) {
            field.MaxLength = maxLength;
        };
        if (isPrimaryKey) {
            field.IsPrimaryKey = true;
        };
        if (isRequired) {
            field.IsRequired = true;
        };
        return field;
    };

    /**
     * @function dataExtensionDateField
     * @description Builds one WSProxy Date field definition.
     * @param {string} name
     * @returns {Object}
     */
    function dataExtensionDateField(name) {
        var field = {
            Name: name,
            FieldType: 'Date'
        };
        return field;
    };

    /**
     * @function dataExtensionNumberField
     * @description Builds one WSProxy Number field definition.
     * @param {string} name
     * @returns {Object}
     */
    function dataExtensionNumberField(name) {
        var field = {
            Name: name,
            FieldType: 'Number'
        };
        return field;
    };

    /* What each Data Extension SQL Studio creates holds, and how long rows are kept: AuthLog rows
    are only useful for their roughly 20-minute session, errors are kept for troubleshooting. */
    var AUTH_LOG_DESCRIPTION = 'SQL Studio sign-in sessions. Each row maps the SHA256 of a session id to its Marketing Cloud Engagement access token, stored encrypted and valid for about 20 minutes. Keep the 1-day retention: rows are useless afterwards.';
    var ERROR_LOG_DESCRIPTION = 'SQL Studio backend errors, for troubleshooting. Rows are kept for 180 days.';
    var HISTORY_DESCRIPTION = 'SQL Studio query history: each user\'s runs, when server-side history is on. Rows are kept for 90 days.';
    var AUTH_LOG_RETENTION_DAYS = 1;
    var ERROR_LOG_RETENTION_DAYS = 180;
    var HISTORY_RETENTION_DAYS = 90;

    /**
     * @function authLogFields
     * @description Field definitions for an auto-created AuthLog Data Extension, matching
     *              docs/DEPLOYMENT.md section 1 ("AuthLog").
     * @returns {Object[]}

    function authLogFields() {
        return [
            dataExtensionTextField('session', 64, true, true),
            dataExtensionTextField('appName', 100),
            dataExtensionDateField('createdDate'),
            dataExtensionTextField('token', AUTH_LOG_TOKEN_LENGTH),
            dataExtensionDateField('tokenExpire'),
            dataExtensionTextField('userName', 100),
            dataExtensionTextField('userEmail', 254),
            dataExtensionTextField('userId', USER_ID_MAX_LENGTH)

    /**

     *              docs/DEPLOYMENT.md section 1 ("ErrorLog").

    function errorLogFields() {
        return [
            dataExtensionTextField('id', 36, true, true),
            dataExtensionTextField('appName', 100),
            dataExtensionTextField('errorMessage', 2000),
            dataExtensionTextField('errorDescription', 2000),
            dataExtensionDateField('errorDate')

    /**
     * @function historyLogFields
     * @description Field definitions for an auto-created server-side history Data Extension,

     *              MaxLength so long queries fit, matching what an admin is told to do when

    function historyLogFields() {

            dataExtensionTextField('userId', USER_ID_MAX_LENGTH, false, true),

    /**
