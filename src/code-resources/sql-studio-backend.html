            var seenTokenKeys = {};
            for (i = 0; i < entries.length; i++) {
                entry = entries[i];
                if (entry.isSkipped) {
                    continue;
                };
                if (entry.isEntKey && wsproxyDetails.hasOwnProperty('k:' + entry.readKey.toLowerCase())) {
                    entry.details = wsproxyDetails['k:' + entry.readKey.toLowerCase()];
                    continue;
                };
                if (!seenTokenKeys.hasOwnProperty('k:' + entry.readKey.toLowerCase())) {
                    seenTokenKeys['k:' + entry.readKey.toLowerCase()] = true;
                    tokenKeys.push(entry.readKey);
                };
            };

            var attempt = null;
            var tokenDetails = {};
            if (tokenKeys.length > 0) {
                attempt = retrieveWithExtrasRetry(function (askedExtras) {
                    return dataExtensionDetailsBody(tokenKeys, askedExtras);
                }, extras, authRow.token);
                if (!attempt.soapRes.ok) {
                    throw sfmcErrorFromSoap(attempt.soapRes);
                };
                for (i = 0; i < attempt.soapRes.results.length; i++) {
                    var parts = splitDataExtensionBlock(attempt.soapRes.results[i]);
                    var ownKey = xmlValue(parts.own, 'CustomerKey');
                    if (ownKey !== null && ownKey !== '') {
                        tokenDetails['k:' + ownKey.toLowerCase()] = parts;
                    };
                };
            };

            var items = [];
            var missing = [];
            for (i = 0; i < entries.length; i++) {
                entry = entries[i];
                var found = entry.details;
                if (found === null && !entry.isSkipped && tokenDetails.hasOwnProperty('k:' + entry.readKey.toLowerCase())) {
                    found = tokenDetails['k:' + entry.readKey.toLowerCase()];
                };
                if (found === null) {
                    missing.push(entry.key);
                } else {
                    items.push({
                        key: entry.key,
                        sendableField: found.sendableField,
                        sendableSubscriberField: found.sendableSubscriberField,
                        templateKey: found.templateKey,
                        description: found.description
                    });
                };
            };

            var data = {
                items: items,
                missing: missing
            };
            if (attempt !== null && attempt.extrasUnavailable !== null) {
                data.extrasUnavailable = attempt.extrasUnavailable;
                data.extrasUnnamed = attempt.extrasUnnamed;
                data.extrasError = attempt.extrasError;
            };
            return data;
        };

        /**
         * @function actionValidateQuery
         * @description Validates a query's SQL against MCE's own validate endpoint, without running it.
         * @param {Object} payload - { sql }
         * @param {Object} authRow
         * @returns {{valid: boolean, errors: string[]}}
         */
        function actionValidateQuery(payload, authRow) {
            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var res = httpJSON('POST', restBase + '/automation/v1/queries/actions/validate/', { Text: sql }, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var errors = [];
            if (body.errors) {
                for (var i = 0; i < body.errors.length; i++) {
                    var e = body.errors[i];
                    /* MCE's own text, which reaches the app: masked as an error's text is. */
                    if (typeof e === 'string') {
                        errors.push(maskSecrets(e));
                    } else if (e && typeof e.message === 'string') {
                        errors.push(maskSecrets(e.message));
                    } else {
                        errors.push(maskSecrets(Stringify(e)));
                    };
                };
            };

            var data = {
                valid: body.queryValid === true,
                errors: errors
            };
            return data;
        };

        /* Free reads (no API call) of a run's own temporary Data Extension. ROW_MARK_FIELD is an
        extra column whose default value fills it in every row the query writes, so
        LookupOrderedRows, which needs a filter, can select every row. It returns at most 2,000. */
        var ROW_MARK_FIELD = 'SQLStudioRowMark';
        var ROW_MARK_VALUE = '1';
        var FREE_READ_MAX_ROWS = 2000;

        /**
         * @function canCarryRowMark
         * @description Tells whether a run's temporary Data Extension can have the row-mark column: not
         *              when one of the query's own columns already has that name.
         * @param {string[]} columns
         * @returns {boolean}
         */
        function canCarryRowMark(columns) {
            for (var i = 0; i < columns.length; i++) {
                if (String(columns[i]).toLowerCase() === ROW_MARK_FIELD.toLowerCase()) {
                    return false;
                };
            };
            return true;
        };

        /**
         * @function isOwnTempDeKey
         * @description Tells whether a key names one of the calling user's own temporary Data Extensions
         *              (SQLStudio_<userHash>_yyyyMMdd_HHmmss, from any slot in the pool - a slot
         *              2-QUERY_SLOT_COUNT suffix is stripped before the check). The free reads run as
         *              this Code Resource, not with the user's token, so they are limited to these -
         *              never another user's hash, whichever slot ran it. Compared without regard to
         *              case, as Marketing Cloud Engagement matches a CustomerKey, so the answer is the
         *              same for every spelling of one key. The hash is lowercase hex, so no two users'
         *              keys differ only in case.
         * @param {Object} authRow
         * @param {string} deKey
         * @returns {boolean}
         */
        function isOwnTempDeKey(authRow, deKey) {
            var userHash = computeUserHash(authRow);
            var ownKeyPattern = new RegExp('^' + (tempPrefix + userHash).toLowerCase() + '_[0-9]{8}_[0-9]{6}$');
            return ownKeyPattern.test(stripTempDeKeySlotSuffix(String(deKey || '')).toLowerCase());
        };

        /**
         * @function readRowCount
         * @description Counts a Data Extension's rows with AMPscript's DataExtensionRowCount, a data
         *              function that is not an API call. The AMPscript is built in pieces so this file never
         *              holds a literal AMPscript block for the page to run on its own.
         * @param {string} deName
         * @returns {?number} the count, or null when it cannot be read: a Data Extension in another
         *          Business Unit than this Code Resource, or a platform that refuses the call.
         */
        function readRowCount(deName) {
            try {
                Platform.Variable.SetValue('@ssRowCountDe', deName);
                var rendered = Platform.Function.TreatAsContent('%' + '%=DataExtensionRowCount(@ssRowCountDe)=%' + '%');
                var rowCount = parseInt(String(rendered), 10);
                return isNaN(rowCount) ? null : rowCount;
            } catch (rowCountErr) {
                return null;
            };
        };

        /**
         * @function readRowsFree
         * @description Reads one page of a run's results with LookupOrderedRows, which is not an API call,
         *              or returns null so the caller reads it through REST: past the first 2,000 rows, when
         *              the row count cannot be read, when fewer marked rows come back than the count
         *              promises (the column default was not applied), or when more come back than the
         *              count says, also after a second count read (the count is behind the rows). The
         *              REST rowset then answers the true count. It asks for one row past the page, up to
         *              FREE_READ_MAX_ROWS, so a count behind at exactly the page's last row shows too. A
         *              count behind at a value past that row is not seen on this page, only on a later one.
         * @param {string} deKey
         * @param {string[]} columns
         * @param {number} page
         * @param {number} pageSize
         * @param {?string} orderBy - "Field" or "Field ASC|DESC"
         * @returns {?Object} the same shape as actionGetResults, with readPath 'free'
         */
        function readRowsFree(deKey, columns, page, pageSize, orderBy) {
            var wanted = page * pageSize;
            if (wanted > FREE_READ_MAX_ROWS) {
                return null;
            };
            var rowCount = readRowCount(deKey);
            if (rowCount === null) {
                return null;
            };
            var orderText = ROW_MARK_FIELD + ' ASC';
            if (orderBy) {
                orderText = /\s(ASC|DESC)$/.test(orderBy) ? orderBy : orderBy + ' ASC';
            };
            /* One row past the page, so a count that ends at the page's last row while more rows follow
            is caught below. LookupOrderedRows returns at most FREE_READ_MAX_ROWS rows. */
            var lookupCount = Math.min(wanted + 1, FREE_READ_MAX_ROWS);
            var marked = null;
            try {
                marked = Platform.Function.LookupOrderedRows(deKey, lookupCount, orderText, ROW_MARK_FIELD, ROW_MARK_VALUE);
            } catch (lookupErr) {
                return null;
            };
            var markedCount = marked ? marked.length : 0;
            /* A count lower than the marked rows found is behind them. On the author's org it answered 0
            for a temporary Data Extension whose rows LookupOrderedRows already returned (2026-10-02: four
            tabs at once, and a sorted page of a run that had finished 7 minutes before). It is read once
            more, and a count still lower sends the page to REST. The count is never taken from the marked
            rows: with a count behind them, nothing shows that the row mark's default reached every row. */
            if (markedCount > rowCount) {
                rowCount = readRowCount(deKey);
                if (rowCount === null || markedCount > rowCount) {
                    return null;
                };
            };
            if (markedCount < Math.min(wanted, rowCount)) {
                return null;
            };
            /* The row past the page was only a check: the page ends at wanted. */
            var lastRow = Math.min(markedCount, wanted);
            var rows = [];
            for (var i = (page - 1) * pageSize; i < lastRow; i++) {
                var rowValues = [];
                for (var c = 0; c < columns.length; c++) {
                    var value = marked[i][columns[c]];
                    rowValues.push((value === null || value === undefined) ? null : String(value));
                };
                rows.push(rowValues);
            };
            var data = {
                count: rowCount,
                page: page,
                pageSize: pageSize,
                columns: columns,
                rows: rows,
                readPath: 'free'
            };
            return data;
        };

        /**
         * @function buildColumnFieldXml
         * @description Builds the DataExtensionField XML of one output column: Text unless the column has
         *              a validated type. A Decimal carries its precision as MaxLength, which is where
         *              Marketing Cloud Engagement keeps it (Fields.Add documents MaxLength as the
         *              number of digits before and after the point, and DataExtensionField has no
         *              working Precision: the WSDL marks Precision "reserved for future use", and a
         *              retrieve of a Decimal field answers with MaxLength and Scale), followed by its
         *              Scale. The WSDL lists Scale before MaxLength, and so does this. Every field is
         *              nullable (IsRequired false), whatever its type.
         * @param {string} name - The column name.
         * @param {?Object} columnType - A validateColumnType result, or null for Text.
         * @returns {string} The Field element.
         */
        function buildColumnFieldXml(name, columnType) {
            var fieldType = columnType ? columnType.type : 'Text';
            var decimalXml = '';
            if (fieldType === 'Decimal') {
                decimalXml = '<Scale>' + columnType.scale + '</Scale>' +
                    '<MaxLength>' + columnType.precision + '</MaxLength>';
            };
            var fieldXml = '<Field xsi:type="DataExtensionField">' +
                '<Name>' + xmlEscape(name) + '</Name>' +
                '<FieldType>' + fieldType + '</FieldType>' +
                decimalXml +
                '<IsRequired>false</IsRequired>' +
                '<IsPrimaryKey>false</IsPrimaryKey>' +
                '</Field>';
            return fieldXml;
        };

        /**
         * @function buildDataExtensionCreateXml
         * @description Builds the SOAP CreateRequest XML for the temporary Data Extension a run creates:
         *              one field per output column, Text unless the column has a type (a plain reference
         *              to a Date, Number, Decimal or Boolean field, see actionRunQuery), optionally with
         *              the one-day retention policy (createTempDataExtension retries once without it,
         *              since some orgs reject DataRetentionPeriodLength on Create).
         * @param {string} key - CustomerKey/Name for the new Data Extension.
         * @param {string[]} columns - Output column names, each becomes a field.
         * @param {?number} deFolderId - CategoryID to file it under, or null to omit.
         * @param {boolean} hasRetention - Whether to include the one-day retention block.
         * @param {Array} [columnTypes] - Validated types (validateColumnTypes), one per column; a missing list is every column Text.
         * @returns {string} The CreateRequest SOAP body XML.
         */
        function buildDataExtensionCreateXml(key, columns, deFolderId, hasRetention, columnTypes) {
            var fieldsXml = '';
            for (var i = 0; i < columns.length; i++) {
                var columnType = (columnTypes && i < columnTypes.length) ? columnTypes[i] : null;
                fieldsXml += buildColumnFieldXml(columns[i], columnType);
            };
            if (canCarryRowMark(columns)) {
                /* The query never writes this column, so its default fills it in every row: a free
                LookupOrderedRows can then filter on it (see readRowsFree). */
                fieldsXml += '<Field xsi:type="DataExtensionField">' +
                    '<Name>' + ROW_MARK_FIELD + '</Name>' +
                    '<FieldType>Text</FieldType>' +
                    '<MaxLength>1</MaxLength>' +
                    '<IsRequired>false</IsRequired>' +
                    '<IsPrimaryKey>false</IsPrimaryKey>' +
                    '<DefaultValue>' + ROW_MARK_VALUE + '</DefaultValue>' +
                    '</Field>';
            };

            var retentionXml = '';
            if (hasRetention) {
                retentionXml =
                    '<DataRetentionPeriodLength>1</DataRetentionPeriodLength>' +
                    '<DataRetentionPeriod>Days</DataRetentionPeriod>' +
                    '<RowBasedRetention>false</RowBasedRetention>' +
                    '<ResetRetentionPeriodOnImport>false</ResetRetentionPeriodOnImport>' +
                    '<DeleteAtEndOfRetentionPeriod>false</DeleteAtEndOfRetentionPeriod>';
            };

            var categoryXml = '';
            if (deFolderId !== null && deFolderId !== undefined) {
                categoryXml = '<CategoryID>' + xmlEscape(deFolderId) + '</CategoryID>';
            };

            var bodyXml = '<CreateRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataExtension">' +
                '<CustomerKey>' + xmlEscape(key) + '</CustomerKey>' +
                '<Name>' + xmlEscape(key) + '</Name>' +
                '<Description>' + xmlEscape(TEMP_OBJECT_DESCRIPTION) + '</Description>' +
                categoryXml +
                '<IsSendable>false</IsSendable>' +
                retentionXml +
                '<Fields>' + fieldsXml + '</Fields>' +
                '</Objects>' +
                '</CreateRequest>';
            return bodyXml;
        };

        /**
         * @function createTempDataExtension
         * @description Creates the temporary Data Extension a run's results are written to, retrying
         *              once without the one-day retention policy if the first attempt's MCE status
         *              message mentions "retention" (some orgs reject that field on Create).
         * @param {string} token
         * @param {string} key - CustomerKey/Name for the new Data Extension.
         * @param {string[]} columns - Output column names, each becomes a field.
         * @param {?number} deFolderId - CategoryID to file it under, or null to omit.
         * @param {Array} [columnTypes] - Validated types (validateColumnTypes), one per column; a missing list is every column Text.
         * @returns {{deId: ?string, retentionApplied: boolean, hasRowMark: boolean}}
         * @throws {Object} apiError when both the retention and no-retention attempts fail.
         */
        function createTempDataExtension(token, key, columns, deFolderId, columnTypes) {
            var withRetention = buildDataExtensionCreateXml(key, columns, deFolderId, true, columnTypes);
            var soapRes = soap('Create', withRetention, token);

            if (soapRes.ok) {
                var newObjectId = (soapRes.results.length > 0) ? xmlValue(soapRes.results[0], 'NewObjectID') : null;
                var okResult = {
                    deId: newObjectId,
                    retentionApplied: true,
                    hasRowMark: canCarryRowMark(columns)
                };
                return okResult;
            };

            var message = (soapRes.results.length > 0) ? xmlValue(soapRes.results[0], 'StatusMessage') : '';
            var doesMentionRetention = message && message.toLowerCase().indexOf('retention') !== -1;

            if (doesMentionRetention) {
                var withoutRetention = buildDataExtensionCreateXml(key, columns, deFolderId, false, columnTypes);
                var retryRes = soap('Create', withoutRetention, token);
                if (retryRes.ok) {
                    var retryObjectId = (retryRes.results.length > 0) ? xmlValue(retryRes.results[0], 'NewObjectID') : null;
                    var retryResult = {
                        deId: retryObjectId,
                        retentionApplied: false,
                        hasRowMark: canCarryRowMark(columns)
                    };
                    return retryResult;
                };
                throw sfmcErrorFromSoap(retryRes);
            };

            throw sfmcErrorFromSoap(soapRes);
        };

        /**
         * @function deleteDataExtensionByKey
         * @description Deletes one Data Extension over SOAP by CustomerKey. Never throws on failure -
         *              callers treat a delete failure as a warning, not a reason to fail the request
         *              (e.g. a run that already succeeded should not fail just because cleanup of an
         *              earlier temp DE didn't).
         * @param {string} token
         * @param {string} key - CustomerKey of the Data Extension to delete.
         * @returns {{ok: boolean, raw: string}} raw is the SOAP response body, for a warning message.
         */
        function deleteDataExtensionByKey(token, key) {
            var bodyXml = '<DeleteRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataExtension">' +
                '<CustomerKey>' + xmlEscape(key) + '</CustomerKey>' +
                '</Objects>' +
                '</DeleteRequest>';
            var soapRes = soap('Delete', bodyXml, token);
            var isOk = soapRes.ok;
            var result = {
                ok: isOk,
                raw: soapRes.raw
            };
            return result;
        };

        /**
         * @function findActivityIdByKey
         * @description M2: finds the per-user ad-hoc Query Activity by its exact CustomerKey over SOAP,
         *              instead of an unpaged REST list (`Name like 'SQL Studio - '`, $pageSize=100) that
         *              could miss the activity in a Business Unit with more than 100 matches. The SOAP
         *              filter is an exact match, so there is nothing to page and no case folding to do
         *              (CustomerKey is case-preserving but MCE matches it case-insensitively). With
         *              isBackendBu it asks WSProxy first, a call SQL Studio counts apart from its API calls
         *              (rules 1 to 4 in section 3.8). A WSProxy answer that finds no activity is not trusted: the token lookup runs.
         * @param {string} token
         * @param {string} activityKey - always adHocActivityKey of the caller and a slot
         * @param {boolean} [isBackendBu] - the session is in this Backend's own Business Unit
         * @returns {string|null} the ObjectID (used as the REST queryDefinitionId), or null when not found.
         */
        function findActivityIdByKey(token, activityKey, isBackendBu) {
            if (isBackendBu) {
                var proxyRows = wsproxyRetrieve('QueryDefinition', ['ObjectID'], {
                    Property: 'CustomerKey',
                    SimpleOperator: 'equals',
                    Value: activityKey
                });
                if (proxyRows !== null && proxyRows.length > 0 && proxyRows[0].ObjectID !== undefined && proxyRows[0].ObjectID !== null && String(proxyRows[0].ObjectID) !== '') {
                    return String(proxyRows[0].ObjectID);
                };
            };
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>QueryDefinition</ObjectType>' +
                '<Properties>ObjectID</Properties>' +
                '<Properties>CustomerKey</Properties>' +
                '<Properties>Name</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>CustomerKey</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(activityKey) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';

            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };
            if (soapRes.results.length === 0) {
                return null;
            };
            return xmlValue(soapRes.results[0], 'ObjectID');
        };

        /**
         * @function isActivityRunning
         * @description Tells whether a Query Activity is currently running (REST isrunning check). Any
         *              non-2xx response (e.g. a 404 for an activity that no longer exists) is treated as
         *              "not running" - the PATCH/POST that follows will surface a real problem with the
         *              id on its own.
         * @param {string} token
         * @param {string} activityId
         * @returns {boolean}
         */
        function isActivityRunning(token, activityId) {
            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(activityId) + '/actions/isrunning/', null, token);
            return (res.status >= 200 && res.status < 300 && res.json && res.json.isRunning === true);
        };

        /**
         * @function isOwnActivity
         * @description Tells whether a Query Activity id belongs to the caller's pool slot: its
         *              CustomerKey is the key SQL Studio builds for this user and slot. runQuery
         *              overwrites the activity it reuses (name, key, query text and target), and the
         *              id comes from the browser, so it is never trusted on its own: it could be any
         *              activity the user's token can change. One REST call, or with isBackendBu one WSProxy
         *              retrieve by ObjectID first, counted apart from the API calls. The key is compared without
         *              regard to case, as Marketing Cloud Engagement matches CustomerKey. Anything that
         *              is not a clear yes (a 404, another status, no key) is a no. WSProxy finding no
         *              activity or no key falls back to the REST call, and its own answer, a key that
         *              differs, is final: the REST call would read the same key.
         * @param {string} token
         * @param {string} activityId
         * @param {string} expectedKey - adHocActivityKey of this user and slot
         * @param {boolean} [isBackendBu] - the session is in this Backend's own Business Unit
         * @returns {boolean}
         */
        function isOwnActivity(token, activityId, expectedKey, isBackendBu) {
            if (isBackendBu) {
                var proxyRows = wsproxyRetrieve('QueryDefinition', ['CustomerKey'], {
                    Property: 'ObjectID',
                    SimpleOperator: 'equals',
                    Value: activityId
                });
                if (proxyRows !== null && proxyRows.length > 0 && proxyRows[0].CustomerKey !== undefined && proxyRows[0].CustomerKey !== null && String(proxyRows[0].CustomerKey) !== '') {
                    return String(proxyRows[0].CustomerKey).toLowerCase() === String(expectedKey).toLowerCase();
                };
            };
            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(activityId), null, token);
            if (res.status < 200 || res.status >= 300 || !res.json || res.json.key === undefined || res.json.key === null) {
                return false;
            };
            return String(res.json.key).toLowerCase() === String(expectedKey).toLowerCase();
        };

        /**
         * @function checkActivityNotRunning
         * @description M6: refuses to let a second run start against the same per-user ad-hoc Query
         *              Activity while an earlier run (another tab or window) is still executing.
         * @param {string} token
         * @param {string} activityId
         * @throws {Object} apiError RUN_IN_PROGRESS when the activity is currently running.
         */
        function checkActivityNotRunning(token, activityId) {
            if (isActivityRunning(token, activityId)) {
                throw apiError('RUN_IN_PROGRESS', 'Your SQL Studio query is still running in another tab or window. Wait for it to finish, then run again.', null);
            };
        };

        /**
         * @function startQueryActivity
         * @description Starts a Query Activity with the user's token: SOAP Perform (Action Start) on the
         *              QueryDefinition, which answers with a Task ID that getRunStatus and getRunOutcome later
         *              read back through AsyncActivityStatus to learn whether the run is queued, running,
         *              finished or failed. The REST start only ever answers "OK", with nothing to ask about
         *              later. The REST start is the fallback only after a clear refusal: Marketing Cloud
         *              Engagement answered the Perform itself and said Error, or faulted the request as the
         *              client's. After anything else, such as a network failure or a gateway's error page, the
         *              Perform may have started the run, and a REST start could run it twice: that is thrown as
         *              a failed start is. Shared by runQuery and moveToDataExtension, so both answer a task
         *              the same way.
         * @param {string} queryId - the Query Activity's ObjectID
         * @param {string} userHash - computeUserHash of the session's row
         * @param {string} token
         * @returns {{startMethod: string, taskId: ?string, taskSig: ?string, startResponse: string}} startMethod is
         *          'soap' or 'rest'. taskSig binds taskId to this user (taskSignature) and is null whenever taskId is.
         *          startResponse is a diagnostic of at most 500 characters, with the secrets masked.
         * @throws {Object} apiError MCE_ERROR when the start fails. It carries isStartUnclear true when the start may
         *         have happened all the same: a Perform answer that is no clear refusal (isSoapClearRefusal), or a REST
         *         start whose answer is no clear refusal either (isRestClearRefusal), such as no answer, an HTTP 408 or 504
         *         cut off at a time limit, or a server error.
         */
        function startQueryActivity(queryId, userHash, token) {
            var startMethod = 'soap';
            var taskId = null;
            var taskSig = null;
            var startResponse = '';

            var performBody = '<PerformRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Action>Start</Action>' +
                '<Definitions>' +
                '<Definition xsi:type="QueryDefinition">' +
                '<ObjectID>' + xmlEscape(queryId) + '</ObjectID>' +
                '</Definition>' +
                '</Definitions>' +
                '</PerformRequestMsg>';
            var performRes = soap('Perform', performBody, token);

            var performResultBlock = (performRes.results && performRes.results.length > 0) ? performRes.results[0] : null;
            /* The Result's own StatusCode, not the Task's, which comes later in the same block. */
            var performResultStatusCode = performResultBlock ? xmlValue(xmlWithout(performResultBlock, 'Task'), 'StatusCode') : null;
            var performResultStatusMessage = performResultBlock ? xmlValue(xmlWithout(performResultBlock, 'Task'), 'StatusMessage') : null;
            /* Only inside <Task>: the echoed <Object> comes first and may carry an <ID> of its own, such
            as its Client's MID. */
            var performTaskBlock = performResultBlock ? xmlRaw(performResultBlock, 'Task') : null;
            var performTaskId = performTaskBlock ? xmlValue(performTaskBlock, 'ID') : null;
            var performFailed = !performRes.ok || (performResultStatusCode !== null && performResultStatusCode !== 'OK');
            var isClearRefusal = isSoapClearRefusal(performRes, performResultStatusCode);

            if (performFailed && !isClearRefusal) {
                /* The Perform may have started the activity: moveToDataExtension answers this as START_UNCONFIRMED, and
                runQuery as the failed start it has always been. */
                var unclearErr = sfmcErrorFromSoap(performRes);
                unclearErr.isStartUnclear = true;
                throw unclearErr;
            };

            if (performFailed && isSoapSessionFault(performRes.raw)) {
                /* The fault text itself says the token is the problem: a REST start would fail the
                same way, so there is nothing a fallback would fix. */
                throw sfmcErrorFromSoap(performRes);
            };

            if (performFailed) {
                startMethod = 'rest';
                var startRes = httpJSON('POST', restBase + '/automation/v1/queries/' + urlEncode(queryId) + '/actions/start/', {}, token);
                if (startRes.status < 200 || startRes.status >= 300) {
                    var restStartErr = sfmcErrorFromResponse(startRes);
                    /* Anything but a clear refusal (isRestClearRefusal), such as no answer, a time limit or a server error,
                    may have started it too: the move then waits in Marketing Cloud Engagement's queue. */
                    if (!isRestClearRefusal(startRes)) {
                        restStartErr.isStartUnclear = true;
                    };
                    throw restStartErr;
                };
                taskId = null;
                startResponse = truncate(maskSecrets('Perform: ' + (performResultStatusMessage || performRes.overallStatus || 'failed') + '. Fell back to REST start.'), 500);
            } else {
                /* An ID of another shape is no Task ID the app could send back: getRunStatus would not take it. */
                taskId = isTaskIdShape(performTaskId) ? performTaskId : null;
                /* The run has started: a signature the platform cannot compute leaves the status to the token. */
                if (taskId !== null) {
                    try {
                        taskSig = taskSignature(taskId, userHash);
                    } catch (sigErr) {
                        taskSig = null;
                    };
                };
                startResponse = truncate(maskSecrets('Perform: ' + (performResultStatusMessage || 'OK') + '. Task ID: ' + (taskId ? 'yes' : 'no') + '.'), 500);
            };

            var started = {
                startMethod: startMethod,
                taskId: taskId,
                taskSig: taskSig,
                startResponse: startResponse
            };
            return started;
        };

        /**
         * @function actionRunQuery
         * @description Runs a query: picks the first free slot, from the requested one up, in the
         *              caller's pool of up to QUERY_SLOT_COUNT per-user ad-hoc Query Activities (M6),
         *              resolves (or creates) that slot's activity, creates a fresh temporary Data
         *              Extension for the results, points the activity at it and starts it. On any
         *              failure after the temp DE was created, the DE (never the activity) is deleted
         *              before the error is thrown.
         * @param {Object} payload - { sql, columns, columnTypes?, deFolderId, queryFolderId, queryId?, slot?, inBackendBu? }.
         *        columnTypes is an optional array parallel to columns, each entry { type: 'Date' | 'Number' |
         *        'Decimal' | 'Boolean', precision?, scale? } or null for Text. An invalid, unknown or missing
         *        entry is Text, and never fails the run (validateColumnType).
         * @param {Object} authRow
         * @returns {{runId, deKey, deName, deId, queryId, queryName, queryReused: boolean,
         *           slot: number, startedAt: string, retentionApplied: boolean, columns: string[],
         *           columnTypes: Array, taskId: ?string, taskSig: ?string}} columnTypes is what the temporary
         *           Data Extension really got, one entry per column: null for Text, otherwise { type } or, for a
         *           Decimal, { type, precision, scale }. taskSig binds taskId to this user (taskSignature),
         *           and is null whenever taskId is.
         */
        function actionRunQuery(payload, authRow) {
            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);
            var columns = validateColumns(payload.columns);
            var columnTypes = validateColumnTypes(payload.columnTypes, columns.length);

            var deFolderId = payload.deFolderId;
            if (deFolderId !== undefined && deFolderId !== null) {
                deFolderId = requireInt(deFolderId, 'deFolderId', 1, null);
            } else {
                deFolderId = null;
            };
            var queryFolderId = payload.queryFolderId;
            if (queryFolderId !== undefined && queryFolderId !== null) {
                queryFolderId = requireInt(queryFolderId, 'queryFolderId', 1, null);
            } else {
                queryFolderId = null;
            };

            var cachedQueryId = payload.queryId;
            var hasCachedQueryId = (cachedQueryId !== undefined && cachedQueryId !== null && cachedQueryId !== '');
            if (hasCachedQueryId) {
                requireGuid(cachedQueryId, 'queryId');
            };

            var requestedSlot = payload.slot;
            if (requestedSlot !== undefined && requestedSlot !== null) {
                requestedSlot = requireInt(requestedSlot, 'slot', 1, QUERY_SLOT_COUNT);
            } else {
                requestedSlot = 1;
            };

            var userHash = computeUserHash(authRow);
            /* The app's hint that this session is in the Backend's own Business Unit: it only routes the two
            lookups below through WSProxy, and each falls back to the token (section 3.8, rule 4). */
            var isBackendBu = (payload.inBackendBu === true);

            /* The payload's queryId is only a hint: the run PATCHes the activity it resolves to, so an
            id that is not this user's activity for this slot (a saved Query Activity, or another user's)
            would be overwritten. It is checked against the key SQL Studio builds for this user and
            slot, and one that fails is ignored: the activity is then found by key, as with no id at all. */
            var isCachedQueryIdOwn = hasCachedQueryId && isOwnActivity(authRow.token, cachedQueryId, adHocActivityKey(userHash, requestedSlot), isBackendBu);

            /* Step 1-2 (M2, M6): walk the pool from the requested slot up, stopping at the first slot
            that is not currently running. The frontend's cached id is only good for the requested slot
            (its own per-slot cache), and only once it passed the check above;
            every other slot this tries is resolved by a SOAP Retrieve of QueryDefinition by exact
            CustomerKey, the same M2 lookup slot 1 always used. A slot with no activity yet (brand-new
            user, or this slot never used) is free by definition - nothing to check, nothing created
            until step 3. Stops at the first free slot, so a busy slot costs exactly one isrunning
            check, same as the single-slot check it replaces. */
            var slot = null;
            var queryId = null;
            var usedCachedQueryId = false;
            for (var trySlot = requestedSlot; trySlot <= QUERY_SLOT_COUNT; trySlot++) {
                var isCacheForThisSlot = (trySlot === requestedSlot && isCachedQueryIdOwn);
                var tryQueryId = isCacheForThisSlot ? cachedQueryId : findActivityIdByKey(authRow.token, adHocActivityKey(userHash, trySlot), isBackendBu);
                if (tryQueryId !== null && isActivityRunning(authRow.token, tryQueryId)) {
                    continue;
                };
                slot = trySlot;
                queryId = tryQueryId;
                usedCachedQueryId = isCacheForThisSlot;
                break;
            };
            if (slot === null) {
                throw apiError('RUN_IN_PROGRESS', 'All ' + QUERY_SLOT_COUNT + ' of your SQL Studio queries are running. Wait for one to finish, then run again.', null);
            };

            var activityKey = adHocActivityKey(userHash, slot);
            var activityName = adHocActivityName(authRow.userName, userHash, slot);
            var activityDescription = adHocActivityDescription(authRow.userEmail);

            var deKey = makeTempDeKey(userHash, slot);

            /* Step 3: create the temporary Data Extension with retention (SOAP). */
            var createResult = createTempDataExtension(authRow.token, deKey, columns, deFolderId, columnTypes);
            var deId = createResult.deId;
            var wasRetentionApplied = createResult.retentionApplied;
            var hasRowMark = createResult.hasRowMark === true;

            /* Full body used for the PATCH or POST against this slot's ad-hoc Query Activity. */
            var activityBody = {
                name: activityName,
                key: activityKey,
                description: activityDescription,
                queryText: sql,
                targetName: deKey,
                targetKey: deKey,
                targetId: deId,
                targetUpdateTypeId: 0,
                targetUpdateTypeName: 'Overwrite'
            };
            if (queryFolderId !== null) {
                activityBody.categoryId = queryFolderId;
            };

            var queryName = activityName;
            var wasQueryReused = false;

            /* Step 4: PATCH the resolved activity, or POST a new one when none was found (or the
            resolved id turned out to be stale, a 404 - narrow race between the lookup above and
            here). On any other PATCH/POST failure, delete only the DE; the activity is never deleted. */
            if (queryId !== null) {
                var patchRes = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(queryId), activityBody, authRow.token);
                if (patchRes.status >= 200 && patchRes.status < 300) {
                    wasQueryReused = true;
                    if (patchRes.json && patchRes.json.name) {
                        queryName = patchRes.json.name;
                    };
                } else if (patchRes.status === 404) {
                    /* The cached id is stale. The activity may still exist under another id (recreated from
                    another browser), so re-resolve it by key before creating one, or the POST would
                    collide on the key. Only when the id just PATCHed actually came from the cache - a
                    freshly SOAP-resolved id 404ing means it was deleted a moment ago, and there is nothing
                    left to re-resolve. */
                    queryId = usedCachedQueryId ? findActivityIdByKey(authRow.token, activityKey, isBackendBu) : null;
                    if (queryId !== null && queryId !== cachedQueryId) {
                        /* M6 again: the slot loop above checked the stale cached id, not this one, and
                        another browser may be running this activity right now. */
                        try {
                            checkActivityNotRunning(authRow.token, queryId);
                        } catch (runningErr) {
                            deleteDataExtensionByKey(authRow.token, deKey);
                            throw runningErr;
                        };
                        var retryPatchRes = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(queryId), activityBody, authRow.token);
                        if (retryPatchRes.status >= 200 && retryPatchRes.status < 300) {
                            wasQueryReused = true;
                        } else if (retryPatchRes.status === 404) {
                            queryId = null;
                        } else {
                            deleteDataExtensionByKey(authRow.token, deKey);
                            throw sfmcErrorFromResponse(retryPatchRes);
                        };
                    } else {
                        queryId = null;
                    };
                } else {
                    deleteDataExtensionByKey(authRow.token, deKey);
                    throw sfmcErrorFromResponse(patchRes);
                };
            };
            if (queryId === null) {
                var createRes = httpJSON('POST', restBase + '/automation/v1/queries/', activityBody, authRow.token);
                if (createRes.status < 200 || createRes.status >= 300 || !createRes.json || !createRes.json.queryDefinitionId) {
                    deleteDataExtensionByKey(authRow.token, deKey);
                    throw sfmcErrorFromResponse(createRes);
                };
                queryId = createRes.json.queryDefinitionId;
                wasQueryReused = false;
                if (createRes.json.name) {
                    queryName = createRes.json.name;
                };
            };

            /* Step 5: start the Query Activity (startQueryActivity). A failed start deletes only the temp DE,
            never the activity. */
            var started = null;
            try {
                started = startQueryActivity(queryId, userHash, authRow.token);
            } catch (startErr) {
                deleteDataExtensionByKey(authRow.token, deKey);
                throw startErr;
            };
            var startMethod = started.startMethod;
            var taskId = started.taskId;
            var taskSig = started.taskSig;
            var startResponse = started.startResponse;

            var data = {
                runId: deKey,
                deKey: deKey,
                deName: deKey,
                deId: deId,
                queryId: queryId,
                queryName: queryName,
                queryReused: wasQueryReused,
                slot: slot,
                startedAt: isoDate(Platform.Function.SystemDateToLocalDate(Platform.Function.Now())),
                retentionApplied: wasRetentionApplied,
                hasRowMark: hasRowMark,
                columns: columns,
                columnTypes: columnTypes,
                taskId: taskId,
                taskSig: taskSig,
                startMethod: startMethod,
                /* Diagnostic: which way the run started and what Perform said,
                to confirm the real Status spellings and never leak the token. At most 500 characters. */
                startResponse: startResponse
            };
            return data;
        };

        /**
         * @function retrieveTaskStatusWithToken
         * @description SOAP Retrieve of AsyncActivityStatus filtered on TaskID, with the signed-in user's
         *              token: how a run started through actionRunQuery's SOAP Perform ended, or whether it
         *              is queued or running. The possible Status values Marketing Cloud Engagement returns
         *              are not documented, so this hands the raw text straight back and leaves classifying
         *              it to the caller. 1 API call. Shared by getRunOutcome and readTaskStatus's token path.
         * @param {string} taskId - already checked with requireTaskId or isTaskIdShape
         * @param {string} token
         * @returns {{found: boolean, status: ?string, statusMessage: ?string, errorMsg: ?string, completedDate: ?string, raw: string}}
         * @throws {Object} apiError MCE_ERROR when the SOAP call fails.
         */
        function retrieveTaskStatusWithToken(taskId, token) {
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>AsyncActivityStatus</ObjectType>' +
                '<Properties>Status</Properties>' +
                '<Properties>StatusMessage</Properties>' +
                '<Properties>ErrorMsg</Properties>' +
                '<Properties>CompletedDate</Properties>' +
                '<Properties>StartTime</Properties>' +
                '<Properties>EndTime</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>TaskID</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(taskId) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';
            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };

            var block = (soapRes.results && soapRes.results.length > 0) ? soapRes.results[0] : null;
            if (!block) {
                return {
                    found: false,
                    status: null,
                    statusMessage: null,
                    errorMsg: null,
                    completedDate: null,
                    raw: truncate(soapRes.overallStatus || '', 200)
                };
            };

            /* Salesforce documents the answer as ObjectExtension results, whose values sit in
            <Properties><Property><Name>..</Name><Value>..</Value></Property></Properties>. A value read
            as a plain element is kept as the fallback. The raw block goes back too, as the diagnostic
            that settles the real shape and Status spellings on the org. */
            var named = soapPropertyValues(block);
            var pick = function (name) {
                if (named.hasOwnProperty(name)) {
                    return named[name];
                };
                return xmlValue(block, name);
            };
            /* MCE's messages and the raw block reach the app: masked as an error's text is. */
            var data = {
                found: true,
                status: pick('Status'),
                statusMessage: maskNullable(pick('StatusMessage')),
                errorMsg: maskNullable(pick('ErrorMsg')),
                completedDate: pick('CompletedDate'),
                raw: truncate(maskSecrets(block), 1500)
            };
            return data;
        };

        /**
         * @function readTaskStatus
         * @description Reads a run's AsyncActivityStatus by its Task ID, which says Queued, then Complete or
         *              FatalError, where REST isrunning answers false for a queued query. With isBackendBu it
         *              asks WSProxy first (counted apart from the API calls, rules 1 to 4 in section 3.8),
         *              and the answer's values sit in Results[0].Properties. When WSProxy answers without an
         *              error and finds no row, as for a task Marketing Cloud Engagement has not picked up from
         *              its queue yet, the token's SOAP Retrieve is left out: it reads the same table, so it
         *              would find no row either, for 1 API call. Without isBackendBu, or when WSProxy throws,
         *              answers an error or finds a row without a Status, it runs the token SOAP Retrieve
         *              instead. A failed or faulted SOAP Retrieve is no answer either: the caller then asks
         *              isrunning, as it did before the Task ID was read, so a status read never fails a run
         *              on its own. A SOAP Retrieve that answers and finds no row says so, as WSProxy's does.
         * @param {string} taskId - already checked with isTaskIdShape
         * @param {Object} authRow
         * @param {boolean} isBackendBu - the session is in this Backend's own Business Unit, and the Task ID is
         *        one its user started (isTaskSignatureOk)
         * @returns {{taskStatus: ?Object, noRowVia: ?string}} taskStatus is { status, statusMessage, errorMsg,
         *          completedDate, via }, with via 'wsproxy' or 'soap', or null when no read finds a row for the
         *          Task ID or the SOAP Retrieve failed. noRowVia names the read that answered and found no row:
         *          'wsproxy', which leaves the SOAP Retrieve out, or 'soap'. It is null when a row was found and
         *          when the SOAP Retrieve failed.
         * @throws {Object} apiError SESSION_EXPIRED or SESSION_INVALID, which a failed read never hides.
         */
        function readTaskStatus(taskId, authRow, isBackendBu) {
            if (isBackendBu) {
                var proxyRows = wsproxyRetrieve('AsyncActivityStatus', ['Status', 'StatusMessage', 'ErrorMsg', 'CompletedDate'], {
                    Property: 'TaskID',
                    SimpleOperator: 'equals',
                    Value: taskId
                });
                if (proxyRows !== null && proxyRows.length === 0) {
                    return {
                        taskStatus: null,
                        noRowVia: 'wsproxy'
                    };
                };
                if (proxyRows !== null) {
                    var values = wsproxyPropertyValues(proxyRows[0]);
                    if (values.hasOwnProperty('Status') && values.Status !== null) {
                        return {
                            taskStatus: {
                                status: values.Status,
                                statusMessage: values.hasOwnProperty('StatusMessage') ? maskNullable(values.StatusMessage) : null,
                                errorMsg: values.hasOwnProperty('ErrorMsg') ? maskNullable(values.ErrorMsg) : null,
                                completedDate: values.hasOwnProperty('CompletedDate') ? values.CompletedDate : null,
                                via: 'wsproxy'
                            },
                            noRowVia: null
                        };
                    };
                };
            };
            var outcome = null;
            try {
                outcome = retrieveTaskStatusWithToken(taskId, authRow.token);
            } catch (soapErr) {
                if (soapErr && (soapErr.code === 'SESSION_EXPIRED' || soapErr.code === 'SESSION_INVALID')) {
                    throw soapErr;
                };
                return {
                    taskStatus: null,
                    noRowVia: null
                };
            };
            if (!outcome.found) {
                return {
                    taskStatus: null,
                    noRowVia: 'soap'
                };
            };
            return {
                taskStatus: {
                    status: outcome.status,
                    statusMessage: outcome.statusMessage,
                    errorMsg: outcome.errorMsg,
                    completedDate: outcome.completedDate,
                    via: 'soap'
                },
                noRowVia: null
            };
        };

        /**
         * @function readRunStatus
         * @description Reads one run's status for getOneRunStatus. With a taskId it is the run's
         *              AsyncActivityStatus (readTaskStatus), which tells a queued run from a finished one,
         *              and isRunning stays null. It is read through WSProxy only with isBackendBu and the
         *              entry's taskSig of this user. Without a taskId, or when no AsyncActivityStatus row is
         *              found, it is the Query Activity's REST isrunning call, an API call. With isTaskOnly, a
         *              task that the read answered no row for is pending instead, with no isrunning call: the
         *              app asks so while it waits for Marketing Cloud Engagement to pick a queued run up, as
         *              isrunning answers false both for a queued run and for a finished one. That holds for
         *              WSProxy's read, at no API call, and for the token's SOAP Retrieve, at 1 API call, as in
         *              a child Business Unit. A SOAP Retrieve that failed is no answer, so isrunning follows it.
         * @param {string} queryId - already checked with requireGuid
         * @param {?string} taskId - already checked with isTaskIdShape, or null
         * @param {*} taskSig - the entry's taskSig, checked by isTaskSignatureOk
         * @param {Object} authRow
         * @param {boolean} [isBackendBu] - the session is in this Backend's own Business Unit
         * @param {boolean} [isTaskOnly] - the entry's taskOnly flag
         * @returns {{isRunning: ?boolean, taskStatus: ?Object, isPending: boolean, pendingVia: ?string}} isRunning
         *          is null when taskStatus answers, and when isPending says the read found no row for the task
         *          yet. pendingVia is then the read that found none, 'wsproxy' or 'soap', and null otherwise.
         */
        function readRunStatus(queryId, taskId, taskSig, authRow, isBackendBu, isTaskOnly) {
            var taskStatus = null;
            if (taskId !== null) {
                /* WSProxy reads any task of this Business Unit, so only a Task ID this user started goes
                that way: without its signature, the token reads it (taskSignature). */
                var isOwnTask = isBackendBu === true && isTaskSignatureOk(taskId, taskSig, computeUserHash(authRow));
                var taskRead = readTaskStatus(taskId, authRow, isOwnTask);
                taskStatus = taskRead.taskStatus;
                if (taskRead.noRowVia !== null && isTaskOnly === true) {
                    return {
                        isRunning: null,
                        taskStatus: null,
                        isPending: true,
                        pendingVia: taskRead.noRowVia
                    };
                };
            };
            var isRunning = null;
            if (taskStatus === null) {
                var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(queryId) + '/actions/isrunning/', null, authRow.token);
                if (res.status < 200 || res.status >= 300) {
                    throw sfmcErrorFromResponse(res);
                };
                isRunning = !!(res.json && res.json.isRunning);
            };
            return {
                isRunning: isRunning,
                taskStatus: taskStatus,
                isPending: false,
                pendingVia: null
            };
        };

        /**
         * @function getOneRunStatus
         * @description Polls one run. With deKey, it counts the run's temporary Data Extension for free:
         *              its rows appear when the query finishes. The run's status (readRunStatus) is read when
         *              the caller asks for it (checkRunning), when no deKey is given, and when the count
         *              cannot be read. A query that returns no rows never fills its Data Extension, so only
         *              the status shows that it finished. When checkRunning asks for the status, it is read
         *              before the count, so a status that says the run finished never goes with a count taken
         *              before it did. When it is read because the count cannot be, it comes after the count.
         *              Without a deKey no count is read. taskOnly asks for a pending answer instead of the
         *              isrunning call when the read of AsyncActivityStatus, through WSProxy or the token's SOAP
         *              Retrieve, finds no row for the task (readRunStatus).
         *              Shared by actionGetRunStatus's single-run form and its batched `runs` form.
         * @param {Object} entry - { queryId, deKey?, checkRunning?, taskId?, taskSig?, taskOnly? }
         * @param {Object} authRow
         * @param {boolean} [isBackendBu] - the session is in this Backend's own Business Unit
         * @returns {{queryId: string, isRunning: ?boolean, rowCount: ?number, taskStatus?: ?Object, pending?: boolean, pendingVia?: string}}
         *          isRunning is null when not asked for, when taskStatus answers, and when the answer is pending.
         *          taskStatus is { status, statusMessage, errorMsg, completedDate, via } when an
         *          AsyncActivityStatus row was read. A pending answer has taskStatus null and pending true:
         *          the read found no row for the task, and nothing else was asked. Its pendingVia names that
         *          read, 'wsproxy' for no API call or 'soap' for 1, so the app knows what each such check costs.
         */
        function getOneRunStatus(entry, authRow, isBackendBu) {
            var queryId = entry.queryId;
            requireGuid(queryId, 'queryId');

            /* A taskId of another shape is read as none, so this run is asked isrunning, as one without a
            Task ID is: it is only a hint for the status read, and must not fail the other runs of a batch. */
            var taskId = isTaskIdShape(entry.taskId) ? entry.taskId : null;

            var deKey = entry.deKey;
            var hasDeKey = (deKey !== undefined && deKey !== null && deKey !== '');
            if (hasDeKey) {
                requireString(deKey, 'deKey', 1, 36);
                if (!isOwnTempDeKey(authRow, deKey)) {
                    throw apiError('BAD_REQUEST', 'Only SQL Studio\'s own temporary Data Extensions can be checked.', null);
                };
            };

            /* The status first, then the count. A count read before the status can predate the rows of a
            query that finished in between, and the answer would pair Complete with that count. */
            var isStatusDue = !hasDeKey || entry.checkRunning === true;
            var isTaskOnly = entry.taskOnly === true;
            var status = null;
            if (isStatusDue) {
                status = readRunStatus(queryId, taskId, entry.taskSig, authRow, isBackendBu, isTaskOnly);
            };
            var rowCount = hasDeKey ? readRowCount(deKey) : null;
            if (!isStatusDue && rowCount === null) {
                status = readRunStatus(queryId, taskId, entry.taskSig, authRow, isBackendBu, isTaskOnly);
            };

            var answer = {
                queryId: queryId,
                isRunning: status !== null ? status.isRunning : null,
                rowCount: rowCount
            };
            if (status !== null && status.taskStatus !== null) {
                answer.taskStatus = status.taskStatus;
            };
            if (status !== null && status.isPending) {
                answer.taskStatus = null;
                answer.pending = true;
                answer.pendingVia = status.pendingVia;
            };
            return answer;
        };

        /**
         * @function actionGetRunStatus
         * @description Polls a run, or several at once, one poll for every tab due on the same tick
         *              instead of one Backend request per tab. The single-run payload/response keep
         *              working as before; `payload.runs` (an array of 1 to QUERY_SLOT_COUNT single-run
         *              payloads) answers with `{ runs: [...] }` in the same order instead. A run whose
         *              deKey is not the caller's own is refused the same way the single form refuses it,
         *              and more than QUERY_SLOT_COUNT entries is BAD_REQUEST. Each answer carries the
         *              API calls and the WSProxy calls its own check made (apiCalls, wsproxyCalls), also
         *              an entry that failed, so the app can count them per run. `payload.inBackendBu`
         *              is the app's hint that the session is in this Backend's own Business Unit, which
         *              lets a task's status be read through WSProxy (readTaskStatus), for an entry whose
         *              taskSig is the one runQuery answered for this user, in any of the user's sessions
         *              (isTaskSignatureOk). An entry's taskOnly makes a task that the read finds no row for
         *              answer pending, with no isrunning call (getOneRunStatus).
         * @param {Object} payload - { queryId, deKey?, checkRunning?, taskId?, taskSig?, taskOnly?, inBackendBu? } or
         *        { runs: [ {queryId, deKey?, checkRunning?, taskId?, taskSig?, taskOnly?}, ... ], inBackendBu? }
         * @param {Object} authRow
         * @returns {Object} the single-run shape, or { runs: [...] } for the batched form

                    throw apiError('BAD_REQUEST', 'Field "runs" must have 1 to ' + QUERY_SLOT_COUNT + ' entries.', null);
                };

                    whole call, as the single form does. */
                    try {

        /**
         * @function actionGetResults

         *        reads through REST: when the free read cannot answer, so does not run or does not trust its

            };

                };

            };

            if (filter !== undefined && filter !== null && filter !== '') {
                requireString(filter, 'filter', 1, 1000);
            } else {
                filter = null;
            };

            var url = restBase + '/data/v1/customobjectdata/key/' + urlEncode(deKey) + '/rowset?$page=' + urlEncode(String(page)) + '&$pageSize=' + urlEncode(String(pageSize));
            if (orderBy) {
                url += '&$orderBy=' + urlEncode(orderBy);
            };
            if (filter) {

            first 2,000 rows and without a server-side filter; everything else goes through REST. A
            restOnly request never reads for free, even for page 1 of 2,000 rows, which would fit the
            window: without an orderBy the free read has its own row order, and the Frontend's chunks
            and Export must all come in the rowset endpoint's order. */

                var freePage = readRowsFree(deKey, columns, page, pageSize, orderBy);

                };
            };

            /* A freeOnly request ends here: whatever stopped the free read, REST would cost an API call the
            caller did not plan for. Only the boolean true counts, as with restOnly. */
            if (payload.freeOnly === true) {
                return {
                    count: null,
                    page: page,
                    pageSize: pageSize,
                    columns: columns === null ? [] : columns,
                    rows: [],
                    readPath: 'none'

            var res = httpJSON('GET', url, null, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var items = body.items || [];

            var outputColumns = columns;
            if (!outputColumns) {
                outputColumns = [];
                if (items.length > 0) {
                    var sourceObj = mergeKeysValues(items[0]);
                    for (var k in sourceObj) {

            for (var i = 0; i < items.length; i++) {

                    var colKey = outputColumns[oc].toLowerCase();

                    if (value === undefined) {

                    };
                    rowValues.push(value);
                };
                rows.push(rowValues);

                count: (body.count !== undefined) ? body.count : rows.length,
                page: page,
                pageSize: pageSize,
                columns: outputColumns,
                rows: rows,
                readPath: 'rest'

        };

        /**

                                name: (proxyRows[p].Name === undefined || proxyRows[p].Name === null) ? null : String(proxyRows[p].Name),
                                createdDate: (proxyRows[p].CreatedDate === undefined || proxyRows[p].CreatedDate === null) ? null : String(proxyRows[p].CreatedDate),
