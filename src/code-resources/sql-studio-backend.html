     *              delete-at-end-of-period or reset-on-import) - the policy every Data Extension
     *              this backend auto-creates uses.
     * @param {number} days
     * @returns {Object}
     */
    function individualRecordRetention(days) {
        var retention = {
            RowBasedRetention: true,
            DataRetentionPeriodLength: days,
            DataRetentionPeriod: 'Days',
            ResetRetentionPeriodOnImport: false,
            DeleteAtEndOfRetentionPeriod: false
        };
        return retention;
    };

    /**
     * @function isEnterpriseShared
     * @description Tells whether a configured Data Extension name is the 'ENT.'-shared-folder
     *              form, which this backend never attempts to auto-create (a shared DE belongs to
     *              a parent Business Unit; creating one from a child BU is out of scope).
     * @param {string} deName
     * @returns {boolean}
     */
    function isEnterpriseShared(deName) {
        return String(deName).indexOf('ENT.') === 0;
    };

    /**
     * @function isDataExtensionPresent
     * @description Tells whether a Data Extension already exists, by Name, using
     *              Script.Util.WSProxy. Runs in this Code Resource's own Business Unit and needs
     *              no user token or permission. Counts toward apiCallCount like every other MCE
     *              API call this backend makes. A WSProxy failure is treated as "not present" so
     *              the caller falls through to its own error handling instead of throwing here.
     * @param {string} deName
     * @returns {boolean}
     */
    function isDataExtensionPresent(deName) {
        apiCallCount++;
        try {
            var proxy = new Script.Util.WSProxy();
            var result = proxy.retrieve('DataExtension', ['CustomerKey'], {
                Property: 'Name',
                SimpleOperator: 'equals',
                Value: deName
            });
            return !!(result && result.Results && result.Results.length > 0);
        } catch (retrieveErr) {
            return false;
        };
    };

    /* One folder lookup per request: a first sign-in creates two Data Extensions, and looking the
    folder up for each one helped push that sign-in past MCE's time limit on the first org deployment. */
    var setupFolderIdLookup = {
        isDone: false,
        folderId: null
    };

    /**
     * @function findOrCreateSetupFolderId
     * @description Finds the "SQL Studio" folder under Data Extensions (tempFolderName, where the
     *              temporary results also go), creating it under the root folder when it is missing.
     *              WSProxy works in this Code Resource's own Business Unit.
     * @returns {*} the folder id, or null when it cannot be found or created (the Data Extension
     *              then goes to the root folder).
     */
    function findOrCreateSetupFolderId() {
        if (setupFolderIdLookup.isDone) {
            return setupFolderIdLookup.folderId;
        };
        setupFolderIdLookup.isDone = true;
        var folderId = null;
        try {
            var proxy = new Script.Util.WSProxy();
            apiCallCount++;
            var named = proxy.retrieve('DataFolder', ['ID', 'Name'], {
                LeftOperand: { Property: 'Name', SimpleOperator: 'equals', Value: tempFolderName },
                LogicalOperator: 'AND',
                RightOperand: { Property: 'ContentType', SimpleOperator: 'equals', Value: 'dataextension' }
            });
            if (named && named.Results && named.Results.length > 0) {
                folderId = named.Results[0].ID;
            } else {
                apiCallCount++;
                var roots = proxy.retrieve('DataFolder', ['ID'], {
                    LeftOperand: { Property: 'ParentFolder.ID', SimpleOperator: 'equals', Value: 0 },
                    LogicalOperator: 'AND',
                    RightOperand: { Property: 'ContentType', SimpleOperator: 'equals', Value: 'dataextension' }
                });
                if (roots && roots.Results && roots.Results.length > 0) {
                    apiCallCount++;
                    var created = proxy.createItem('DataFolder', {
                        Name: tempFolderName,
                        CustomerKey: tempPrefix + 'Folder',
                        Description: 'SQL Studio: its sign-in, error and history Data Extensions, and the temporary results of each run.',
                        ContentType: 'dataextension',
                        IsActive: true,
                        IsEditable: true,
                        AllowChildren: true,
                        ParentFolder: { ID: roots.Results[0].ID }
                    });
                    if (created && created.Results && created.Results.length > 0 && String(created.Results[0].StatusCode) === 'OK') {
                        folderId = created.Results[0].NewID;
                    };
                };
            };
        } catch (folderErr) {
            folderId = null;
        };
        setupFolderIdLookup.folderId = folderId;
        return folderId;
    };

    /**
     * @function createDataExtension
     * @description Creates one of SQL Studio's own Data Extensions through WSProxy, in the "SQL Studio"

     *              signed-in user's token. WSProxy's own context may not set a retention (error 310007:
     *              no Manage Data Retention permission, seen on the first org deployment), and trying it
     *              first cost a call per Data Extension on a sign-in that already ran out of time.
     * @param {string} deName
     * @param {Object[]} fields - WSProxy Field definitions, in column order.
     * @param {number} retentionDays
     * @param {string} description
     * @param {?string} token - the signed-in user's access token, for the retention retry.
     * @returns {string} 'created', 'created-no-retention' or 'failed'.
     */
    function createDataExtension(deName, fields, retentionDays, description, token) {
        var folderId = findOrCreateSetupFolderId();
        if (!isWsProxyCreateOk(deName, fields, null, description, folderId)) {
            return 'failed';
        };
        if (token && isRetentionSetWithToken(deName, retentionDays, token)) {
            return 'created';
        };
        return 'created-no-retention';
    };

    /**
     * @function isWsProxyCreateOk
     * @description One WSProxy createItem for a Data Extension, with a retention policy or without one.
     *              Its StatusCode is a CLR value, so it is read through String().
     * @param {string} deName
     * @param {Object[]} fields
     * @param {?number} retentionDays - null for no retention policy.
     * @param {string} description
     * @param {*} folderId - the folder to create it in, or null for the root folder.
     * @returns {boolean}
     */
    function isWsProxyCreateOk(deName, fields, retentionDays, description, folderId) {
        apiCallCount++;
        var isCreated = false;
        try {
            var proxy = new Script.Util.WSProxy();
            var config = {
                CustomerKey: deName,
                Name: deName,
                Description: description,
                IsSendable: false,
                IsTestable: false,
                Fields: fields
            };
            if (folderId !== null && folderId !== undefined) {
                config.CategoryID = folderId;
            };
            if (retentionDays !== null) {
                var retention = individualRecordRetention(retentionDays);
                for (var key in retention) {
                    if (retention.hasOwnProperty(key)) {
                        config[key] = retention[key];
                    };
                };
            };
            var result = proxy.createItem('DataExtension', config);
            isCreated = !!(result && result.Results && result.Results.length > 0 && String(result.Results[0].StatusCode) === 'OK');
        } catch (createErr) {
            isCreated = false;
        };
        return isCreated;
    };

    /**
     * @function isDataExtensionMissing
     * @description Tells whether one of SQL Studio's own Data Extensions is missing, with a local
     *              Platform.Function.Lookup that makes no API call. MCE throws "... does not exist" for
     *              a missing Data Extension (org probe, 2026-09-27). Any other error counts as present,
     *              so it never starts a needless create.
     * @param {string} deName
     * @param {string} fieldName - a field the Data Extension has.
     * @returns {boolean}
     */
    function isDataExtensionMissing(deName, fieldName) {
        var isMissing = false;
        try {
            Platform.Function.Lookup(deName, fieldName, fieldName, 'sqlstudio-existence-check');
        } catch (lookupErr) {
            isMissing = /does not exist/i.test(describeError(lookupErr));
        };
        return isMissing;
    };

    /**
     * @function isOldLayoutError
     * @description Tells whether a write to one of SQL Studio's own Data Extensions failed because the
     *              Data Extension is from an older release: it has no userId field, or a field too short
     *              for what this release writes (the Auth Log's session was 50 characters and its token
     *              520). It makes local Lookups only, no API call. The platform's error texts are not
     *              documented, so the answer rests on a probe instead: the Data Extension must exist, and
     *              a Lookup of its userId field must fail. Anything else stays an ordinary error.
     * @param {string} deName
     * @param {string} keyField - a field every layout of this Data Extension has ('session' or 'id')
     * @param {*} writeErr - what the write threw
     * @returns {boolean}
     */
    function isOldLayoutError(deName, keyField, writeErr) {
        /* The key field every layout has must read first: a Lookup that fails for any reason, a missing
        Data Extension included, says nothing about the layout, and must never lead to the advice to
        delete it. */
        try {
            Platform.Function.Lookup(deName, keyField, keyField, 'sqlstudio-layout-check');
        } catch (keyErr) {
            return false;
        };
        /* Only the probe decides. No older layout has userId, while a write error's text can also name
        a length on a current layout (a value too long), and telling the admin to delete a history Data
        Extension for that would wipe every user's rows. The values are cut to their fields before the
        write (isAuthLogUpserted, the history writes), so a current layout does not fail on length. */
        try {
            Platform.Function.Lookup(deName, 'userId', keyField, 'sqlstudio-layout-check');
        } catch (probeErr) {
            return true;
        };
        return false;
    };

    /**
     * @function createAuthLogForSignIn
     * @description The one piece of setup sign-in does itself: creates the Auth Log it has to write the
     *              session to, with its description, in the root folder, and nothing else. finishSetup
     *              moves it into the SQL Studio folder and sets its retention.
     * @returns {string} 'created', 'raced' (it exists after all, so the caller retries its write),
     *          'shared' (an ENT. name, never created) or 'failed'.
     */
    function createAuthLogForSignIn() {
        if (isEnterpriseShared(authDE)) {
            return 'shared';
        };
        if (isWsProxyCreateOk(authDE, authLogFields(), null, AUTH_LOG_DESCRIPTION, null)) {
            return 'created';
        };
        if (isDataExtensionPresent(authDE)) {
            return 'raced';
        };
        return 'failed';
    };

    /**
     * @function isDataExtensionMoved
     * @description Moves a Data Extension into a folder through WSProxy. Its StatusCode is a CLR value,
     *              so it is read through String().
     * @param {string} deName - the Data Extension's CustomerKey.
     * @param {*} folderId
     * @returns {boolean}
     */
    function isDataExtensionMoved(deName, folderId) {
        apiCallCount++;
        var isMoved = false;
        try {
            var proxy = new Script.Util.WSProxy();
            var result = proxy.updateItem('DataExtension', {
                CustomerKey: deName,
                CategoryID: folderId
            });
            isMoved = !!(result && result.Results && result.Results.length > 0 && String(result.Results[0].StatusCode) === 'OK');
        } catch (moveErr) {
            isMoved = false;
        };
        return isMoved;
    };

    /**
     * @function elapsedSince
     * @description Milliseconds since a (new Date()).getTime() value, for timing finishSetup's steps.
     * @param {number} startMs
     * @returns {number}
     */
    function elapsedSince(startMs) {
        return (new Date()).getTime() - startMs;
    };

    /**
     * @function isRetentionSetWithToken
     * @description Sets an individual-record retention on an existing Data Extension over SOAP, with the
     *              signed-in user's token, for when WSProxy's own context may not set one.
     * @param {string} deName - the Data Extension's CustomerKey.
     * @param {number} retentionDays
     * @param {string} token
     * @returns {boolean}
     */
    function isRetentionSetWithToken(deName, retentionDays, token) {
        var bodyXml = '<UpdateRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
            '<Objects xsi:type="DataExtension">' +
            '<CustomerKey>' + xmlEscape(deName) + '</CustomerKey>' +
            '<DataRetentionPeriodLength>' + retentionDays + '</DataRetentionPeriodLength>' +
            '<DataRetentionPeriod>Days</DataRetentionPeriod>' +
            '<RowBasedRetention>true</RowBasedRetention>' +
            '<ResetRetentionPeriodOnImport>false</ResetRetentionPeriodOnImport>' +
            '<DeleteAtEndOfRetentionPeriod>false</DeleteAtEndOfRetentionPeriod>' +
            '</Objects>' +
            '</UpdateRequest>';
        var soapRes = soap('Update', bodyXml, token);
        return soapRes.ok;
    };

    /**
     * @function provisionDataExtension
     * @description Called after a write to one of this backend's own Data Extensions failed.
     *              Creates the Data Extension when it is missing and tells the caller whether a
     *              retry of the failed write can now succeed. Two users signing in at the same
     *              moment on a fresh install both find AuthLog missing, and only one create can
     *              win. The loser's create fails, so it checks again and reports 'raced' when
     *              the Data Extension now exists, and its caller retries the write instead of
     *              showing an error.
     * @param {string} deName
     * @param {Object[]} fields - WSProxy Field definitions, in column order.
     * @param {number} retentionDays
     * @param {string} description
     * @param {?string} token - the signed-in user's token, for the retention retry.
     * @returns {string} 'created' (this call created it), 'created-no-retention' (created, but
     *          the retention could not be set), 'raced' (it exists, created by another request or
     *          earlier, so the caller retries its write once), 'shared' (an ENT. name, never
     *          created) or 'failed'.
     */
    function provisionDataExtension(deName, fields, retentionDays, description, token) {
        if (isEnterpriseShared(deName)) {
            return 'shared';
        };
        /* Its caller only gets here after a write failed, so the Data Extension is most likely
        missing: create it straight away, and look for it only when the create fails. */
        var createStatus = createDataExtension(deName, fields, retentionDays, description, token);
        if (createStatus !== 'failed') {
            return createStatus;
        };
        if (isDataExtensionPresent(deName)) {
            return 'raced';
        };
        return 'failed';
    };

    if (isConfigOutdated) {

        /* CONFIG_OUTDATED short-circuit: runs instead of sections 4/5 below, whatever the method,
        when the "1. CONFIGURATION" section above the marker is from an older release than this
        "APP CODE" section. */
        /* The clause names what changed since that section's own version: rewrite it when
        REQUIRED_CONFIG_VERSION goes up again. */
        var isConfigVersionOne = (typeof configVersion !== 'undefined') && configVersion == 1;
        var configOutdatedMessage = 'This SQL Studio Backend\'s "1. CONFIGURATION" section is from ' +
            'an older release than its "APP CODE" section. Copy the new "1. CONFIGURATION" section ' +
            'from the release file into this Code Resource and fill it in again' +
            (isConfigVersionOne ? ' (1.0.0 renamed "appURL" to "pageURL" and gave it and "backendURL" new placeholder values)' : '') + '.';
        if (method == 'POST') {
            var response = {
                ok: false,
                error: { code: 'CONFIG_OUTDATED', message: configOutdatedMessage, details: null }
            };
            response.meta = { apiCalls: apiCallCount };
            Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
            Platform.Response.SetResponseHeader('Cache-Control', 'no-store');
            /* Emitted by the ctrl:var line for stringifiedResponse at the end of the file, like every
            other POST response. Writing it here as well would send the JSON twice. */
            var stringifiedResponse = Stringify(response);
        } else {
            Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
            Write(Stringify({ code: 'CONFIG_OUTDATED', message: configOutdatedMessage }));
        };

    } else if (unsetSetting !== '' || clientBaseProblem !== '') {

        /* CONFIG_INVALID short-circuit, the same way: a clientBase that cannot be the tenant subdomain
        would send the browser to a sign-in host that does not exist, and a pageURL, backendURL,
        clientID or clientSecret still on its placeholder would send it to a placeholder address or
        sign it in with a placeholder client. The message names the setting, never its value. */
        var configInvalidMessage = 'SQL Studio Backend\'s ' + unsetSetting + ' setting is not filled in: it is empty or still holds ' +
            'its placeholder from the release file. Fill it in and publish again.';
        if (unsetSetting === '') {
            configInvalidMessage = 'SQL Studio Backend\'s clientBase setting ' + clientBaseProblem + '. It takes ' +
                'the tenant subdomain only: the 28 characters that start with "mc" in the API Integration\'s ' +
                'Authentication Base URI, between "https://" and ".auth.marketingcloudapis.com". Fill it in and publish again.';
        };
        if (method == 'POST') {
            var response = {
                ok: false,
                error: { code: 'CONFIG_INVALID', message: configInvalidMessage, details: null }
            };
            response.meta = { apiCalls: apiCallCount };
            Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
            Platform.Response.SetResponseHeader('Cache-Control', 'no-store');
            var stringifiedResponse = Stringify(response);
        } else {
            Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
            Write(Stringify({ code: 'CONFIG_INVALID', message: configInvalidMessage }));
        };

    } else if (method == 'GET') {

        /* --------------------------------------------------------------------- */
        /* -------------------- 4. AUTHENTICATION FLOW (GET) -------------------- */
        /* --------------------------------------------------------------------- */

        /**
         * @function authErrorRedirectUrl
         * @description Logs an authentication error and returns the Cloud Page URL that shows it, with a
         * known error code, since the Cloud Page renders its own error block whenever the query string
         * carries ?error= (template pattern). The Cloud Page maps `code` to a fixed message of its own
         * (L6) and never reflects `description` for anything but the standard OAuth codes, so
         * `description` here is for the error log only. The caller redirects once, after its try block.
         * In debugging mode it writes the error instead and returns null, so nothing redirects.
         * @param {Object} error - { code, message, description, isUnlogged? } - isUnlogged skips the
         *        ErrorLog row, for an error code that came in on the query string and is not a
         *        standard OAuth one.
         * @returns {?string} the Cloud Page URL to redirect to, or null in debugging mode.
         */
        function authErrorRedirectUrl(error) {
            /* The URL is built first, before the ErrorLog write. On MCE, the write's caught exception
            wiped a local named code, and every redirect went out with an empty error code, which the
            Cloud Page read as no error and sent the visitor back to sign in: an endless loop. */
            var errorCode = (error && error.code) ? String(error.code) : 'server_error';
            if (errorCode === '') {
                errorCode = 'server_error';
            };
            var errorText = (error && error.message) ? String(error.message) : errorCode;
            var errorDetails = (error && error.description) ? String(error.description) : '';
            var errorUrl = pageURL + '?error=' + urlEncode(errorCode) + '&error_description=' + urlEncode(errorDetails);
            if (debugging) {
                debugValue('Found error', error);
                return null;
            };
            /* M4: a failed write to errorDE must never block the redirect. */
            if (!error || !error.isUnlogged) {
                try {
                    Platform.Function.InsertData(errorDE, ['id', 'appName', 'errorMessage', 'errorDescription', 'errorDate'],
                        [GUID(), appName, truncate(errorText, 2000), truncate(errorDetails, 2000), Platform.Function.Now()]);
                } catch (logErr) {
                    // ignore: still redirect with the error code.
                };
            };
            return errorUrl;
        };

        /* What the last failed Auth Log write threw, for isOldLayoutError. */
        var authLogUpsertError = null;

        /**
         * @function isAuthLogUpserted
         * @description Writes the new session's AuthLog row. The row is keyed by the SHA256 of the fresh
         *              session id, and its token is the encrypted one: the caller computes both once,
         *              outside this try, so a failed hash or encryption is never mistaken for a failed
         *              write.
         * @param {string} sessionKey - sha256Hex of the session id
         * @param {string} storedToken - encryptToken of the access token
         * @param {Date} tokenExpire
         * @param {string} userName
         * @param {string} userEmail
         * @param {string} userId
         * @returns {boolean} false when the write threw (most often because authDE is missing, or is
         *          from an older release: see isOldLayoutError).
         */
        function isAuthLogUpserted(sessionKey, storedToken, tokenExpire, userName, userEmail, userId) {
            try {
                Platform.Function.UpsertData(authDE, ['session'], [sessionKey],
                    ['appName', 'createdDate', 'token', 'tokenExpire', 'userName', 'userEmail', 'userId'],
                    [appName, Platform.Function.Now(), storedToken, tokenExpire, truncate(String(userName || ''), 100), truncate(String(userEmail || ''), 254), truncate(String(userId || ''), 100)]);
                return true;
            } catch (authUpsertErr) {
                authLogUpsertError = authUpsertErr;
                return false;
            };
        };

        /**
         * @function tokenErrorText
         * @description Describes a failed token exchange for ErrorLog: the HTTP status plus the
         *              OAuth error code and description Marketing Cloud Engagement returned, such as
         *              invalid_client or a redirect_uri mismatch. The token endpoint's error body
         *              carries neither the client secret nor a token.
         * @param {Object} tokenRes - Result of httpJSON.
         * @returns {string}
         */
        function tokenErrorText(tokenRes) {
            var text = 'Status: ' + tokenRes.status;
            if (tokenRes.status === 0 && tokenRes.text) {
                text += '. ' + truncate(tokenRes.text, 500);
            };
            if (tokenRes.json && typeof tokenRes.json.error === 'string') {
                text += '. Error: ' + truncate(tokenRes.json.error, 100);
            };
            if (tokenRes.json && typeof tokenRes.json.error_description === 'string') {
                text += '. ' + truncate(tokenRes.json.error_description, 500);
            };
            return text;
        };

        /**
         * @function completeSignIn
         * @description The end of a sign-in that has a token and a user: mints the session id, stores the
         *              session in the Auth Log and answers where to send the visitor.
         *              H2: the session id is minted here, after the exchange, and never before - the
         *              visitor who started sign-in only ever saw `state`, never this value. The Auth Log
         *              never holds it: its row is keyed by the SHA256 of it, so a reader of the Auth Log
         *              cannot open a live session with what it finds there. The token is stored
         *              encrypted. The hash and the encryption run before the write, outside its try, so a
         *              failure of either ends in the sign-in's own error and never stores a plain token.
         *              When the write fails because the Auth Log is missing, only that is created, and the
         *              write runs again. Everything else a first install needs (the folder, the Error Log,
         *              the retentions) waits for finishSetup, which the app calls once it has loaded: doing
         *              it all here ran this redirect past MCE's time limit on the first org deployment. An
         *              Auth Log that exists but is from an older release fails the write too: it is told
         *              apart before any create is tried, and answered with its own setup error.
         * @param {string} accessToken
         * @param {Date} tokenExpire
         * @param {string} userName
         * @param {string} userEmail
         * @param {string} userId
         * @returns {string} the URL to redirect to: the Cloud Page with the session, or its error block.
         *          Exactly one target is chosen: a redirect to a session that was never stored would send
         *          the visitor straight back here, in an endless loop.
         */
        function completeSignIn(accessToken, tokenExpire, userName, userEmail, userId) {
            /* Cut to its field here, so the stored id and the id inside the token's ciphertext match. */
            userId = truncate(trimString(userId), 100);
            var sessionId = GUID();
            var sessionKey = sha256Hex(sessionId);
            var storedToken = encryptToken(accessToken, sessionKey, userId);

            var isSetupPending = false;
            var isAuthLogWritten = isAuthLogUpserted(sessionKey, storedToken, tokenExpire, userName, userEmail, userId);
            var isAuthLogOld = false;
            if (!isAuthLogWritten) {
                isAuthLogOld = isOldLayoutError(authDE, 'session', authLogUpsertError);
            };
            if (!isAuthLogWritten && !isAuthLogOld) {
                var authLogStatus = createAuthLogForSignIn();
                if (authLogStatus === 'created') {
                    isSetupPending = true;
                };
                if (authLogStatus === 'created' || authLogStatus === 'raced') {
                    isAuthLogWritten = isAuthLogUpserted(sessionKey, storedToken, tokenExpire, userName, userEmail, userId);
                    if (!isAuthLogWritten) {
                        isAuthLogOld = isOldLayoutError(authDE, 'session', authLogUpsertError);
                    };
                };
            };

            if (isAuthLogWritten) {
                var redirectUrl = pageURL + '?s=' + sessionId;
                if (isSetupPending) {
                    redirectUrl += '&setup=pending';
                };
                return redirectUrl;
            };
            if (isAuthLogOld) {
                return authErrorRedirectUrl({ code: 'authlog_old_layout', message: 'The sign-in log is from an older release.', description: 'The "' + authDE + '" Data Extension has the layout of an older release: delete it in Contact Builder, and SQL Studio creates it again on the next sign-in (see docs/DEPLOYMENT.md).' });
            };
            return authErrorRedirectUrl({ code: 'authlog_unavailable', message: 'Could not save your sign-in session.', description: 'The "' + authDE + '" Data Extension does not exist, or could not be created or updated. An admin must create it (see docs/DEPLOYMENT.md).' });
        };

        /**
         * @function isStandardOAuthErrorCode
         * @description Tells whether an error code from the query string is one of the standard OAuth 2.0
         *              codes (RFC 6749, sections 4.1.2.1 and 5.2), the only ones a sign-in error log row
         *              is written for.
         * @param {string} errorCode
         * @returns {boolean}
         */
        function isStandardOAuthErrorCode(errorCode) {
            var standardCodes = ['invalid_request', 'unauthorized_client', 'access_denied', 'unsupported_response_type',
                'invalid_scope', 'server_error', 'temporarily_unavailable', 'invalid_client'];
            for (var i = 0; i < standardCodes.length; i++) {
                if (standardCodes[i] === errorCode) {
                    return true;
                };
            };
            return false;
        };

        /* Every branch below only chooses where to send the visitor. The one redirect happens after
        the try block: Platform.Response.Redirect stops the script, so it must never sit inside a
        try whose catch could swallow it, and an unexpected error anywhere in sign-in lands on the
        Cloud Page's error block with an ErrorLog row instead of MCE's generic error page. */
        var authRedirect = null;
        try {
            var state = Platform.Request.GetQueryStringParameter('state');
            var errorMessage = Platform.Request.GetQueryStringParameter('error');
            var errorDescription = Platform.Request.GetQueryStringParameter('error_description');

            /* ---------------------- 4.1. Authorization ---------------------------- */

            if (!state && !errorMessage) {
                state = GUID();
                var authorizeUrl = authBase + '/v2/authorize?response_type=code&client_id=' + clientID +
                    '&redirect_uri=' + urlEncode(backendURL) + '&state=' + state + '&scope=' + urlEncode(scopes);
                authRedirect = authorizeUrl;

                /* -------------------- 4.2. Authentication with REST Token ---------- */

            } else if (state && !errorMessage) {

                /* H2 (session fixation): `state` is chosen by whoever starts the authorize request, so it
                must never become the session credential - an attacker can open the backend URL, copy the
                authorize link with its `state`, and send it to a colleague; once the colleague signs in,
                the attacker's own `state` would carry the colleague's token. Reject anything that is not
                GUID-shaped before it is used for anything, and mint a fresh, unguessable session id below
                instead of reusing `state` as the session. */
                if (!/^[0-9a-fA-F-]{36}$/.test(state)) {
                    authRedirect = authErrorRedirectUrl({ code: 'invalid_state', message: 'Invalid sign-in request', description: 'The state parameter was not a valid session id.' });
                } else {
                    var authCode = Platform.Request.GetQueryStringParameter('code');
                    var tokenPayload = {
                        grant_type: 'authorization_code',
                        code: authCode,
                        client_id: clientID,
                        client_secret: clientSecret,
                        redirect_uri: backendURL
                    };
                    /* Script.Util.HttpRequest (httpJSON), like every other call in this file, and not Core
                    HTTP.Post/HTTP.Get, which do not share its result shape or its error behaviour. With
                    HTTP.Post, a non-2xx status can throw and turn a failed exchange into a bare 500 page
                    with no ErrorLog row. HTTP.Get returns Status and Content, and an earlier version read
                    StatusCode from it, which can leave userName and userEmail blank in every AuthLog row. */
                    var tokenRes = httpJSON('POST', authBase + '/v2/token', tokenPayload, null);
                    var accessToken = (tokenRes.status === 200 && tokenRes.json && tokenRes.json.access_token) ? String(tokenRes.json.access_token) : '';

                    if (accessToken !== '') {
                        var tokenExpire = computeExpiry(tokenRes.json.expires_in);

                        /* 4.2.4. Get user details. userName and userEmail are for display only. Who the
                        user is comes from user.sub, else user.preferred_username (the MCE username), and
                        it drives the per-user Query Activity and temporary Data Extension names and
                        scopes history: a sign-in without one is refused, since every user without one
                        would share the same objects. An e-mail address can change or be reused, so it is
                        never the key. */
                        var userName = '';
                        var userEmail = '';
                        var userIdentity = pickUserIdentity(null);
                        var userInfoRes = httpJSON('GET', authBase + '/v2/userinfo', null, accessToken);
                        if (userInfoRes.status === 200 && userInfoRes.json && userInfoRes.json.user) {
                            userName = userInfoRes.json.user.name ? String(userInfoRes.json.user.name) : '';
                            userEmail = userInfoRes.json.user.email ? String(userInfoRes.json.user.email) : '';
                            userIdentity = pickUserIdentity(userInfoRes.json.user);
                        };

                        if (userIdentity.userId === '') {
                            authRedirect = authErrorRedirectUrl({ code: 'identity_unavailable', message: 'Could not tell who signed in.', description: 'Marketing Cloud Engagement\'s /v2/userinfo answered with status ' + userInfoRes.status + ' and no usable user.sub or user.preferred_username (one of at most ' + USER_ID_MAX_LENGTH + ' characters).' });
                        } else {
                            authRedirect = completeSignIn(accessToken, tokenExpire, userName, userEmail, userIdentity.userId);
                        };

                        /* 4.2.7. Handle a failed token exchange. */
                    } else {
                        authRedirect = authErrorRedirectUrl({ code: 'token_exchange_failed', message: 'Authentication Failed', description: tokenErrorText(tokenRes) });
                    };
                };

                /* ------------------- 4.3. Authorization Error ---------------------- */

            } else {
                /* 4.3. The query string is anyone's to write, so an error is logged only when its code is
                one of the standard OAuth ones, and its description is cut to 200 characters. Any other
                code is still passed on, capped at 100 characters, and the Cloud Page shows its fixed
                "Sign-in failed." for it. */
                var incomingCode = truncate(errorMessage, 100);
                authRedirect = authErrorRedirectUrl({
                    code: incomingCode,
                    message: incomingCode,
                    description: truncate(errorDescription, 200),
                    isUnlogged: !isStandardOAuthErrorCode(incomingCode)
                });
            };
        } catch (authFlowErr) {
            authRedirect = authErrorRedirectUrl({ code: 'signin_failed', message: 'Sign-in failed unexpectedly', description: describeError(authFlowErr) });
        };
        if (authRedirect) {
            Platform.Response.Redirect(authRedirect);
        };

    } else if (method == 'POST') {

        /* --------------------------------------------------------------------- */
        /* ----------------------- 5. BACKEND FLOW (POST) ----------------------- */
        /* --------------------------------------------------------------------- */

        /* ---------------------- 5.4. Action handlers --------------------------- */
        /* Declared before dispatch so the switch below reads top to bottom.      */

        /**
         * @function actionFinishSetup
         * @description Finishes the setup the first sign-in started, once the app has loaded, one step
         *              per request so each gets MCE's full time limit: WSProxy calls were slow enough on
         *              the first org deployment that doing it all in the sign-in redirect ran out of time.
         *              The app calls the steps in order and keeps its progress, so a failed step is
         *              retried the next time it opens. A Data Extension that already existed is left as
         *              it is. Each step reports how long it took.
         *              - 'folder': finds or creates the SQL Studio folder under Data Extensions.
         *              - 'authLog': moves the Auth Log into that folder and sets its 1-day retention
         *                with the user's own token, since WSProxy's context may not set one.
         *              - 'errorLog': creates the Error Log in that folder, with its 180-day retention.
         * @param {Object} payload - { step: 'folder'|'authLog'|'errorLog', folderId?: string }
         * @param {Object} authRow
         * @returns {Object} { step, elapsedMs, ... } with folderId, isMoved and isRetentionSet, or
         *          errorLog, depending on the step.
         */
        function actionFinishSetup(payload, authRow) {
            var setupStep = payload.step;
            var stepStartMs = (new Date()).getTime();
            var folderId = null;
            if (payload.folderId !== null && payload.folderId !== undefined && String(payload.folderId) !== '') {
                folderId = parseInt(String(payload.folderId), 10);
                if (isNaN(folderId)) {
                    folderId = null;
                };
            };
            var data = { step: setupStep };
            if (setupStep === 'folder') {
                var foundFolderId = findOrCreateSetupFolderId();
                data.folderId = (foundFolderId === null || foundFolderId === undefined) ? null : String(foundFolderId);
            } else if (setupStep === 'authLog') {
                data.isMoved = (folderId !== null && !isEnterpriseShared(authDE)) ? isDataExtensionMoved(authDE, folderId) : false;
                data.isRetentionSet = isEnterpriseShared(authDE) ? false : isRetentionSetWithToken(authDE, AUTH_LOG_RETENTION_DAYS, authRow.token);
            } else if (setupStep === 'errorLog') {
                if (folderId !== null) {
                    setupFolderIdLookup.isDone = true;
                    setupFolderIdLookup.folderId = folderId;
                };
                var errorLogStatus = 'shared';
                if (!isEnterpriseShared(errorDE)) {
                    errorLogStatus = isDataExtensionPresent(errorDE) ? 'present' : provisionDataExtension(errorDE, errorLogFields(), ERROR_LOG_RETENTION_DAYS, ERROR_LOG_DESCRIPTION, authRow.token);
                    /* An Error Log created before the folder existed (a failed folder step) moves in on the retry. */
                    if (errorLogStatus === 'present' && folderId !== null) {
                        data.isMoved = isDataExtensionMoved(errorDE, folderId);
                    };
                };
                data.errorLog = errorLogStatus;
            } else {
                throw apiError('BAD_REQUEST', 'Field "step" must be folder, authLog or errorLog.', null);
            };
            data.elapsedMs = elapsedSince(stepStartMs);
            return data;
        };

        /**
         * @function actionWhoami
         * @description Returns who is signed in, the Business Unit, the session's remaining seconds,
         *              whether server-side history is on, and which of SQL Studio's own Data Extensions
         *              are missing: the app's first call after it loads. `userKey` is the user hash, an
         *              opaque 8-character key the app scopes its browser storage by, and never the user
         *              id itself. `identitySource` says where the user id came from, 'sub' or
         *              'preferred_username', read from the same /v2/userinfo call (null when that call
         *              fails), for the console line and the org check. The e-mail is for display only.
         * @param {Object} payload - {}
         * @param {Object} authRow
         * @returns {Object}
         */
        function actionWhoami(payload, authRow) {
            var userName = authRow.userName || '';
            var userEmail = authRow.userEmail || '';
            var mid = null;
            var enterpriseId = null;
            var identitySource = null;

            var res = httpJSON('GET', authBase + '/v2/userinfo', null, authRow.token);
            if (res.status === 200 && res.json) {
                if (res.json.user) {
                    if (res.json.user.name) {
                        userName = res.json.user.name;
                    };
                    if (res.json.user.email) {
                        userEmail = res.json.user.email;
                    };
                    var identity = pickUserIdentity(res.json.user);
                    identitySource = (identity.source === '') ? null : identity.source;
                };
                if (res.json.organization) {
                    if (res.json.organization.member_id !== undefined) {
                        mid = res.json.organization.member_id;
                    };
                    if (res.json.organization.enterprise_id !== undefined) {
                        enterpriseId = res.json.organization.enterprise_id;
                    };
                };
            };

            /* SQL Studio's own Data Extensions that are missing, so the app can recreate them: the
            Error Log is created after the first sign-in and can be deleted later. A local Lookup,
            no API call. */
            var missingDataExtensions = [];
            if (!isEnterpriseShared(errorDE) && isDataExtensionMissing(errorDE, 'id')) {
                missingDataExtensions.push('errorLog');
            };

            var data = {
                userName: userName,
                userEmail: userEmail,
                userKey: computeUserHash(authRow),
                identitySource: identitySource,
                mid: mid,
                enterpriseId: enterpriseId,
                tokenSecondsLeft: secondsUntil(authRow.tokenExpire),
                backendVersion: appVersion,
                historyEnabled: (historyDE !== ''),
                missingDataExtensions: missingDataExtensions
            };
            return data;
        };

        /**
         * @function requireHistoryEnabled
         * @description Throws BAD_REQUEST when server-side history (historyDE) is not configured.
         */
        function requireHistoryEnabled() {
            if (historyDE === '') {
                throw apiError('BAD_REQUEST', 'History is not enabled.', null);
            };
        };

        /**
         * @function requireHistoryUser
         * @description Returns the user id that scopes a user's history rows, or throws BAD_REQUEST when
         *              the session has none. Sign-in refuses a user without one, so this only guards a
         *              session row that was not written by this release. A blank value would match
         *              every other blank-id user's rows, so listHistory would show them and
         *              clearHistory would delete them.
         * @param {Object} authRow
         * @returns {string}
         */
        function requireHistoryUser(authRow) {
            var userId = trimString(authRow.userId || '');
            if (userId === '') {
                throw apiError('BAD_REQUEST', 'History needs your user id, and this session has none. Sign in again.', null);
            };
            return userId;
        };

        /**
         * @function historyOldLayoutError
         * @description The error for a history Data Extension from an older release, which has no userId
         *              field: the same setup answer the Auth Log gets.
         * @returns {Object} apiError HISTORY_OLD_LAYOUT
         */
        function historyOldLayoutError() {
            return apiError('HISTORY_OLD_LAYOUT', 'The history Data Extension "' + historyDE + '" is from an older release: delete it in Contact Builder, and SQL Studio creates it again the next time a query is recorded.', null);
        };

        /**
         * @function formatHistoryCreatedDate
         * @description Converts a history row's createdDate to an ISO string via isoDate() when it
         *              parses as a date, else passes the raw value through unchanged.
         * @param {*} value
         * @returns {string|*}
         */
        function formatHistoryCreatedDate(value) {
            var parsedDate = new Date(value);
            if (isNaN(parsedDate.getTime())) {
                return value;
            };
            return isoDate(parsedDate);
        };

        /**
         * @function compareHistoryCreatedDateDescending
         * @description Sort comparator for history rows, newest createdDate first. Unparseable dates
         *              sort as if they were the epoch, matching formatHistoryCreatedDate's fallback.
         * @param {Object} a
         * @param {Object} b
         * @returns {number}
         */
        function compareHistoryCreatedDateDescending(a, b) {
            var ad = new Date(a.createdDate).getTime();
            var bd = new Date(b.createdDate).getTime();
            if (isNaN(ad)) {
                ad = 0;
            };
            if (isNaN(bd)) {
                bd = 0;
            };
            return bd - ad;
        };

        /**
         * @function actionAddHistory
         * @description Inserts one query-history row for the current user, keyed by their user id, with
         *              their e-mail beside it for display. createdDate is written
         *              explicitly (Platform.Function.Now()) rather than relying on the Data
         *              Extension's own "Current date" default, so a historyDE this backend
         *              auto-created (which has no such default configured) behaves the same as one
         *              an admin created by hand.
         * @param {Object} payload - { sql, rowCount?, durationMs?, status, deKey? }
         * @param {Object} authRow
         * @returns {{id:string}}
         */
        function actionAddHistory(payload, authRow) {
            requireHistoryEnabled();
            var userId = requireHistoryUser(authRow);

            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var rowCount = payload.rowCount;
            if (rowCount !== undefined && rowCount !== null) {
                rowCount = requireInt(rowCount, 'rowCount', 0, null);
            } else {
                rowCount = null;
            };

            var durationMs = payload.durationMs;
            if (durationMs !== undefined && durationMs !== null) {
                durationMs = requireInt(durationMs, 'durationMs', 0, null);
            } else {
                durationMs = null;
            };

            var status = payload.status;
            if (status !== 'done' && status !== 'failed' && status !== 'cancelled') {
                throw apiError('BAD_REQUEST', 'Field "status" must be one of done, failed, cancelled.', null);
            };

            var deKey = payload.deKey;
            if (deKey !== undefined && deKey !== null && deKey !== '') {
                requireString(deKey, 'deKey', 1, 36);
            } else {
                deKey = null;
            };

            var id = GUID();
            var columns = ['id', 'userId', 'userEmail', 'createdDate', 'sql', 'rowCount', 'durationMs', 'status', 'deKey'];
            var values = [id, userId, truncate(trimString(authRow.userEmail || ''), 254), Platform.Function.Now(), sql, rowCount, durationMs, status, deKey];
            try {
                Platform.Function.InsertData(historyDE, columns, values);
            } catch (insertErr) {

                /* A history Data Extension from an older release has no userId field: say so, before any
                create is tried. */
                if (isOldLayoutError(historyDE, 'id', insertErr)) {
                    throw historyOldLayoutError();
                };

                /* historyDE is missing (first use of server-side history, or an admin who has not
                created it yet): create it once and retry the insert - but never for a shared
                ('ENT.') DE, and never when historyDE already exists (some other write failure,
                which should surface as the usual INTERNAL error instead). */
                var historyStatus = provisionDataExtension(historyDE, historyLogFields(), HISTORY_RETENTION_DAYS, HISTORY_DESCRIPTION, authRow.token);
                if (historyStatus !== 'created' && historyStatus !== 'created-no-retention' && historyStatus !== 'raced') {
                    throw insertErr;
                };
                Platform.Function.InsertData(historyDE, columns, values);
            };

            var data = { id: id };
            return data;
        };

        /**
         * @function actionListHistory
         * @description Lists the current user's query-history rows (matched by user id), newest first,
         *              truncated to limit.
         * @param {Object} payload - { limit? }
         * @param {Object} authRow
         * @returns {{items:Array}}
         */
        function actionListHistory(payload, authRow) {
            requireHistoryEnabled();

            var limit = payload.limit;
            if (limit === undefined || limit === null) {
                limit = 100;
            } else {
                limit = requireInt(limit, 'limit', 1, 200);
            };

            var userId = requireHistoryUser(authRow);
            var rows = null;
            try {
                rows = Platform.Function.LookupRows(historyDE, ['userId'], [userId]);
            } catch (lookupErr) {
                if (isOldLayoutError(historyDE, 'id', lookupErr)) {
                    throw historyOldLayoutError();
                };
                throw lookupErr;
            };
            if (!rows) {
                rows = [];
            };

            rows.sort(compareHistoryCreatedDateDescending);

            if (rows.length > limit) {
                rows = rows.slice(0, limit);
            };

            var items = [];
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                items.push({
                    id: row.id,
                    sql: row.sql,
                    createdDate: formatHistoryCreatedDate(row.createdDate),
                    rowCount: (row.rowCount === undefined) ? null : row.rowCount,
                    durationMs: (row.durationMs === undefined) ? null : row.durationMs,
                    status: (row.status === undefined) ? null : row.status,
                    deKey: (row.deKey === undefined) ? null : row.deKey
                });
            };

            var data = { items: items };
            return data;
        };

        /**
         * @function actionClearHistory
         * @description Deletes all of the current user's query-history rows.
         * @param {Object} payload - {}
         * @param {Object} authRow
         * @returns {{deleted:number}}
         */
        function actionClearHistory(payload, authRow) {
            requireHistoryEnabled();

            var userId = requireHistoryUser(authRow);
            var deleted = 0;
            try {
                deleted = Platform.Function.DeleteData(historyDE, ['userId'], [userId]);
            } catch (deleteErr) {
                if (isOldLayoutError(historyDE, 'id', deleteErr)) {
                    throw historyOldLayoutError();
                };
                throw deleteErr;
            };

            var data = { deleted: (typeof deleted === 'number') ? deleted : 0 };
            return data;
        };

        /**
         * @function retrieveDataFolders
         * @description Retrieves every DataFolder of the given content types over SOAP, for the
         *              temp-folder resolve/create flow (actionGetWorkspace) and actionListFolders.
         * @param {string} token
         * @param {string[]} contentTypes
         * @returns {Object} soap() result; .results holds the raw <Results> XML blocks.
         */
        function retrieveDataFolders(token, contentTypes) {
            var valuesXml = '';
            for (var i = 0; i < contentTypes.length; i++) {
                valuesXml += '<Value>' + xmlEscape(contentTypes[i]) + '</Value>';
            };
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>DataFolder</ObjectType>' +
                '<Properties>ID</Properties>' +
                '<Properties>Name</Properties>' +
                '<Properties>ParentFolder.ID</Properties>' +
                '<Properties>ContentType</Properties>' +
                '<Properties>CustomerKey</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>ContentType</Property>' +
                '<SimpleOperator>IN</SimpleOperator>' +
                valuesXml +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';

            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };
            return soapRes;
        };

        /**
         * @function retrieveWorkspaceFolders
         * @description Retrieves only the folders actionGetWorkspace needs: the root folders and the
         *              folders named tempFolderName, of the given content types. Listing every folder
         *              ran past MCE's time limit on the first org deployment. Falls back to the full
         *              listing when the narrow filter is refused.
         * @param {string} token
         * @param {string[]} contentTypes
         * @returns {Object} soap() result; .results holds the raw <Results> XML blocks.
         */
        function retrieveWorkspaceFolders(token, contentTypes) {
            var valuesXml = '';
            for (var i = 0; i < contentTypes.length; i++) {
                valuesXml += '<Value>' + xmlEscape(contentTypes[i]) + '</Value>';
            };
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>DataFolder</ObjectType>' +
                '<Properties>ID</Properties>' +
                '<Properties>Name</Properties>' +
                '<Properties>ParentFolder.ID</Properties>' +
                '<Properties>ContentType</Properties>' +
                '<Properties>CustomerKey</Properties>' +
                '<Filter xsi:type="ComplexFilterPart">' +
                '<LeftOperand xsi:type="SimpleFilterPart">' +
                '<Property>ContentType</Property>' +
                '<SimpleOperator>IN</SimpleOperator>' +
                valuesXml +
                '</LeftOperand>' +
                '<LogicalOperator>AND</LogicalOperator>' +
                '<RightOperand xsi:type="ComplexFilterPart">' +
                '<LeftOperand xsi:type="SimpleFilterPart">' +
                '<Property>ParentFolder.ID</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>0</Value>' +
                '</LeftOperand>' +
                '<LogicalOperator>OR</LogicalOperator>' +
                '<RightOperand xsi:type="SimpleFilterPart">' +
                '<Property>Name</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(tempFolderName) + '</Value>' +
                '</RightOperand>' +
                '</RightOperand>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';

            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                return retrieveDataFolders(token, contentTypes);
            };
            return soapRes;
        };

        /**
         * @function parseFolderBlocks
         * @description Parses each raw <Results> XML block from a DataFolder Retrieve into a plain
         *              folder object. MCE lists <ParentFolder> before <Name>, so a copy of the block
         *              with the nested <ParentFolder> element stripped is used to read the folder's own
         *              properties without xmlValue matching inside the nested element by mistake.
         * @param {string[]} blocks - Raw <Results> XML blocks from a DataFolder Retrieve.
         * @returns {Object[]} { id, name, parentId, contentType, customerKey } per folder.
         */
        function parseFolderBlocks(blocks) {
            var folders = [];
            for (var i = 0; i < blocks.length; i++) {
                var block = blocks[i];
                /* MCE lists <ParentFolder> before <Name>; read own properties from a copy without it. */
                var own = xmlWithout(block, 'ParentFolder');
                var folder = {
                    id: xmlValue(own, 'ID'),
                    name: xmlValue(own, 'Name'),
                    parentId: xmlParentFolderId(block),
                    contentType: xmlValue(own, 'ContentType'),
                    customerKey: xmlValue(own, 'CustomerKey')
                };
                folders.push(folder);
            };
            return folders;
        };

        /**
         * @function findRootFolderId
         * @description Finds the top-level (parentless) folder id for a given content type, the
         *              anchor actionGetWorkspace creates the SQL Studio temp folder under.
         * @param {Object[]} folders - Parsed folders, from parseFolderBlocks().
         * @param {string} contentType
         * @returns {?string} The root folder's id, or null when not found.
         */
        function findRootFolderId(folders, contentType) {
            for (var i = 0; i < folders.length; i++) {
                var folder = folders[i];
                var isRoot = (folder.parentId === '0' || folder.parentId === null || folder.parentId === 0);
                if (folder.contentType === contentType && isRoot) {
                    return folder.id;
                };
            };
            return null;
        };

        /**
         * @function findTopFolderId
         * @description Finds the top folder of one content type's tree: the folder of that type whose parent
         *              is not a folder of that type, for a root whose parent ID is not 0.
         * @param {Object[]} folders - Parsed folders, from parseFolderBlocks(), all of one listing.
         * @param {string} contentType
         * @returns {?string} The top folder's id, or null when there is none or more than one.
         */
        function findTopFolderId(folders, contentType) {
            var ids = {};
            for (var i = 0; i < folders.length; i++) {
                if (folders[i].contentType === contentType) {
                    ids[String(folders[i].id)] = true;
                };
            };
            var tops = [];
            for (var j = 0; j < folders.length; j++) {
                var folder = folders[j];
                if (folder.contentType === contentType && !ids.hasOwnProperty(String(folder.parentId))) {
                    tops.push(folder.id);
                };
            };
            /* Only one top is a root. Several mean the listing is partial, and guessing would file the
            folder in the wrong place. */
            return tops.length === 1 ? tops[0] : null;
        };

        /**
         * @function findNamedFolderId
         * @description Finds a specific direct child of rootId by name and content type, used to
         *              check whether the SQL Studio temp folder already exists before creating it.
         * @param {Object[]} folders - Parsed folders, from parseFolderBlocks().
         * @param {string} contentType
         * @param {?string} rootId - Parent folder id to match under.
         * @param {string} name
         * @returns {?string} The matching folder's id, or null when not found.
         */
        function findNamedFolderId(folders, contentType, rootId, name) {
            for (var i = 0; i < folders.length; i++) {
                var folder = folders[i];
                if (folder.contentType === contentType && folder.name === name && folder.parentId === rootId) {
                    return folder.id;
                };
            };
            return null;
        };

        /**
         * @function createDataFolder
         * @description Creates one DataFolder over SOAP (used to create the SQL Studio temp folder
         *              the first time actionGetWorkspace runs for a given content type).
         * @param {string} token
         * @param {string} name
         * @param {string} contentType
         * @param {?string} parentId
         * @returns {{ok: boolean, id: ?string, message: ?string}} ok:false carries the MCE status
         *          message instead of throwing, since a folder-create failure is only a warning here.
         */
        function createDataFolder(token, name, contentType, parentId) {
            /* A DataFolder create requires the name, the description and the parent folder (Salesforce's
            DataFolder create example). Without the description, the query folder was never created, and
            SQL Studio's query activities went to the root folder (the author's org, 2026-09-29). No
            CustomerKey: it is not required, and a fixed one would clash with a SQL Studio folder the user
            renamed or moved. The elements follow the WSDL's order. */
            var isQueryFolder = contentType === 'queryactivity';
            var bodyXml = '<CreateRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataFolder">' +
                '<ParentFolder><ID>' + xmlEscape(parentId) + '</ID></ParentFolder>' +
                '<Name>' + xmlEscape(name) + '</Name>' +
                '<Description>' + xmlEscape(isQueryFolder ? 'SQL Studio: the query activities it runs for each user.' : 'SQL Studio: its sign-in, error and history Data Extensions, and the temporary results of each run.') + '</Description>' +
                '<ContentType>' + xmlEscape(contentType) + '</ContentType>' +
                '<IsActive>true</IsActive>' +
                '<IsEditable>true</IsEditable>' +
                '<AllowChildren>true</AllowChildren>' +
                '</Objects>' +
                '</CreateRequest>';

            var soapRes = soap('Create', bodyXml, token);
            if (soapRes.ok) {
                var newId = null;
                if (soapRes.results.length > 0) {
                    newId = xmlValue(soapRes.results[0], 'NewID');
                };
                var okResult = {
                    ok: true,
                    id: newId,
                    message: null
                };
                return okResult;
            };

            var message = 'Could not create folder.';
            if (soapRes.results.length > 0) {
                var statusMessage = xmlValue(soapRes.results[0], 'StatusMessage');
                if (statusMessage) {
                    message = statusMessage;
                };
            };
            var failResult = {
                ok: false,
                id: null,
                message: message
            };
            return failResult;
        };

        /**
         * @function actionGetWorkspace
         * @description Resolves (creating them the first time) the "SQL Studio" temp folders under
         *              both the Data Extension and Query Activity root folders, so runQuery/saveQueryActivity
         *              have somewhere to file the objects they create.
         * @param {Object} payload - {}
         * @param {Object} authRow
         * @returns {{deFolderId, deRootId, queryFolderId, queryRootId, created: string[], warnings: (string[]|undefined)}}
         */
        function actionGetWorkspace(payload, authRow) {
            var soapRes = retrieveWorkspaceFolders(authRow.token, ['dataextension', 'queryactivity']);
            var folders = parseFolderBlocks(soapRes.results);

            var deRootId = findRootFolderId(folders, 'dataextension');
            var queryRootId = findRootFolderId(folders, 'queryactivity');
            /* The narrow retrieve finds a root by its parent ID 0. When the Query root is not found that way,
            the query folders are few enough to list whole: the root is the one whose parent is not one of
            them. */
            var created = [];
            var warnings = [];
            if (!queryRootId) {
                /* A failure here costs only the query folder, never the Data Extension one. */
                try {
                    var queryFolders = parseFolderBlocks(retrieveDataFolders(authRow.token, ['queryactivity']).results);
                    queryRootId = findTopFolderId(queryFolders, 'queryactivity');
                    folders = folders.concat(queryFolders);
                } catch (listErr) {
                    warnings.push('Could not list the query folders: ' + ((listErr && listErr.message) ? listErr.message : String(listErr)));
                };
            };

            var deFolderId = findNamedFolderId(folders, 'dataextension', deRootId, tempFolderName);
            var queryFolderId = findNamedFolderId(folders, 'queryactivity', queryRootId, tempFolderName);

            if (!deFolderId) {
                var deCreate = createDataFolder(authRow.token, tempFolderName, 'dataextension', deRootId);
                if (deCreate.ok) {
                    deFolderId = deCreate.id;
                    created.push('dataextension');
                } else {
                    deFolderId = deRootId;
                    warnings.push(deCreate.message);
                };
            };
            if (!queryFolderId) {
                var queryCreate = createDataFolder(authRow.token, tempFolderName, 'queryactivity', queryRootId);
                if (queryCreate.ok) {
                    queryFolderId = queryCreate.id;
                    created.push('queryactivity');
                } else {
                    queryFolderId = queryRootId;
                    warnings.push(queryCreate.message);
                };
            };

            var data = {
                deFolderId: deFolderId,
                deRootId: deRootId,
                queryFolderId: queryFolderId,
                queryRootId: queryRootId,
                created: created
            };
            if (warnings.length > 0) {
                data.warnings = warnings;
            };
            return data;
        };

        /**
         * @function actionListFolders
         * @description Lists folders (default: every content type the sidebar cares about, or a
         *              caller-supplied subset) for the sidebar's folder tree.
         * @param {Object} payload - { contentTypes }
         * @param {Object} authRow
         * @returns {{items: Object[], hasMore: boolean, requestId: ?string}}
         */
        function actionListFolders(payload, authRow) {
            var contentTypes = payload.contentTypes;
            if (contentTypes === undefined || contentTypes === null) {
                contentTypes = ['dataextension', 'shared_dataextension', 'salesforcedataextension', 'synchronizeddataextension', 'queryactivity'];
            } else {
                requireArray(contentTypes, 'contentTypes');
                for (var i = 0; i < contentTypes.length; i++) {
                    requireString(contentTypes[i], 'contentTypes[' + i + ']', 1, 64);
                };
            };

            var soapRes = retrieveDataFolders(authRow.token, contentTypes);
            var folders = parseFolderBlocks(soapRes.results);

            var items = [];
            for (var j = 0; j < folders.length; j++) {
                var f = folders[j];
                items.push({
                    id: f.id,
                    parentId: f.parentId,
                    name: f.name,
                    contentType: f.contentType
                });
            };

            var data = {
                items: items,
                hasMore: (soapRes.overallStatus === 'MoreDataAvailable'),
                requestId: soapRes.requestId
            };
            return data;
        };

        /**
         * @function isTempDeKey
         * @description Tells whether a Data Extension key is one of SQL Studio's own temporary
         *              run Data Extensions (tempPrefix + an 8-char hex user hash + a
         *              yyyyMMdd_HHmmss stamp, from any user and any slot in the pool - see
         *              makeTempDeKey), so actionListDataExtensions can leave it out of the list it
         *              returns. Matched with indexOf/substring/charAt, not a regex: a regex replace()
         *              failed with "Object expected: replace" on the first org deployment (see the
         *              note above actionListRuns).
         * @param {string} key
         * @returns {boolean}
         */
        function isTempDeKey(key) {
            var text = '' + (key || '');
            if (text.indexOf(tempPrefix) !== 0) {
                return false;
            };
            /* <8-char hex userHash>_<8-digit date>_<6-digit time> = 24 characters, once a slot
            2-QUERY_SLOT_COUNT suffix (see makeTempDeKey) is stripped off the end. */
            var rest = stripTempDeKeySlotSuffix(text).substring(tempPrefix.length);
            if (rest.length !== 24 || rest.charAt(8) !== '_' || rest.charAt(17) !== '_') {
                return false;
            };
            var i, ch;
            for (i = 0; i < 8; i++) {
                ch = rest.charAt(i);
                if (!((ch >= '0' && ch <= '9') || (ch >= 'a' && ch <= 'f'))) {
                    return false;
                };
            };
            for (i = 9; i < 17; i++) {
                ch = rest.charAt(i);
                if (ch < '0' || ch > '9') {
                    return false;
                };
            };
            for (i = 18; i < 24; i++) {
                ch = rest.charAt(i);
                if (ch < '0' || ch > '9') {
                    return false;
                };
            };
            return true;
        };

        /**
         * @function actionListDataExtensions
         * @description Lists Data Extensions over SOAP, one page at a time (a payload.requestId
         *              continues a previous MoreDataAvailable page instead of starting a fresh
         *              Retrieve), leaving out SQL Studio's own temporary run Data Extensions so
         *              the App's Data Extension list never shows them.
         * @param {Object} payload - { requestId }
         * @param {Object} authRow
         * @returns {{items: Object[], nextRequestId: ?string}} nextRequestId is set only when
         *          another page is available.
         */
        function actionListDataExtensions(payload, authRow) {
            var requestId = payload.requestId;
            var bodyXml;

            if (requestId !== undefined && requestId !== null && requestId !== '') {
                requireString(requestId, 'requestId', 1, 64);
                bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                    '<RetrieveRequest>' +
                    '<ContinueRequest>' + xmlEscape(requestId) + '</ContinueRequest>' +
                    '</RetrieveRequest>' +
                    '</RetrieveRequestMsg>';
            } else {
                bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                    '<RetrieveRequest>' +
                    '<ObjectType>DataExtension</ObjectType>' +
                    '<Properties>ObjectID</Properties>' +
                    '<Properties>CustomerKey</Properties>' +
                    '<Properties>Name</Properties>' +
                    '<Properties>CategoryID</Properties>' +
                    '<Properties>IsSendable</Properties>' +
                    '</RetrieveRequest>' +
                    '</RetrieveRequestMsg>';
            };

            var soapRes = soap('Retrieve', bodyXml, authRow.token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };

            var items = [];
            for (var i = 0; i < soapRes.results.length; i++) {
                var block = soapRes.results[i];
                var key = xmlValue(block, 'CustomerKey');
                if (isTempDeKey(key)) {
                    continue;
                };
                items.push({
                    objectId: xmlValue(block, 'ObjectID'),
                    key: key,
                    name: xmlValue(block, 'Name'),
                    categoryId: toNullableInt(xmlValue(block, 'CategoryID')),
                    isSendable: xmlValue(block, 'IsSendable') === 'true'
                });
            };

            var data = {
                items: items,
                nextRequestId: (soapRes.overallStatus === 'MoreDataAvailable') ? soapRes.requestId : null
            };
            return data;
        };

        /**
         * @function actionGetDataExtensionFields
         * @description Retrieves a Data Extension's field schema over SOAP, by CustomerKey (an
         *              ENT. shared-DE prefix, if present, is stripped before filtering).
         * @param {Object} payload - { key }
         * @param {Object} authRow
         * @returns {{key: string, fields: Object[]}} fields sorted by their DE ordinal.
         */
        function actionGetDataExtensionFields(payload, authRow) {
            var key = payload.key;
            requireString(key, 'key', 1, 36);

            var filterKey = key;
            if (filterKey.indexOf('ENT.') === 0) {
                filterKey = filterKey.substring(4);
            };

            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>DataExtensionField</ObjectType>' +
                '<Properties>Name</Properties>' +
                '<Properties>FieldType</Properties>' +
                '<Properties>MaxLength</Properties>' +
                '<Properties>IsRequired</Properties>' +
                '<Properties>IsPrimaryKey</Properties>' +
                '<Properties>Ordinal</Properties>' +
                '<Properties>Scale</Properties>' +
                '<Properties>DefaultValue</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>DataExtension.CustomerKey</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(filterKey) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';

            var soapRes = soap('Retrieve', bodyXml, authRow.token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };

            var fields = [];
            for (var i = 0; i < soapRes.results.length; i++) {
                var block = soapRes.results[i];
                fields.push({
                    name: xmlValue(block, 'Name'),
                    type: xmlValue(block, 'FieldType'),
                    length: toNullableInt(xmlValue(block, 'MaxLength')),
                    scale: toNullableInt(xmlValue(block, 'Scale')),
                    isPrimaryKey: xmlValue(block, 'IsPrimaryKey') === 'true',
                    isNullable: xmlValue(block, 'IsRequired') !== 'true',
                    ordinal: toNullableInt(xmlValue(block, 'Ordinal')),
                    defaultValue: xmlValue(block, 'DefaultValue')
                });
            };

            fields.sort(function (a, b) {
                var oa = (a.ordinal === null) ? 0 : a.ordinal;
                var ob = (b.ordinal === null) ? 0 : b.ordinal;
                return oa - ob;
            });

            var data = {
                key: key,
                fields: fields
            };
            return data;
        };

        /**
         * @function actionValidateQuery
         * @description Validates a query's SQL against MCE's own validate endpoint, without running it.
         * @param {Object} payload - { sql }
         * @param {Object} authRow
         * @returns {{valid: boolean, errors: string[]}}
         */
        function actionValidateQuery(payload, authRow) {
            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var res = httpJSON('POST', restBase + '/automation/v1/queries/actions/validate/', { Text: sql }, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var errors = [];
            if (body.errors) {
                for (var i = 0; i < body.errors.length; i++) {
                    var e = body.errors[i];
                    if (typeof e === 'string') {
                        errors.push(e);
                    } else if (e && typeof e.message === 'string') {
                        errors.push(e.message);
                    } else {
                        errors.push(Stringify(e));
                    };
