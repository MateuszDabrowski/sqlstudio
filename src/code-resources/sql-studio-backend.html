                };
            };

            var data = {
                valid: body.queryValid === true,
                errors: errors
            };
            return data;
        };

        /* Free reads (no API call) of a run's own temporary Data Extension. ROW_MARK_FIELD is an
        extra column whose default value fills it in every row the query writes, so
        LookupOrderedRows, which needs a filter, can select every row. It returns at most 2,000. */
        var ROW_MARK_FIELD = 'SQLStudioRowMark';
        var ROW_MARK_VALUE = '1';
        var FREE_READ_MAX_ROWS = 2000;

        /**
         * @function canCarryRowMark
         * @description Tells whether a run's temporary Data Extension can have the row-mark column: not
         *              when one of the query's own columns already has that name.
         * @param {string[]} columns
         * @returns {boolean}
         */
        function canCarryRowMark(columns) {
            for (var i = 0; i < columns.length; i++) {
                if (String(columns[i]).toLowerCase() === ROW_MARK_FIELD.toLowerCase()) {
                    return false;
                };
            };
            return true;
        };

        /**
         * @function isOwnTempDeKey
         * @description Tells whether a key names one of the calling user's own temporary Data Extensions
         *              (SQLStudio_<userHash>_yyyyMMdd_HHmmss, from any slot in the pool - a slot
         *              2-QUERY_SLOT_COUNT suffix is stripped before the check). The free reads run as
         *              this Code Resource, not with the user's token, so they are limited to these -
         *              never another user's hash, whichever slot ran it.
         * @param {Object} authRow
         * @param {string} deKey
         * @returns {boolean}
         */
        function isOwnTempDeKey(authRow, deKey) {
            var userHash = computeUserHash(authRow);
            var ownKeyPattern = new RegExp('^' + tempPrefix + userHash + '_[0-9]{8}_[0-9]{6}$');
            return ownKeyPattern.test(stripTempDeKeySlotSuffix(String(deKey || '')));
        };

        /**
         * @function readRowCount
         * @description Counts a Data Extension's rows with AMPscript's DataExtensionRowCount, a data
         *              function that is not an API call. The AMPscript is built in pieces so this file never
         *              holds a literal AMPscript block for the page to run on its own.
         * @param {string} deName
         * @returns {?number} the count, or null when it cannot be read: a Data Extension in another
         *          Business Unit than this Code Resource, or a platform that refuses the call.
         */
        function readRowCount(deName) {
            try {
                Platform.Variable.SetValue('@ssRowCountDe', deName);
                var rendered = Platform.Function.TreatAsContent('%' + '%=DataExtensionRowCount(@ssRowCountDe)=%' + '%');
                var rowCount = parseInt(String(rendered), 10);
                return isNaN(rowCount) ? null : rowCount;
            } catch (rowCountErr) {
                return null;
            };
        };

        /**
         * @function readRowsFree
         * @description Reads one page of a run's results with LookupOrderedRows, which is not an API call,
         *              or returns null so the caller reads it through REST: past the first 2,000 rows, when
         *              the row count cannot be read, or when fewer marked rows come back than the count
         *              promises (the column default was not applied).
         * @param {string} deKey
         * @param {string[]} columns
         * @param {number} page
         * @param {number} pageSize
         * @param {?string} orderBy - "Field" or "Field ASC|DESC"
         * @returns {?Object} the same shape as actionGetResults, with readPath 'free'
         */
        function readRowsFree(deKey, columns, page, pageSize, orderBy) {
            var wanted = page * pageSize;
            if (wanted > FREE_READ_MAX_ROWS) {
                return null;
            };
            var rowCount = readRowCount(deKey);
            if (rowCount === null) {
                return null;
            };
            var orderText = ROW_MARK_FIELD + ' ASC';
            if (orderBy) {
                orderText = /\s(ASC|DESC)$/.test(orderBy) ? orderBy : orderBy + ' ASC';
            };
            var marked = null;
            try {
                marked = Platform.Function.LookupOrderedRows(deKey, wanted, orderText, ROW_MARK_FIELD, ROW_MARK_VALUE);
            } catch (lookupErr) {
                return null;
            };
            var markedCount = marked ? marked.length : 0;
            if (markedCount < Math.min(wanted, rowCount)) {
                return null;
            };
            var rows = [];
            for (var i = (page - 1) * pageSize; i < markedCount; i++) {
                var rowValues = [];
                for (var c = 0; c < columns.length; c++) {
                    var value = marked[i][columns[c]];
                    rowValues.push((value === null || value === undefined) ? null : String(value));
                };
                rows.push(rowValues);
            };
            var data = {
                count: rowCount,
                page: page,
                pageSize: pageSize,
                columns: columns,
                rows: rows,
                readPath: 'free'
            };
            return data;
        };

        /**
         * @function buildColumnFieldXml
         * @description Builds the DataExtensionField XML of one output column: Text unless the column has
         *              a validated type. A Decimal carries its precision as MaxLength, which is where
         *              Marketing Cloud Engagement keeps it (Fields.Add documents MaxLength as the
         *              number of digits before and after the point, and DataExtensionField has no
         *              working Precision: the WSDL marks Precision "reserved for future use", and a
         *              retrieve of a Decimal field answers with MaxLength and Scale), followed by its
         *              Scale. The WSDL lists Scale before MaxLength, and so does this. Every field is
         *              nullable (IsRequired false), whatever its type.
         * @param {string} name - The column name.
         * @param {?Object} columnType - A validateColumnType result, or null for Text.
         * @returns {string} The Field element.
         */
        function buildColumnFieldXml(name, columnType) {
            var fieldType = columnType ? columnType.type : 'Text';
            var decimalXml = '';
            if (fieldType === 'Decimal') {
                decimalXml = '<Scale>' + columnType.scale + '</Scale>' +
                    '<MaxLength>' + columnType.precision + '</MaxLength>';
            };
            var fieldXml = '<Field xsi:type="DataExtensionField">' +
                '<Name>' + xmlEscape(name) + '</Name>' +
                '<FieldType>' + fieldType + '</FieldType>' +
                decimalXml +
                '<IsRequired>false</IsRequired>' +
                '<IsPrimaryKey>false</IsPrimaryKey>' +
                '</Field>';
            return fieldXml;
        };

        /**
         * @function buildDataExtensionCreateXml
         * @description Builds the SOAP CreateRequest XML for the temporary Data Extension a run creates:
         *              one field per output column, Text unless the column has a type (a plain reference
         *              to a Date, Number, Decimal or Boolean field, see actionRunQuery), optionally with
         *              the one-day retention policy (createTempDataExtension retries once without it,
         *              since some orgs reject DataRetentionPeriodLength on Create).
         * @param {string} key - CustomerKey/Name for the new Data Extension.
         * @param {string[]} columns - Output column names, each becomes a field.
         * @param {?number} deFolderId - CategoryID to file it under, or null to omit.
         * @param {boolean} hasRetention - Whether to include the one-day retention block.
         * @param {Array} [columnTypes] - Validated types (validateColumnTypes), one per column; a missing list is every column Text.
         * @returns {string} The CreateRequest SOAP body XML.
         */
        function buildDataExtensionCreateXml(key, columns, deFolderId, hasRetention, columnTypes) {
            var fieldsXml = '';
            for (var i = 0; i < columns.length; i++) {
                var columnType = (columnTypes && i < columnTypes.length) ? columnTypes[i] : null;
                fieldsXml += buildColumnFieldXml(columns[i], columnType);
            };
            if (canCarryRowMark(columns)) {
                /* The query never writes this column, so its default fills it in every row: a free
                LookupOrderedRows can then filter on it (see readRowsFree). */
                fieldsXml += '<Field xsi:type="DataExtensionField">' +
                    '<Name>' + ROW_MARK_FIELD + '</Name>' +
                    '<FieldType>Text</FieldType>' +
                    '<MaxLength>1</MaxLength>' +
                    '<IsRequired>false</IsRequired>' +
                    '<IsPrimaryKey>false</IsPrimaryKey>' +
                    '<DefaultValue>' + ROW_MARK_VALUE + '</DefaultValue>' +
                    '</Field>';
            };

            var retentionXml = '';
            if (hasRetention) {
                retentionXml =
                    '<DataRetentionPeriodLength>1</DataRetentionPeriodLength>' +
                    '<DataRetentionPeriod>Days</DataRetentionPeriod>' +
                    '<RowBasedRetention>false</RowBasedRetention>' +
                    '<ResetRetentionPeriodOnImport>false</ResetRetentionPeriodOnImport>' +
                    '<DeleteAtEndOfRetentionPeriod>false</DeleteAtEndOfRetentionPeriod>';
            };

            var categoryXml = '';
            if (deFolderId !== null && deFolderId !== undefined) {
                categoryXml = '<CategoryID>' + xmlEscape(deFolderId) + '</CategoryID>';
            };

            var bodyXml = '<CreateRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataExtension">' +
                '<CustomerKey>' + xmlEscape(key) + '</CustomerKey>' +
                '<Name>' + xmlEscape(key) + '</Name>' +
                '<Description>' + xmlEscape(TEMP_OBJECT_DESCRIPTION) + '</Description>' +
                categoryXml +
                '<IsSendable>false</IsSendable>' +
                retentionXml +
                '<Fields>' + fieldsXml + '</Fields>' +
                '</Objects>' +
                '</CreateRequest>';
            return bodyXml;
        };

        /**
         * @function createTempDataExtension
         * @description Creates the temporary Data Extension a run's results are written to, retrying
         *              once without the one-day retention policy if the first attempt's MCE status
         *              message mentions "retention" (some orgs reject that field on Create).
         * @param {string} token
         * @param {string} key - CustomerKey/Name for the new Data Extension.
         * @param {string[]} columns - Output column names, each becomes a field.
         * @param {?number} deFolderId - CategoryID to file it under, or null to omit.
         * @param {Array} [columnTypes] - Validated types (validateColumnTypes), one per column; a missing list is every column Text.
         * @returns {{deId: ?string, retentionApplied: boolean, hasRowMark: boolean}}
         * @throws {Object} apiError when both the retention and no-retention attempts fail.
         */
        function createTempDataExtension(token, key, columns, deFolderId, columnTypes) {
            var withRetention = buildDataExtensionCreateXml(key, columns, deFolderId, true, columnTypes);
            var soapRes = soap('Create', withRetention, token);

            if (soapRes.ok) {
                var newObjectId = (soapRes.results.length > 0) ? xmlValue(soapRes.results[0], 'NewObjectID') : null;
                var okResult = {
                    deId: newObjectId,
                    retentionApplied: true,
                    hasRowMark: canCarryRowMark(columns)
                };
                return okResult;
            };

            var message = (soapRes.results.length > 0) ? xmlValue(soapRes.results[0], 'StatusMessage') : '';
            var doesMentionRetention = message && message.toLowerCase().indexOf('retention') !== -1;

            if (doesMentionRetention) {
                var withoutRetention = buildDataExtensionCreateXml(key, columns, deFolderId, false, columnTypes);
                var retryRes = soap('Create', withoutRetention, token);
                if (retryRes.ok) {
                    var retryObjectId = (retryRes.results.length > 0) ? xmlValue(retryRes.results[0], 'NewObjectID') : null;
                    var retryResult = {
                        deId: retryObjectId,
                        retentionApplied: false,
                        hasRowMark: canCarryRowMark(columns)
                    };
                    return retryResult;
                };
                throw sfmcErrorFromSoap(retryRes);
            };

            throw sfmcErrorFromSoap(soapRes);
        };

        /**
         * @function deleteDataExtensionByKey
         * @description Deletes one Data Extension over SOAP by CustomerKey. Never throws on failure -
         *              callers treat a delete failure as a warning, not a reason to fail the request
         *              (e.g. a run that already succeeded should not fail just because cleanup of an
         *              earlier temp DE didn't).
         * @param {string} token
         * @param {string} key - CustomerKey of the Data Extension to delete.
         * @returns {{ok: boolean, raw: string}} raw is the SOAP response body, for a warning message.
         */
        function deleteDataExtensionByKey(token, key) {
            var bodyXml = '<DeleteRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataExtension">' +
                '<CustomerKey>' + xmlEscape(key) + '</CustomerKey>' +
                '</Objects>' +
                '</DeleteRequest>';
            var soapRes = soap('Delete', bodyXml, token);
            var isOk = soapRes.ok;
            var result = {
                ok: isOk,
                raw: soapRes.raw
            };
            return result;
        };

        /**
         * @function findActivityIdByKey
         * @description M2: finds the per-user ad-hoc Query Activity by its exact CustomerKey over SOAP,
         *              instead of an unpaged REST list (`Name like 'SQL Studio - '`, $pageSize=100) that
         *              could miss the activity in a Business Unit with more than 100 matches. The SOAP
         *              filter is an exact match, so there is nothing to page and no case folding to do
         *              (CustomerKey is case-preserving but MCE matches it case-insensitively).
         * @param {string} token
         * @param {string} activityKey
         * @returns {string|null} the ObjectID (used as the REST queryDefinitionId), or null when not found.
         */
        function findActivityIdByKey(token, activityKey) {
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>QueryDefinition</ObjectType>' +
                '<Properties>ObjectID</Properties>' +
                '<Properties>CustomerKey</Properties>' +
                '<Properties>Name</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>CustomerKey</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(activityKey) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';

            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };
            if (soapRes.results.length === 0) {
                return null;
            };
            return xmlValue(soapRes.results[0], 'ObjectID');
        };

        /**
         * @function isActivityRunning
         * @description Tells whether a Query Activity is currently running (REST isrunning check). Any
         *              non-2xx response (e.g. a 404 for an activity that no longer exists) is treated as
         *              "not running" - the PATCH/POST that follows will surface a real problem with the
         *              id on its own.
         * @param {string} token
         * @param {string} activityId
         * @returns {boolean}
         */
        function isActivityRunning(token, activityId) {
            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(activityId) + '/actions/isrunning/', null, token);
            return (res.status >= 200 && res.status < 300 && res.json && res.json.isRunning === true);
        };

        /**
         * @function isOwnActivity
         * @description Tells whether a Query Activity id belongs to the caller's pool slot: its
         *              CustomerKey is the key SQL Studio builds for this user and slot. runQuery
         *              overwrites the activity it reuses (name, key, query text and target), and the
         *              id comes from the browser, so it is never trusted on its own: it could be any
         *              activity the user's token can change. One REST call. The key is compared without
         *              regard to case, as Marketing Cloud Engagement matches CustomerKey. Anything that
         *              is not a clear yes (a 404, another status, no key) is a no.
         * @param {string} token
         * @param {string} activityId
         * @param {string} expectedKey - adHocActivityKey of this user and slot
         * @returns {boolean}
         */
        function isOwnActivity(token, activityId, expectedKey) {
            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(activityId), null, token);
            if (res.status < 200 || res.status >= 300 || !res.json || res.json.key === undefined || res.json.key === null) {
                return false;
            };
            return String(res.json.key).toLowerCase() === String(expectedKey).toLowerCase();
        };

        /**
         * @function checkActivityNotRunning
         * @description M6: refuses to let a second run start against the same per-user ad-hoc Query
         *              Activity while an earlier run (another tab or window) is still executing.
         * @param {string} token
         * @param {string} activityId
         * @throws {Object} apiError RUN_IN_PROGRESS when the activity is currently running.
         */
        function checkActivityNotRunning(token, activityId) {
            if (isActivityRunning(token, activityId)) {
                throw apiError('RUN_IN_PROGRESS', 'Your SQL Studio query is still running in another tab or window. Wait for it to finish, then run again.', null);
            };
        };

        /**
         * @function actionRunQuery
         * @description Runs a query: picks the first free slot, from the requested one up, in the
         *              caller's pool of up to QUERY_SLOT_COUNT per-user ad-hoc Query Activities (M6),
         *              resolves (or creates) that slot's activity, creates a fresh temporary Data
         *              Extension for the results, points the activity at it and starts it. On any
         *              failure after the temp DE was created, the DE (never the activity) is deleted
         *              before the error is thrown.
         * @param {Object} payload - { sql, columns, columnTypes?, deFolderId, queryFolderId, queryId?, slot? }.
         *        columnTypes is an optional array parallel to columns, each entry { type: 'Date' | 'Number' |
         *        'Decimal' | 'Boolean', precision?, scale? } or null for Text. An invalid, unknown or missing
         *        entry is Text, and never fails the run (validateColumnType).
         * @param {Object} authRow
         * @returns {{runId, deKey, deName, deId, queryId, queryName, queryReused: boolean,
         *           slot: number, startedAt: string, retentionApplied: boolean, columns: string[],
         *           columnTypes: Array}} columnTypes is what the temporary Data Extension really got, one
         *           entry per column: null for Text, otherwise { type } or, for a Decimal, { type, precision, scale }.
         */
        function actionRunQuery(payload, authRow) {
            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);
            var columns = validateColumns(payload.columns);
            var columnTypes = validateColumnTypes(payload.columnTypes, columns.length);

            var deFolderId = payload.deFolderId;
            if (deFolderId !== undefined && deFolderId !== null) {
                deFolderId = requireInt(deFolderId, 'deFolderId', 1, null);
            } else {
                deFolderId = null;
            };
            var queryFolderId = payload.queryFolderId;
            if (queryFolderId !== undefined && queryFolderId !== null) {
                queryFolderId = requireInt(queryFolderId, 'queryFolderId', 1, null);
            } else {
                queryFolderId = null;
            };

            var cachedQueryId = payload.queryId;
            var hasCachedQueryId = (cachedQueryId !== undefined && cachedQueryId !== null && cachedQueryId !== '');
            if (hasCachedQueryId) {
                requireGuid(cachedQueryId, 'queryId');
            };

            var requestedSlot = payload.slot;
            if (requestedSlot !== undefined && requestedSlot !== null) {
                requestedSlot = requireInt(requestedSlot, 'slot', 1, QUERY_SLOT_COUNT);
            } else {
                requestedSlot = 1;
            };

            var userHash = computeUserHash(authRow);

            /* The payload's queryId is only a hint: the run PATCHes the activity it resolves to, so an
            id that is not this user's activity for this slot (a saved Query Activity, or another user's)
            would be overwritten. It is checked against the key SQL Studio builds for this user and
            slot, and one that fails is ignored: the activity is then found by key, as with no id at all. */
            var isCachedQueryIdOwn = hasCachedQueryId && isOwnActivity(authRow.token, cachedQueryId, adHocActivityKey(userHash, requestedSlot));

            /* Step 1-2 (M2, M6): walk the pool from the requested slot up, stopping at the first slot
            that is not currently running. The frontend's cached id is only good for the requested slot
            (its own per-slot cache - see docs/ARCHITECTURE.md), and only once it passed the check above;
            every other slot this tries is resolved by a SOAP Retrieve of QueryDefinition by exact
            CustomerKey, the same M2 lookup slot 1 always used. A slot with no activity yet (brand-new
            user, or this slot never used) is free by definition - nothing to check, nothing created
            until step 3. Stops at the first free slot, so a busy slot costs exactly one isrunning
            check, same as the single-slot check it replaces. */
            var slot = null;
            var queryId = null;
            var usedCachedQueryId = false;
            for (var trySlot = requestedSlot; trySlot <= QUERY_SLOT_COUNT; trySlot++) {
                var isCacheForThisSlot = (trySlot === requestedSlot && isCachedQueryIdOwn);
                var tryQueryId = isCacheForThisSlot ? cachedQueryId : findActivityIdByKey(authRow.token, adHocActivityKey(userHash, trySlot));
                if (tryQueryId !== null && isActivityRunning(authRow.token, tryQueryId)) {
                    continue;
                };
                slot = trySlot;
                queryId = tryQueryId;
                usedCachedQueryId = isCacheForThisSlot;
                break;
            };
            if (slot === null) {
                throw apiError('RUN_IN_PROGRESS', 'All ' + QUERY_SLOT_COUNT + ' of your SQL Studio queries are running. Wait for one to finish, then run again.', null);
            };

            var activityKey = adHocActivityKey(userHash, slot);
            var activityName = adHocActivityName(authRow.userName, userHash, slot);
            var activityDescription = adHocActivityDescription(authRow.userEmail);

            var deKey = makeTempDeKey(userHash, slot);

            /* Step 3: create the temporary Data Extension with retention (SOAP). */
            var createResult = createTempDataExtension(authRow.token, deKey, columns, deFolderId, columnTypes);
            var deId = createResult.deId;
            var wasRetentionApplied = createResult.retentionApplied;
            var hasRowMark = createResult.hasRowMark === true;

            /* Full body used for the PATCH or POST against this slot's ad-hoc Query Activity. */
            var activityBody = {
                name: activityName,
                key: activityKey,
                description: activityDescription,
                queryText: sql,
                targetName: deKey,
                targetKey: deKey,
                targetId: deId,
                targetUpdateTypeId: 0,
                targetUpdateTypeName: 'Overwrite'
            };
            if (queryFolderId !== null) {
                activityBody.categoryId = queryFolderId;
            };

            var queryName = activityName;
            var wasQueryReused = false;

            /* Step 4: PATCH the resolved activity, or POST a new one when none was found (or the
            resolved id turned out to be stale, a 404 - narrow race between the lookup above and
            here). On any other PATCH/POST failure, delete only the DE; the activity is never deleted. */
            if (queryId !== null) {
                var patchRes = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(queryId), activityBody, authRow.token);
                if (patchRes.status >= 200 && patchRes.status < 300) {
                    wasQueryReused = true;
                    if (patchRes.json && patchRes.json.name) {
                        queryName = patchRes.json.name;
                    };
                } else if (patchRes.status === 404) {
                    /* The cached id is stale. The activity may still exist under another id (recreated from
                    another browser), so re-resolve it by key before creating one, or the POST would
                    collide on the key. Only when the id just PATCHed actually came from the cache - a
                    freshly SOAP-resolved id 404ing means it was deleted a moment ago, and there is nothing
                    left to re-resolve. */
                    queryId = usedCachedQueryId ? findActivityIdByKey(authRow.token, activityKey) : null;
                    if (queryId !== null && queryId !== cachedQueryId) {
                        /* M6 again: the slot loop above checked the stale cached id, not this one, and
                        another browser may be running this activity right now. */
                        try {
                            checkActivityNotRunning(authRow.token, queryId);
                        } catch (runningErr) {
                            deleteDataExtensionByKey(authRow.token, deKey);
                            throw runningErr;
                        };
                        var retryPatchRes = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(queryId), activityBody, authRow.token);
                        if (retryPatchRes.status >= 200 && retryPatchRes.status < 300) {
                            wasQueryReused = true;
                        } else if (retryPatchRes.status === 404) {
                            queryId = null;
                        } else {
                            deleteDataExtensionByKey(authRow.token, deKey);
                            throw sfmcErrorFromResponse(retryPatchRes);
                        };
                    } else {
                        queryId = null;
                    };
                } else {
                    deleteDataExtensionByKey(authRow.token, deKey);
                    throw sfmcErrorFromResponse(patchRes);
                };
            };
            if (queryId === null) {
                var createRes = httpJSON('POST', restBase + '/automation/v1/queries/', activityBody, authRow.token);
                if (createRes.status < 200 || createRes.status >= 300 || !createRes.json || !createRes.json.queryDefinitionId) {
                    deleteDataExtensionByKey(authRow.token, deKey);
                    throw sfmcErrorFromResponse(createRes);
                };
                queryId = createRes.json.queryDefinitionId;
                wasQueryReused = false;
                if (createRes.json.name) {
                    queryName = createRes.json.name;
                };
            };

            /* Step 5: start the Query Activity. SOAP Perform (Action Start) on the QueryDefinition
            answers with a Task ID (ORG-VERIFICATION item 28), which getRunOutcome later reads back
            through AsyncActivityStatus to learn whether a 0-row run finished, failed or is still
            queued. The REST start only ever answers "OK", with nothing to ask about later. The REST
            start is the fallback only after a clear refusal: Marketing Cloud Engagement answered the
            Perform itself and said Error, or faulted the request as the client's. After anything
            else, such as a network failure or a gateway's error page, the Perform may have started
            the run, and a REST start could run it twice: that is thrown as a failed start is,
            deleting only the temp DE, never the activity. */
            var startMethod = 'soap';
            var taskId = null;
            var startResponse = '';

            var performBody = '<PerformRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Action>Start</Action>' +
                '<Definitions>' +
                '<Definition xsi:type="QueryDefinition">' +
                '<ObjectID>' + xmlEscape(queryId) + '</ObjectID>' +
                '</Definition>' +
                '</Definitions>' +
                '</PerformRequestMsg>';
            var performRes = soap('Perform', performBody, authRow.token);

            var performResultBlock = (performRes.results && performRes.results.length > 0) ? performRes.results[0] : null;
            /* The Result's own StatusCode, not the Task's, which comes later in the same block. */
            var performResultStatusCode = performResultBlock ? xmlValue(xmlWithout(performResultBlock, 'Task'), 'StatusCode') : null;
            var performResultStatusMessage = performResultBlock ? xmlValue(xmlWithout(performResultBlock, 'Task'), 'StatusMessage') : null;
            /* Only inside <Task>: the echoed <Object> comes first and may carry an <ID> of its own, such
            as its Client's MID. */
            var performTaskBlock = performResultBlock ? xmlRaw(performResultBlock, 'Task') : null;
            var performTaskId = performTaskBlock ? xmlValue(performTaskBlock, 'ID') : null;
            var performFailed = !performRes.ok || (performResultStatusCode !== null && performResultStatusCode !== 'OK');
            var performFaultCode = xmlValue(performRes.raw, 'faultcode');
            var isClearRefusal = performRes.status !== 0 && (
                (performRes.overallStatus !== null && performRes.overallStatus !== '' && isSoapError(performRes.overallStatus)) ||
                (performRes.ok && performResultStatusCode === 'Error') ||
                (performFaultCode !== null && performFaultCode.toLowerCase().indexOf('client') !== -1));

            if (performFailed && !isClearRefusal) {
                deleteDataExtensionByKey(authRow.token, deKey);
                throw sfmcErrorFromSoap(performRes);
            };

            if (performFailed && isSoapSessionFault(performRes.raw)) {
                /* The fault text itself says the token is the problem: a REST start would fail the
                same way, so there is nothing a fallback would fix. */
                deleteDataExtensionByKey(authRow.token, deKey);
                throw sfmcErrorFromSoap(performRes);
            };

            if (performFailed) {
                startMethod = 'rest';
                var startRes = httpJSON('POST', restBase + '/automation/v1/queries/' + urlEncode(queryId) + '/actions/start/', {}, authRow.token);
                if (startRes.status < 200 || startRes.status >= 300) {
                    deleteDataExtensionByKey(authRow.token, deKey);
                    throw sfmcErrorFromResponse(startRes);
                };
                taskId = null;
                startResponse = truncate('Perform: ' + (performResultStatusMessage || performRes.overallStatus || 'failed') + '. Fell back to REST start.', 500);
            } else {
                taskId = performTaskId;
                startResponse = truncate('Perform: ' + (performResultStatusMessage || 'OK') + '. Task ID: ' + (taskId ? 'yes' : 'no') + '.', 500);
            };

            var data = {
                runId: deKey,
                deKey: deKey,
                deName: deKey,
                deId: deId,
                queryId: queryId,
                queryName: queryName,
                queryReused: wasQueryReused,
                slot: slot,
                startedAt: isoDate(Platform.Function.SystemDateToLocalDate(Platform.Function.Now())),
                retentionApplied: wasRetentionApplied,
                hasRowMark: hasRowMark,
                columns: columns,
                columnTypes: columnTypes,
                taskId: taskId,
                startMethod: startMethod,
                /* Diagnostic (ORG-VERIFICATION item 28): which way the run started and what Perform said,
                to confirm the real Status spellings and never leak the token. At most 500 characters. */
                startResponse: startResponse
            };
            return data;
        };

        /**
         * @function getOneRunStatus
         * @description Polls one run. With deKey, it counts the run's temporary Data Extension for free:
         *              its rows appear when the query finishes. The Query Activity's status is an API call,
         *              made when the caller asks for it (checkRunning), when no deKey is given, and when the
         *              count cannot be read. A query that returns no rows never fills its Data Extension,
         *              so only the status shows that it finished. Shared by actionGetRunStatus's single-run
         *              form and its batched `runs` form (docs/TABS-SPEC.md phase 2).
         * @param {Object} entry - { queryId, deKey?, checkRunning? }
         * @param {Object} authRow
         * @returns {{queryId: string, isRunning: ?boolean, rowCount: ?number}} isRunning is null when not asked for.
         */
        function getOneRunStatus(entry, authRow) {
            var queryId = entry.queryId;
            requireGuid(queryId, 'queryId');

            var deKey = entry.deKey;
            var hasDeKey = (deKey !== undefined && deKey !== null && deKey !== '');
            var rowCount = null;
            if (hasDeKey) {
                requireString(deKey, 'deKey', 1, 36);
                if (!isOwnTempDeKey(authRow, deKey)) {
                    throw apiError('BAD_REQUEST', 'Only SQL Studio\'s own temporary Data Extensions can be checked.', null);
                };
                rowCount = readRowCount(deKey);
            };

            var isRunning = null;
            if (!hasDeKey || entry.checkRunning === true || rowCount === null) {
                var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(queryId) + '/actions/isrunning/', null, authRow.token);
                if (res.status < 200 || res.status >= 300) {
                    throw sfmcErrorFromResponse(res);
                };
                isRunning = !!(res.json && res.json.isRunning);
            };

            return {
                queryId: queryId,
                isRunning: isRunning,
                rowCount: rowCount
            };
        };

        /**
         * @function actionGetRunStatus
         * @description Polls a run, or - docs/TABS-SPEC.md phase 2 - several at once, one poll for every
         *              tab due on the same tick instead of one Backend request per tab. The single-run
         *              payload/response keep working exactly as before; `payload.runs` (an array of 1 to
         *              QUERY_SLOT_COUNT single-run payloads) answers with `{ runs: [...] }` in the same
         *              order instead. A run whose deKey is not the caller's own is refused the same way the
         *              single form refuses it, and more than QUERY_SLOT_COUNT entries is BAD_REQUEST.
         * @param {Object} payload - { queryId, deKey?, checkRunning? } or { runs: [ {queryId, deKey?, checkRunning?}, ... ] }
         * @param {Object} authRow
         * @returns {Object} the single-run shape, or { runs: [...] } for the batched form
         */
        function actionGetRunStatus(payload, authRow) {
            if (payload.runs !== undefined && payload.runs !== null) {
                var runsIn = requireArray(payload.runs, 'runs');
                if (runsIn.length < 1 || runsIn.length > QUERY_SLOT_COUNT) {
                    throw apiError('BAD_REQUEST', 'Field "runs" must have 1 to ' + QUERY_SLOT_COUNT + ' entries.', null);
                };
                var out = [];
                for (var i = 0; i < runsIn.length; i++) {
                    var entry = runsIn[i];
                    if (!entry || typeof entry !== 'object') {
                        throw apiError('BAD_REQUEST', 'Field "runs[' + i + ']" must be an object.', null);
                    };
                    /* One run's failure, such as a deleted activity or an MCE error, is that run's answer
                    and must not fail the others. A bad request or an ended session still fails the
                    whole call, as the single form does. */
                    try {
                        out.push(getOneRunStatus(entry, authRow));
                    } catch (entryErr) {
                        var entryCode = (entryErr && entryErr.code) ? entryErr.code : 'INTERNAL';
                        if (entryCode === 'BAD_REQUEST' || entryCode === 'SESSION_EXPIRED' || entryCode === 'SESSION_INVALID') {
                            throw entryErr;
                        };
                        out.push({
                            queryId: entry.queryId,
                            error: { code: entryCode, message: (entryErr && entryErr.message) ? entryErr.message : ('' + entryErr), details: (entryErr && entryErr.details) ? entryErr.details : null }
                        });
                    };
                };
                return { runs: out };
            };
            return getOneRunStatus(payload, authRow);
        };

        /**
         * @function actionGetRunOutcome
         * @description SOAP Retrieve of AsyncActivityStatus filtered on TaskID (ORG-VERIFICATION item
         *              28): the outcome of a run started through actionRunQuery's SOAP Perform, asked
         *              by the App only once its first status check reads 0 rows. The possible Status
         *              values Marketing Cloud Engagement returns are not documented, so this hands the
         *              raw text straight back and leaves classifying it to the caller. 1 API call.
         * @param {Object} payload - { taskId }
         * @param {Object} authRow
         * @returns {{found: boolean, status: string|null, statusMessage: string|null, errorMsg: string|null, completedDate: string|null}}
         */
        function actionGetRunOutcome(payload, authRow) {
            var taskId = requireTaskId(payload.taskId, 'taskId');

            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>AsyncActivityStatus</ObjectType>' +
                '<Properties>Status</Properties>' +
                '<Properties>StatusMessage</Properties>' +
                '<Properties>ErrorMsg</Properties>' +
                '<Properties>CompletedDate</Properties>' +
                '<Properties>StartTime</Properties>' +
                '<Properties>EndTime</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>TaskID</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(taskId) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';
            var soapRes = soap('Retrieve', bodyXml, authRow.token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };

            var block = (soapRes.results && soapRes.results.length > 0) ? soapRes.results[0] : null;
            if (!block) {
                return {
                    found: false,
                    status: null,
                    statusMessage: null,
                    errorMsg: null,
                    completedDate: null,
                    raw: truncate(soapRes.overallStatus || '', 200)
                };
            };

            /* Salesforce documents the answer as ObjectExtension results, whose values sit in
            <Properties><Property><Name>..</Name><Value>..</Value></Property></Properties>. A value read
            as a plain element is kept as the fallback. The raw block goes back too, as the diagnostic
            that settles the real shape and Status spellings on the org. */
            var named = soapPropertyValues(block);
            var pick = function (name) {
                if (named.hasOwnProperty(name)) {
                    return named[name];
                };
                return xmlValue(block, name);
            };
            var data = {
                found: true,
                status: pick('Status'),
                statusMessage: pick('StatusMessage'),
                errorMsg: pick('ErrorMsg'),
                completedDate: pick('CompletedDate'),
                raw: truncate(block, 1500)
            };
            return data;
        };

        /**
         * @function actionGetResults
         * @description Fetches one page of a run's result rows from the temp Data Extension's rowset
         *              endpoint. When payload.columns is omitted, the output columns are taken from
         *              the first returned row's own keys instead (case-insensitively matched back to
         *              the requested columns when columns is given, since the rowset endpoint's casing
         *              does not always match what was requested).
         * @param {Object} payload - { deKey, page, pageSize, columns, orderBy, filter, hasRowMark, restOnly }.
         *        restOnly true skips the free read, so the page comes from the REST rowset endpoint in its
         *        one order. The Frontend sets it for every chunk it reads, for a grid page larger than a
         *        chunk and for every Export page, so all of them share that order.
         * @param {Object} authRow
         * @returns {{count: number, page: number, pageSize: number, columns: string[], rows: Array<Array>}}
         */
        function actionGetResults(payload, authRow) {
            var deKey = payload.deKey;
            requireString(deKey, 'deKey', 1, 36);

            var page = requireInt(payload.page, 'page', 1, null);
            var pageSize = requireInt(payload.pageSize, 'pageSize', 1, 2500);

            var columns = payload.columns;
            if (columns !== undefined && columns !== null) {
                requireArray(columns, 'columns');
                for (var ci = 0; ci < columns.length; ci++) {
                    requireString(columns[ci], 'columns[' + ci + ']', 1, 128);
                };
            } else {
                columns = null;
            };

            var orderBy = payload.orderBy;
            if (orderBy !== undefined && orderBy !== null && orderBy !== '') {
                if (typeof orderBy !== 'string' || !/^[A-Za-z0-9 _.-]{1,128}( (ASC|DESC))?$/.test(orderBy)) {
                    throw apiError('BAD_REQUEST', 'Field "orderBy" is not valid.', null);
                };
            } else {
                orderBy = null;
            };

            var filter = payload.filter;
            if (filter !== undefined && filter !== null && filter !== '') {
                requireString(filter, 'filter', 1, 1000);
            } else {
                filter = null;
            };

            var url = restBase + '/data/v1/customobjectdata/key/' + urlEncode(deKey) + '/rowset?$page=' + urlEncode(String(page)) + '&$pageSize=' + urlEncode(String(pageSize));
            if (orderBy) {
                url += '&$orderBy=' + urlEncode(orderBy);
            };
            if (filter) {
                url += '&$filter=' + urlEncode(filter);
            };

            /* A run's own temporary Data Extension with the row-mark column reads for free, within its
            first 2,000 rows and without a server-side filter; everything else goes through REST. A
            restOnly request never reads for free, even for page 1 of 2,000 rows, which would fit the
            window: without an orderBy the free read has its own row order, and the Frontend's chunks
            and Export must all come in the rowset endpoint's order. */
            if (payload.restOnly !== true && payload.hasRowMark === true && columns !== null && filter === null && isOwnTempDeKey(authRow, deKey)) {
                var freePage = readRowsFree(deKey, columns, page, pageSize, orderBy);
                if (freePage !== null) {
                    return freePage;
                };
            };

            var res = httpJSON('GET', url, null, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var items = body.items || [];

            var outputColumns = columns;
            if (!outputColumns) {
                outputColumns = [];
                if (items.length > 0) {
                    var sourceObj = mergeKeysValues(items[0]);
                    for (var k in sourceObj) {
                        if (sourceObj.hasOwnProperty(k)) {
                            outputColumns.push(k);
                        };
                    };
                };
            };

            var rows = [];
            for (var i = 0; i < items.length; i++) {
                var merged = mergeKeysValues(items[i]);
                var lowerMap = {};
                for (var mk in merged) {
                    if (merged.hasOwnProperty(mk)) {
                        lowerMap[mk.toLowerCase()] = merged[mk];
                    };
                };
                var rowValues = [];
                for (var oc = 0; oc < outputColumns.length; oc++) {
                    var colKey = outputColumns[oc].toLowerCase();
                    var value = lowerMap.hasOwnProperty(colKey) ? lowerMap[colKey] : null;
                    if (value === undefined) {
                        value = null;
                    };
                    rowValues.push(value);
                };
                rows.push(rowValues);
            };

            var data = {
                count: (body.count !== undefined) ? body.count : rows.length,
                page: page,
                pageSize: pageSize,
                columns: outputColumns,
                rows: rows,
                readPath: 'rest'
            };
            return data;
        };

        /**
         * @function actionDeleteRun
         * @description M5: deletes only a temporary Data Extension that SQL Studio itself created for
         *              the calling user - never a Query Activity (the per-user ad-hoc activity is reused,
         *              not deleted by this action) and never a Data Extension key belonging to anyone
         *              else or to anything outside SQL Studio's own naming scheme. Without this check,
         *              a frontend bug or a stolen session would turn deleteRun into a general-purpose
         *              delete-any-Data-Extension-the-user-can-see tool.
         * @param {Object} payload - { deKey }
         * @param {Object} authRow
         * @returns {{deletedDE:boolean, warnings:string[]}}
         */
        function actionDeleteRun(payload, authRow) {
            var deKey = payload.deKey;
            requireString(deKey, 'deKey', 1, 36);

            if (!isOwnTempDeKey(authRow, deKey)) {
                throw apiError('BAD_REQUEST', 'Only SQL Studio\'s own temporary Data Extensions can be deleted.', null);
            };

            var warnings = [];
            var deResult = deleteDataExtensionByKey(authRow.token, deKey);
            if (!deResult.ok) {
                warnings.push(truncate(deResult.raw, 2000));
            };

            var data = {
                deletedDE: deResult.ok,
                warnings: warnings
            };
            return data;
        };

        /**
         * @function actionListRuns
         * @description Lists this user's own leftover temporary Data Extensions (never anyone else's,
         *              and never Query Activities, since the per-user ad-hoc activity is reused rather
         *              than cleaned up), for the "clean up leftover runs" dialog.
         * @param {Object} payload - {}
         * @param {Object} authRow
         * @returns {{userHash: string, dataExtensions: Object[]}}
         */
        function actionListRuns(payload, authRow) {
            /* On the first org deployment this failed with "Object expected: replace", which no code
            here explains. listRunStage names the step, so the next failure says where. */
            var listRunStage = 'user hash';
            try {
                /* Only this user's temporary Data Extensions: the key carries the user hash
                (SQLStudio_<userHash>_<stamp>), so one user can never delete another user's live result set.
                Query Activities are never listed here: the per-user ad-hoc activity is reused, not cleaned up. */
                var userHash = computeUserHash(authRow);
                var userPrefix = tempPrefix + userHash + '_';
                listRunStage = 'request';
                var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                    '<RetrieveRequest>' +
                    '<ObjectType>DataExtension</ObjectType>' +
                    '<Properties>ObjectID</Properties>' +
                    '<Properties>CustomerKey</Properties>' +
                    '<Properties>Name</Properties>' +
                    '<Properties>CreatedDate</Properties>' +
                    '<Properties>ModifiedDate</Properties>' +
                    '<Filter xsi:type="SimpleFilterPart">' +
                    '<Property>Name</Property>' +
                    '<SimpleOperator>like</SimpleOperator>' +
                    '<Value>' + xmlEscape(userPrefix) + '</Value>' +
                    '</Filter>' +
                    '</RetrieveRequest>' +
                    '</RetrieveRequestMsg>';
                listRunStage = 'SOAP call';
                var soapRes = soap('Retrieve', bodyXml, authRow.token);
                if (!soapRes.ok) {
                    throw sfmcErrorFromSoap(soapRes);
                };
                var dataExtensions = [];
                var nowDate = Platform.Function.Now();
                for (var i = 0; i < soapRes.results.length; i++) {
                    var block = soapRes.results[i];
                    listRunStage = 'result ' + (i + 1) + ' of ' + soapRes.results.length + ', CustomerKey';
                    var key = xmlValue(block, 'CustomerKey');
                    /* The SOAP like filter is a substring match; keep only exact prefix matches. */
                    if (!key || String(key).indexOf(userPrefix) !== 0) {
                        continue;
                    };
                    listRunStage = 'result ' + (i + 1) + ', other fields';
                    var dataExtension = {
                        objectId: xmlValue(block, 'ObjectID'),
                        key: key,
                        name: xmlValue(block, 'Name'),
                        createdDate: xmlValue(block, 'CreatedDate'),
                        modifiedDate: xmlValue(block, 'ModifiedDate')
                    };
                    listRunStage = 'result ' + (i + 1) + ', age';
                    dataExtension.ageSeconds = tempDeKeyAgeSeconds(key, nowDate);
                    dataExtensions.push(dataExtension);
                };
                listRunStage = 'response';
                var data = {
                    userHash: userHash,
                    dataExtensions: dataExtensions
                };
                return data;
            } catch (listRunErr) {
                if (listRunErr && typeof listRunErr.code == 'string') {
                    throw listRunErr;
                };
                throw apiError('INTERNAL', describeError(listRunErr) + ' (listRuns, at ' + listRunStage + ')', null);
            };
        };

        /**
         * @function actionSaveQueryActivity
         * @description Creates a new, permanent Query Activity ("Save as"), distinct from the reused
         *              per-user ad-hoc activity actionRunQuery manages.
         * @param {Object} payload - { name, key, description, sql, targetKey, targetName, updateType, targetId, categoryId }
         * @param {Object} authRow
         * @returns {{queryId: string, key: string, name: string}}
         */
        function actionSaveQueryActivity(payload, authRow) {
            var name = payload.name;
            requireString(name, 'name', 1, 100);

            var key = payload.key;
            if (key !== undefined && key !== null && key !== '') {
                requireString(key, 'key', 1, 36);
            } else {
                key = (name.length > 36) ? name.substring(0, 36) : name;
            };

            var description = payload.description;
            if (description === undefined || description === null) {
                description = '';
            };

            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var targetKey = payload.targetKey;
            requireString(targetKey, 'targetKey', 1, 36);

            var targetName = payload.targetName;
            requireString(targetName, 'targetName', 1, 128);

            var updateType = payload.updateType;
            if (updateType !== 'Overwrite' && updateType !== 'Update' && updateType !== 'Append') {
                throw apiError('BAD_REQUEST', 'Field "updateType" must be one of Overwrite, Update, Append.', null);
            };

            var body = {
                name: name,
                key: key,
                description: description,
                queryText: sql,
                targetName: targetName,
                targetKey: targetKey,
                targetUpdateTypeId: updateTypeIdFromName(updateType),
                targetUpdateTypeName: updateType
            };
            if (payload.targetId !== undefined && payload.targetId !== null) {
                body.targetId = payload.targetId;
            };
            if (payload.categoryId !== undefined && payload.categoryId !== null) {
                body.categoryId = payload.categoryId;
            };

            var res = httpJSON('POST', restBase + '/automation/v1/queries/', body, authRow.token);
            if (res.status < 200 || res.status >= 300 || !res.json || !res.json.queryDefinitionId) {
                throw sfmcErrorFromResponse(res);
            };

            var data = {
                queryId: res.json.queryDefinitionId,
                key: res.json.key || key,
                name: res.json.name || name
            };
            return data;
        };

        /**
         * @function actionUpdateQueryActivity
         * @description Patches an existing (permanently saved) Query Activity in place.
         * @param {Object} payload - { id, sql, targetKey, targetName, updateType, name, description, targetId, categoryId }
         * @param {Object} authRow
         * @returns {{queryId: string, key: ?string, name: ?string}}
         */
        function actionUpdateQueryActivity(payload, authRow) {
            var id = payload.id;
            requireGuid(id, 'id');

            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var targetKey = payload.targetKey;
            requireString(targetKey, 'targetKey', 1, 36);

            var targetName = payload.targetName;
            requireString(targetName, 'targetName', 1, 128);

            var updateType = payload.updateType;
            if (updateType !== 'Overwrite' && updateType !== 'Update' && updateType !== 'Append') {
                throw apiError('BAD_REQUEST', 'Field "updateType" must be one of Overwrite, Update, Append.', null);
            };

            var body = {
                queryText: sql,
                targetName: targetName,
                targetKey: targetKey,
                targetUpdateTypeId: updateTypeIdFromName(updateType),
                targetUpdateTypeName: updateType
            };
            if (payload.name !== undefined && payload.name !== null && payload.name !== '') {
                requireString(payload.name, 'name', 1, 100);
                body.name = payload.name;
            };
            if (payload.description !== undefined && payload.description !== null) {
                body.description = payload.description;
            };
            if (payload.targetId !== undefined && payload.targetId !== null) {
                body.targetId = payload.targetId;
            };
            if (payload.categoryId !== undefined && payload.categoryId !== null) {
                body.categoryId = payload.categoryId;
            };

            var res = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(id), body, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var json = res.json || {};
            var data = {
                queryId: id,
                key: json.key || null,
                name: json.name || (payload.name || null)
            };
            return data;
        };

        /**
         * @function actionListQueryActivities
         * @description Lists saved Query Activities, one page at a time, with an optional
         *              name-substring search.
         * @param {Object} payload - { page, pageSize, search }
         * @param {Object} authRow
         * @returns {{count: number, page: number, pageSize: number, items: Object[]}}
         */
        function actionListQueryActivities(payload, authRow) {
            var page = payload.page;
            page = (page === undefined || page === null) ? 1 : requireInt(page, 'page', 1, null);

            var pageSize = payload.pageSize;
            pageSize = (pageSize === undefined || pageSize === null) ? 50 : requireInt(pageSize, 'pageSize', 1, 200);

            var search = payload.search;
            if (search !== undefined && search !== null && search !== '') {
                requireString(search, 'search', 1, 128);
            } else {
                search = null;
            };

            var url = restBase + '/automation/v1/queries/?$page=' + page + '&$pageSize=' + pageSize;
            if (search) {
                url += '&$filter=' + likeFilter('Name', search);
            };

            var res = httpJSON('GET', url, null, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var rawItems = body.items || [];
            var items = [];
            for (var i = 0; i < rawItems.length; i++) {
                var item = rawItems[i];
                items.push({
                    id: item.queryDefinitionId || item.id,
                    key: item.key,
                    name: item.name,
                    description: item.description,
                    targetKey: item.targetKey,
                    targetName: item.targetName,
                    targetId: item.targetId,
                    updateType: item.targetUpdateTypeName,
                    categoryId: item.categoryId,
                    modifiedDate: item.modifiedDate
                });
            };

            var data = {
                count: (body.count !== undefined) ? body.count : items.length,
                page: page,
                pageSize: pageSize,
                items: items
            };
            return data;
        };

        /**
         * @function actionGetQueryActivity
         * @description Fetches one saved Query Activity by id, for the Open dialog.
         * @param {Object} payload - { id }
         * @param {Object} authRow
         * @returns {Object} The Query Activity's fields (see actionListQueryActivities for the shape).
         * @throws {Object} apiError NOT_FOUND when the activity does not exist.
         */
        function actionGetQueryActivity(payload, authRow) {
            var id = payload.id;
            requireGuid(id, 'id');

            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(id), null, authRow.token);
            if (res.status === 404) {
                throw apiError('NOT_FOUND', 'Query activity not found.', null);
            };
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var json = res.json || {};
            var data = {
                id: json.queryDefinitionId || id,
                key: json.key,
                name: json.name,
                description: json.description,
                sql: json.queryText,
                targetKey: json.targetKey,
                targetName: json.targetName,
                targetId: json.targetId,
                updateType: json.targetUpdateTypeName,
                categoryId: json.categoryId,
                modifiedDate: json.modifiedDate
            };
            return data;
        };

        /**
         * @function isReferrerUnder
         * @description Tells whether a referrer is the allowed prefix itself or lies under it: the
         *              prefix matches, and then the referrer ends, or continues with '/', '?' or '#'. A
         *              plain starts-with test let `https://host` allow `https://host.evil.io`. A prefix
         *              that ends in '/' is already at a boundary, so anything after it is under it.
         * @param {string} referrer
         * @param {string} prefix - one allowedReferrers entry
         * @returns {boolean}
         */
        function isReferrerUnder(referrer, prefix) {
            var allowed = String(prefix);
            if (allowed === '' || referrer.indexOf(allowed) !== 0) {
                return false;
            };
            if (referrer.length === allowed.length || allowed.charAt(allowed.length - 1) === '/') {
                return true;
            };
            var nextChar = referrer.charAt(allowed.length);
            return nextChar === '/' || nextChar === '?' || nextChar === '#';
        };

        /* ---------------------- 5.1 to 5.3. Parse, authenticate, dispatch ------ */

        var response;

        try {
            /* 4.1. Parse and validate the request. */
            var postedData = Platform.Request.GetPostData('utf-8');

            var parsedData;
            try {
                parsedData = Platform.Function.ParseJSON(postedData);
            } catch (parseErr) {
                throw apiError('BAD_REQUEST', 'Request body is not valid JSON.', null);
            };

            if (!parsedData || typeof parsedData !== 'object') {
                throw apiError('BAD_REQUEST', 'Request body must be a JSON object.', null);
            };

            var action = parsedData.action;
            var session = parsedData.session;
            var payload = parsedData.payload;
            if (!payload || typeof payload !== 'object') {
                payload = {};
            };

            if (typeof action !== 'string' || trimString(action) === '') {
                throw apiError('BAD_REQUEST', 'Field "action" is required.', null);
            };
            if (typeof session !== 'string' || !/^[0-9a-fA-F-]{36}$/.test(session)) {
                throw apiError('BAD_REQUEST', 'Field "session" must be a valid session id.', null);
            };

            /* 4.1. Optional referrer allowlist. */
            if (allowedReferrers && allowedReferrers.length > 0) {
                var referrer = String(Platform.Request.ReferrerURL || '');
                var isReferrerOk = false;
                for (var ri = 0; ri < allowedReferrers.length; ri++) {
                    if (isReferrerUnder(referrer, allowedReferrers[ri])) {
                        isReferrerOk = true;
                        break;
                    };
                };
                if (!isReferrerOk) {
                    throw apiError('BAD_REQUEST', 'Request referrer is not allowed.', null);
                };
            };

            /* 4.2. Session lookup, expiry and refresh. One field at a time with Platform.Function.Lookup,
            as the author's Cloud Page App template does in production. Reading the whole row with
            LookupRows ended every call on the first org deployment with a .NET "Years value must be
            between +/-10000" error while turning the stored date back into a JavaScript date. */
            var sessionKey = sha256Hex(session);
            var sessionToken = Platform.Function.Lookup(authDE, 'token', ['appName', 'session'], [appName, sessionKey]);
            if (sessionToken === null || sessionToken === undefined || String(sessionToken) === '') {
                throw apiError('SESSION_INVALID', 'No session found. Please sign in again.', null);
            };
            /* The row holds the token encrypted for this row and user. One that cannot be read (a new
            clientSecret, a value this release did not write, or one copied from another row or user)
            ends the session like a missing row does. */
            var sessionUserId = lookupSessionText('userId', sessionKey);
            var plainToken = (trimString(sessionUserId) === '') ? '' : decryptToken(String(sessionToken), sessionKey, sessionUserId);
            if (plainToken === '') {
                throw apiError('SESSION_INVALID', 'No session found. Please sign in again.', null);
            };
            var authRow = {
                token: plainToken,
                userName: lookupSessionText('userName', sessionKey),
                userEmail: lookupSessionText('userEmail', sessionKey),
                userId: sessionUserId,
                tokenExpire: null
            };
            var expiryReadError = null;
            try {
                authRow.tokenExpire = Platform.Function.Lookup(authDE, 'tokenExpire', ['appName', 'session'], [appName, sessionKey]);
            } catch (expireErr) {
                expiryReadError = describeError(expireErr);
            };

            /* H3: no refresh tokens. An expired session always ends the request here; the frontend's
            expiry modal re-authenticates with one click, which also writes a fresh expiry. See
            docs/EXTENDING.md. */
            var secondsLeft = (expiryReadError === null) ? secondsUntil(authRow.tokenExpire) : null;
            /* Written as !(x > 0): an expiry that cannot be read (null) counts as expired, with the reason
            in the details, since that is what it takes to fix the reader, and an expiry is not a secret. */
            if (!(secondsLeft > 0)) {
                var expiryDetails = null;
                if (expiryReadError !== null) {
                    expiryDetails = 'The stored tokenExpire could not be read: ' + expiryReadError;
                } else if (secondsLeft === null) {
                    expiryDetails = 'The stored tokenExpire value "' + truncate(String(authRow.tokenExpire), 80) + '" could not be read as a date.';
                };
                if (expiryDetails !== null) {
                    /* Not a normal expiry: log it, since the app's Session expired dialog shows no details. */
                    logError('Session expiry could not be read', expiryDetails);
                };
                throw apiError('SESSION_EXPIRED', 'Your session has expired. Please sign in again.', expiryDetails);
            };

            /* 4.3. Action dispatch (object lookup instead of switch: the SSJS engine mishandles default clauses). */
            var handlers = {
                whoami: actionWhoami,
                finishSetup: actionFinishSetup,
                getWorkspace: actionGetWorkspace,
                listFolders: actionListFolders,
                listDataExtensions: actionListDataExtensions,
                getDataExtensionFields: actionGetDataExtensionFields,
                validateQuery: actionValidateQuery,
                runQuery: actionRunQuery,
                getRunStatus: actionGetRunStatus,
                getRunOutcome: actionGetRunOutcome,
                getResults: actionGetResults,
                deleteRun: actionDeleteRun,
                listRuns: actionListRuns,
                saveQueryActivity: actionSaveQueryActivity,
                updateQueryActivity: actionUpdateQueryActivity,
                listQueryActivities: actionListQueryActivities,
                getQueryActivity: actionGetQueryActivity,
                addHistory: actionAddHistory,
                listHistory: actionListHistory,
                clearHistory: actionClearHistory
            };
            if (!handlers.hasOwnProperty(action)) {
                throw apiError('UNKNOWN_ACTION', 'Unknown action: ' + action, null);
            };
            var handler = handlers[action];
            var data = handler(payload, authRow);
            response = {
                ok: true,
                data: data,
                meta: { apiCalls: apiCallCount }
            };

            /* ---------------------- 5.5. Backend error handling ----------------- */
        } catch (err) {
            response = buildErrorResponse(err);
            response.meta = { apiCalls: apiCallCount };
        };

        Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
        Platform.Response.SetResponseHeader('Cache-Control', 'no-store');

        var stringifiedResponse = Stringify(response);
    };
</script>
