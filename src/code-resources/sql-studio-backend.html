         * @param {number} maxLen
         * @returns {string} the trimmed text
         */
        function requireLabel(value, fieldName, maxLen) {
            requireString(value, fieldName, 1, maxLen);
            var trimmed = trimString(value);
            if (hasControlCharacter(trimmed)) {
                throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must not hold control characters.', null);
            };
            return trimmed;
        };

        /**
         * @function readOptionalBoolean
         * @description Reads a payload flag that may be left out: absent (undefined or null) gives the fallback,
         *              and anything but true or false is BAD_REQUEST.
         * @param {*} value
         * @param {string} fieldName
         * @param {boolean} fallback
         * @returns {boolean}
         */
        function readOptionalBoolean(value, fieldName, fallback) {
            if (!isGiven(value)) {
                return fallback;
            };
            if (value !== true && value !== false) {
                throw apiError('BAD_REQUEST', 'Field "' + fieldName + '" must be true or false.', null);
            };
            return value;
        };

        /**
         * @function validateDataExtensionField
         * @description Validates one field of createDataExtension's payload and fills what it leaves out. The name is
         *              never the row mark column's (ROW_MARK_FIELD), which a move leaves out. The type
         *              is one of DE_FIELD_TYPES, with its case. A length is for Text alone, 1 to 4,000, and absent
         *              means the default of Marketing Cloud Engagement. A Decimal takes a precision from 1 to 29 and a
         *              scale from 0 to the smaller of the precision and 8, taking 18 and 4 (4 at most the precision)
         *              for either that is absent, as a run's Decimal does. Any other type takes none of the three.
         *              A primary key is not nullable, and a field is nullable otherwise unless it says it is not.
         * @param {*} entry - one item of fields
         * @param {number} index - its place in the list, for the error text
         * @returns {{name: string, type: string, length: ?number, precision: ?number, scale: ?number,
         *           isPrimaryKey: boolean, isNullable: boolean, defaultValue: ?string}}
         * @throws {Object} apiError BAD_REQUEST
         */
        function validateDataExtensionField(entry, index) {
            var label = 'fields[' + index + ']';
            if (entry === null || entry === undefined || typeof entry !== 'object' || isArray(entry)) {
                throw apiError('BAD_REQUEST', 'Field "' + label + '" must be an object.', null);
            };
            var name = requireLabel(entry.name, label + '.name', DE_FIELD_NAME_MAX_LENGTH);
            if (name.toLowerCase() === ROW_MARK_FIELD.toLowerCase()) {
                throw apiError('BAD_REQUEST', 'Field "' + label + '.name" is the row mark column of SQL Studio, which a move never fills. Choose another name.', null);
            };
            var type = entry.type;
            if (!isOneOf(DE_FIELD_TYPES, type)) {
                throw apiError('BAD_REQUEST', 'Field "' + label + '.type" must be one of ' + DE_FIELD_TYPES.join(', ') + '.', null);
            };

            /* maxLength, never length: on the author's org (2026-10-08) a field object that ParseJSON gave answered .length although
            the app sent none, and the check refused an EmailAddress field for it. */
            var length = null;
            if (isGiven(entry.maxLength)) {
                if (type !== 'Text') {
                    throw apiError('BAD_REQUEST', 'Field "' + label + '.maxLength" is for Text fields only: Marketing Cloud Engagement sets the length of a ' + type + ' field.', null);
                };
                length = requireInt(entry.maxLength, label + '.maxLength', 1, DE_TEXT_MAX_LENGTH);
            };

            var precision = null;
            var scale = null;
            if (type === 'Decimal') {
                precision = DECIMAL_DEFAULT_PRECISION;
                if (isGiven(entry.precision)) {
                    precision = requireInt(entry.precision, label + '.precision', 1, DECIMAL_MAX_PRECISION);
                };
                scale = (DECIMAL_DEFAULT_SCALE < precision) ? DECIMAL_DEFAULT_SCALE : precision;
                if (isGiven(entry.scale)) {
                    var maxScale = (precision < DECIMAL_MAX_SCALE) ? precision : DECIMAL_MAX_SCALE;
                    scale = requireInt(entry.scale, label + '.scale', 0, maxScale);
                };
            } else if (isGiven(entry.precision) || isGiven(entry.scale)) {
                throw apiError('BAD_REQUEST', 'Fields "' + label + '.precision" and "' + label + '.scale" are for Decimal fields only.', null);
            };

            var isPrimaryKey = readOptionalBoolean(entry.isPrimaryKey, label + '.isPrimaryKey', false);
            var isNullable = readOptionalBoolean(entry.isNullable, label + '.isNullable', !isPrimaryKey);
            if (isPrimaryKey && isNullable) {
                throw apiError('BAD_REQUEST', 'Field "' + label + '" is a primary key, which cannot be nullable.', null);
            };
            /* Marketing Cloud Engagement refuses it with "A text field with no length specified cannot be used as a primary key"
            (the author's org, 2026-10-09), after the call: the check says so before it. */
            if (isPrimaryKey && type === 'Text' && length === null) {
                throw apiError('BAD_REQUEST', 'Field "' + label + '.maxLength" is needed: a Text primary key must have a length.', null);
            };

            var defaultValue = null;
            if (isGiven(entry.defaultValue) && entry.defaultValue !== '') {
                defaultValue = requireLabel(entry.defaultValue, label + '.defaultValue', DE_DEFAULT_VALUE_MAX_LENGTH);
            };

            var field = {
                name: name,
                type: type,
                length: length,
                precision: precision,
                scale: scale,
                isPrimaryKey: isPrimaryKey,
                isNullable: isNullable,
                defaultValue: defaultValue
            };
            return field;
        };

        /**
         * @function validateNewDataExtension
         * @description Validates everything createDataExtension is asked to make, before any call: the name (1 to 128
         *              characters, not starting with an underscore, never the name of SQL Studio's own Data Extensions,
         *              isAppDataExtension), the key (1 to 36, or absent for Marketing Cloud Engagement to make one, never
         *              the shape of a temporary run Data Extension, which the app hides and sweeps, and never the key of
         *              SQL Studio's own Data Extensions), the folder, 1 to 500 fields with names that differ without regard
         *              to case (validateDataExtensionField), the retention (a period of 1 to 999 and a unit of Days, Weeks,
         *              Months or Years) and the send relationship (the sendable field must be a field of the payload, of a
         *              type SENDABLE_FIELD_TYPES gives the relationship: Text, EmailAddress or Phone for the Subscriber
         *              Key and EmailAddress for the Email Address).
         * @param {Object} payload - createDataExtension's payload
         * @param {Object} [progress] - { stage }, where each check writes its name before it starts, for an error of the platform
         * @returns {{name: string, key: ?string, categoryId: ?number, fields: Object[], retention: ?Object, sendable: ?Object}}
         * @throws {Object} apiError BAD_REQUEST
         */
        function validateNewDataExtension(payload, progress) {
            var stageOf = progress || {};
            stageOf.stage = 'the checks: the name';
            var name = requireLabel(payload.name, 'name', DE_NAME_MAX_LENGTH);
            if (name.charAt(0) === '_') {
                throw apiError('BAD_REQUEST', 'Field "name" must not start with an underscore.', null);
            };
            stageOf.stage = 'the checks: SQL Studio\'s own names';
            if (isAppDataExtension(name)) {
                throw apiError('BAD_REQUEST', 'Field "name" must not be the name of one of SQL Studio\'s own Data Extensions.', null);
            };

            stageOf.stage = 'the checks: the key';
            var key = null;
            var isKeyBlank = (typeof payload.key === 'string' && trimString(payload.key) === '');
            if (isGiven(payload.key) && !isKeyBlank) {
                key = requireLabel(payload.key, 'key', DE_KEY_MAX_LENGTH);
                if (isTempDeKey(key)) {
                    throw apiError('BAD_REQUEST', 'Field "key" must not be the key of a temporary Data Extension of SQL Studio.', null);
                };
                if (isAppDataExtension(key)) {
                    throw apiError('BAD_REQUEST', 'Field "key" must not be the key of one of SQL Studio\'s own Data Extensions.', null);
                };
            };

            stageOf.stage = 'the checks: the folder';
            var categoryId = null;
            if (isGiven(payload.categoryId)) {
                categoryId = requireInt(payload.categoryId, 'categoryId', 1, null);
            };

            stageOf.stage = 'the checks: the fields';
            requireArray(payload.fields, 'fields');
            if (payload.fields.length < 1 || payload.fields.length > DE_FIELD_MAX_COUNT) {
                throw apiError('BAD_REQUEST', 'Field "fields" must contain 1 to ' + DE_FIELD_MAX_COUNT + ' items.', null);
            };
            var fields = [];
            var seen = {};
            for (var i = 0; i < payload.fields.length; i++) {
                stageOf.stage = 'the checks: field ' + (i + 1);
                var field = validateDataExtensionField(payload.fields[i], i);
                var lower = field.name.toLowerCase();
                /* A prefix, so a field named like an Object member never reads as taken. */
                if (seen.hasOwnProperty('n:' + lower)) {
                    throw apiError('BAD_REQUEST', 'Field names must differ without regard to case: "' + field.name + '" is there twice.', null);
                };
                seen['n:' + lower] = true;
                fields.push(field);
            };

            stageOf.stage = 'the checks: the retention';
            var retention = null;
            if (isGiven(payload.retention)) {
                var retentionIn = payload.retention;
                if (typeof retentionIn !== 'object' || isArray(retentionIn)) {
                    throw apiError('BAD_REQUEST', 'Field "retention" must be an object.', null);
                };
                var period = requireInt(retentionIn.period, 'retention.period', 1, DE_RETENTION_MAX_PERIOD);
                if (!isOneOf(DE_RETENTION_UNITS, retentionIn.unit)) {
                    throw apiError('BAD_REQUEST', 'Field "retention.unit" must be one of ' + DE_RETENTION_UNITS.join(', ') + '.', null);
                };
                retention = {
                    period: period,
                    unit: retentionIn.unit,
                    isRowBased: readOptionalBoolean(retentionIn.isRowBased, 'retention.isRowBased', false),
                    isDataExtensionDeleted: readOptionalBoolean(retentionIn.isDataExtensionDeleted, 'retention.isDataExtensionDeleted', false),
                    resetOnImport: readOptionalBoolean(retentionIn.resetOnImport, 'retention.resetOnImport', false)
                };
            };

            stageOf.stage = 'the checks: the send relationship';
            var sendable = null;
            if (isGiven(payload.sendable)) {
                var sendableIn = payload.sendable;
                if (typeof sendableIn !== 'object' || isArray(sendableIn)) {
                    throw apiError('BAD_REQUEST', 'Field "sendable" must be an object.', null);
                };
                var sendableName = requireLabel(sendableIn.field, 'sendable.field', DE_FIELD_NAME_MAX_LENGTH);
                var relationship = sendableIn.subscriberField;
                if (relationship !== 'subscriberKey' && relationship !== 'emailAddress') {
                    throw apiError('BAD_REQUEST', 'Field "sendable.subscriberField" must be one of subscriberKey, emailAddress.', null);
                };
                var sendableField = null;
                for (var f = 0; f < fields.length; f++) {
                    if (fields[f].name.toLowerCase() === sendableName.toLowerCase()) {
                        sendableField = fields[f];
                        break;
                    };
                };
                if (sendableField === null) {
                    throw apiError('BAD_REQUEST', 'Field "sendable.field" must name one of the fields.', null);
                };
                var neededTypes = SENDABLE_FIELD_TYPES[relationship];
                if (!isOneOf(neededTypes, sendableField.type)) {
                    var typesText = (neededTypes.length > 1) ? neededTypes.slice(0, neededTypes.length - 1).join(', ') + ' or ' + neededTypes[neededTypes.length - 1] : neededTypes[0];
                    throw apiError('BAD_REQUEST', 'The sendable field must be of type ' + typesText + ' for a relationship to ' + (relationship === 'emailAddress' ? 'the Email Address' : 'the Subscriber Key') + '.', null);
                };
                sendable = {
                    field: sendableField.name,
                    fieldType: sendableField.type,
                    subscriberField: relationship,
                    subscriberFieldName: SENDABLE_SUBSCRIBER_NAMES[relationship]
                };
            };

            var spec = {
                name: name,
                key: key,
                categoryId: categoryId,
                fields: fields,
                retention: retention,
                sendable: sendable
            };
            return spec;
        };

        /**
         * @function buildUserFieldXml
         * @description Builds the DataExtensionField XML of one validated field of createDataExtension, in the order
         *              of a run's fields: Name, FieldType, then a Text field's MaxLength or a Decimal's Scale and
         *              MaxLength (its precision, as buildColumnFieldXml writes it), IsRequired, IsPrimaryKey and
         *              the DefaultValue. A type with a fixed length has none.
         * @param {Object} field - a validateDataExtensionField result
         * @returns {string} The Field element.
         */
        function buildUserFieldXml(field) {
            var sizeXml = '';
            if (field.type === 'Text' && field.length !== null) {
                sizeXml = '<MaxLength>' + field.length + '</MaxLength>';
            } else if (field.type === 'Decimal') {
                sizeXml = '<Scale>' + field.scale + '</Scale>' +
                    '<MaxLength>' + field.precision + '</MaxLength>';
            };
            var defaultXml = '';
            if (field.defaultValue !== null) {
                defaultXml = '<DefaultValue>' + xmlEscape(field.defaultValue) + '</DefaultValue>';
            };
            var fieldXml = '<Field xsi:type="DataExtensionField">' +
                '<Name>' + xmlEscape(field.name) + '</Name>' +
                '<FieldType>' + field.type + '</FieldType>' +
                sizeXml +
                '<IsRequired>' + (field.isNullable ? 'false' : 'true') + '</IsRequired>' +
                '<IsPrimaryKey>' + (field.isPrimaryKey ? 'true' : 'false') + '</IsPrimaryKey>' +
                defaultXml +
                '</Field>';
            return fieldXml;
        };

        /**
         * @function buildUserDataExtensionCreateXml
         * @description Builds the SOAP CreateRequest XML for a Data Extension the user sets up on purpose. The
         *              CustomerKey is left out when none was given, for Marketing Cloud Engagement to make one, and so
         *              is the Description, which the temporary run Data Extensions alone carry. The send relationship
         *              is IsSendable with SendableDataExtensionField (the field's Name and FieldType) and
         *              SendableSubscriberField (its Name, see SENDABLE_SUBSCRIBER_NAMES). The retention is
         *              DataRetentionPeriodLength and DataRetentionPeriod, with RowBasedRetention (true: each row goes when
         *              it is old enough), DeleteAtEndOfRetentionPeriod (true with RowBasedRetention false: all rows go and
         *              the Data Extension stays, both false: all rows and the Data Extension go, as MCE's SOAP guide
         *              "Create a Data Extension" says of object-based retention) and ResetRetentionPeriodOnImport.
         *              Unlike the temporary one's, it is never retried without the retention: the user asked for it.
         * @param {Object} spec - a validateNewDataExtension result
         * @returns {string} The CreateRequest SOAP body XML.
         */
        function buildUserDataExtensionCreateXml(spec) {
            var fieldsXml = '';
            for (var i = 0; i < spec.fields.length; i++) {
                fieldsXml += buildUserFieldXml(spec.fields[i]);
            };

            var keyXml = '';
            if (spec.key !== null) {
                keyXml = '<CustomerKey>' + xmlEscape(spec.key) + '</CustomerKey>';
            };

            var categoryXml = '';
            if (spec.categoryId !== null) {
                categoryXml = '<CategoryID>' + xmlEscape(spec.categoryId) + '</CategoryID>';
            };

            var sendableXml = '<IsSendable>false</IsSendable>';
            if (spec.sendable !== null) {
                sendableXml = '<IsSendable>true</IsSendable>' +
                    '<SendableDataExtensionField>' +
                    '<Name>' + xmlEscape(spec.sendable.field) + '</Name>' +
                    '<FieldType>' + spec.sendable.fieldType + '</FieldType>' +
                    '</SendableDataExtensionField>' +
                    '<SendableSubscriberField>' +
                    '<Name>' + xmlEscape(spec.sendable.subscriberFieldName) + '</Name>' +
                    '</SendableSubscriberField>';
            };

            var retentionXml = '';
            if (spec.retention !== null) {
                retentionXml = '<DataRetentionPeriodLength>' + spec.retention.period + '</DataRetentionPeriodLength>' +
                    '<DataRetentionPeriod>' + spec.retention.unit + '</DataRetentionPeriod>' +
                    '<RowBasedRetention>' + (spec.retention.isRowBased ? 'true' : 'false') + '</RowBasedRetention>' +
                    '<ResetRetentionPeriodOnImport>' + (spec.retention.resetOnImport ? 'true' : 'false') + '</ResetRetentionPeriodOnImport>' +
                    '<DeleteAtEndOfRetentionPeriod>' + (spec.retention.isDataExtensionDeleted ? 'true' : 'false') + '</DeleteAtEndOfRetentionPeriod>';
            };

            var bodyXml = '<CreateRequest xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<Options/>' +
                '<Objects xsi:type="DataExtension">' +
                keyXml +
                '<Name>' + xmlEscape(spec.name) + '</Name>' +
                categoryXml +
                sendableXml +
                retentionXml +
                '<Fields>' + fieldsXml + '</Fields>' +
                '</Objects>' +
                '</CreateRequest>';
            return bodyXml;
        };

        /**
         * @function retrieveDataExtensionInfo
         * @description Reads one Data Extension's ObjectID, CustomerKey and Name with the user's token, by one of
         *              them, in one SOAP Retrieve (1 API call). createDataExtension asks it for what the Create did
         *              not answer, and moveToDataExtension for the ObjectID and Name its target needs. Never read
         *              through WSProxy: that context reads every Data Extension of the Business Unit, whoever asks.
         * @param {string} token
         * @param {string} filterProperty - 'ObjectID', 'CustomerKey' or 'Name'
         * @param {string} filterValue
         * @returns {?{objectId: ?string, key: ?string, name: ?string}} null when no Data Extension matches.
         * @throws {Object} apiError MCE_ERROR when the Retrieve fails.
         */
        function retrieveDataExtensionInfo(token, filterProperty, filterValue) {
            var bodyXml = '<RetrieveRequestMsg xmlns="http://exacttarget.com/wsdl/partnerAPI">' +
                '<RetrieveRequest>' +
                '<ObjectType>DataExtension</ObjectType>' +
                '<Properties>ObjectID</Properties>' +
                '<Properties>CustomerKey</Properties>' +
                '<Properties>Name</Properties>' +
                '<Filter xsi:type="SimpleFilterPart">' +
                '<Property>' + filterProperty + '</Property>' +
                '<SimpleOperator>equals</SimpleOperator>' +
                '<Value>' + xmlEscape(filterValue) + '</Value>' +
                '</Filter>' +
                '</RetrieveRequest>' +
                '</RetrieveRequestMsg>';
            var soapRes = soap('Retrieve', bodyXml, token);
            if (!soapRes.ok) {
                throw sfmcErrorFromSoap(soapRes);
            };
            if (soapRes.results.length === 0) {
                return null;
            };
            var info = {
                objectId: xmlValue(soapRes.results[0], 'ObjectID'),
                key: xmlValue(soapRes.results[0], 'CustomerKey'),
                name: xmlValue(soapRes.results[0], 'Name')
            };
            return info;
        };

        /**
         * @function actionCreateDataExtension
         * @description Creates a Data Extension the user sets up on purpose, with the user's token and SOAP Create,
         *              as the hybrid model creates every asset. Everything is validated before any call
         *              (validateNewDataExtension). A clear refusal of Marketing Cloud Engagement (isSoapClearRefusal),
         *              such as a name that is taken, is MCE_ERROR with its own message, and nothing was made. Any other
         *              failed answer, such as none, a gateway's page or a SOAP server fault, is CREATE_UNCONFIRMED, as
         *              the Data Extension may have been made all the same. The answer's key is the one
         *              given, else the one the Create answers, else one Retrieve reads it by the new ObjectID, or by
         *              the name when the Create answered neither. The folder, the retention and the send
         *              relationship are part of the Create. WSProxy is never used. The answer's targetSig binds the
         *              key to this user (saveTargetSignature), and moveToDataExtension writes only into a key with one.
         * @param {Object} payload - { name, key?, categoryId?, fields: [{ name, type, maxLength?, precision?, scale?,
         *        isPrimaryKey?, isNullable?, defaultValue? }], retention?: { period, unit, isRowBased,
         *        isDataExtensionDeleted, resetOnImport }, sendable?: { field, subscriberField } }. type is Text,
         *        Number, Date, Boolean, EmailAddress, Phone, Decimal or Locale. unit is Days, Weeks, Months or Years.
         *        subscriberField is 'subscriberKey' (a field of type Text, EmailAddress or Phone) or 'emailAddress' (a field
         *        of type EmailAddress).
         * @param {Object} authRow
         * @returns {{objectId: ?string, key: string, name: string, targetSig: ?string}}
         * @throws {Object} apiError BAD_REQUEST for a payload that fails validation, MCE_ERROR for a clear refusal,
         *         after which nothing was made, CREATE_UNCONFIRMED for an answer that is no clear refusal, after which the
         *         Data Extension may be there, or CREATED_NO_KEY for a Data Extension that was created but whose key
         *         cannot be read. An error of the platform itself (not an apiError) names the step it came at, and is
         *         CREATE_UNCONFIRMED once the Create was sent, as the Data Extension may be there, and INTERNAL before.
         */
        function actionCreateDataExtension(payload, authRow) {
            /* The author's RC3 test (2026-10-08): MCE's script engine stopped a create with "StartIndex cannot be less than
            zero", which names no line, and the app said that nothing was made. The step tells where, and once the Create
            is sent nothing may say that it was not made. */
            var progress = {
                stage: 'the checks',
                isSent: false
            };
            try {
                return createUserDataExtension(payload, authRow, progress);
            } catch (createFault) {
                if (createFault && typeof createFault.code === 'string') {
                    throw createFault;
                };
                var at = ' (createDataExtension, at ' + progress.stage + (progress.stage === 'the Create' ? ', ' + soapStage : '') + ')';
                if (progress.isSent) {
                    var deName = (payload && typeof payload.name === 'string') ? trimString(payload.name) : '';
                    throw apiError('CREATE_UNCONFIRMED', 'SQL Studio could not read what Marketing Cloud Engagement answered when it created the Data Extension "' + deName + '", so it may have made it. ' + describeError(createFault) + at, null);
                };
                throw apiError('INTERNAL', describeError(createFault) + at, null);
            };
        };

        /**
         * @function createUserDataExtension
         * @description The steps of actionCreateDataExtension, which see. Each step writes its name to progress.stage
         *              before it starts, and progress.isSent is true from the moment the Create goes out.
         * @param {Object} payload
         * @param {Object} authRow
         * @param {{stage: string, isSent: boolean}} progress
         * @returns {{objectId: ?string, key: string, name: string, targetSig: ?string}}
         */
        function createUserDataExtension(payload, authRow, progress) {
            var spec = validateNewDataExtension(payload, progress);
            /* Before the Create: a session that cannot sign the key makes nothing. */
            progress.stage = 'the user hash';
            var userHash = computeUserHash(authRow);

            progress.stage = 'the request';
            var createXml = buildUserDataExtensionCreateXml(spec);
            progress.stage = 'the Create';
            progress.isSent = true;
            var soapRes = soap('Create', createXml, authRow.token);
            progress.stage = 'the answer';
            var block = (soapRes.results.length > 0) ? soapRes.results[0] : '';
            /* The Result's own StatusCode too: an answer whose OverallStatus is OK is no Data Extension if the
            Result says Error, and the user must never be told it was made. */
            var resultStatusCode = xmlValue(block, 'StatusCode');
            if (!soapRes.ok || (resultStatusCode !== null && resultStatusCode !== 'OK')) {
                var createErr = sfmcErrorFromSoap(soapRes);
                /* Only a clear refusal says nothing was made. After no answer, a gateway's page or a SOAP server fault,
                Marketing Cloud Engagement may have made it all the same, and the app must not say otherwise. */
                if (!isSoapClearRefusal(soapRes, resultStatusCode)) {
                    throw apiError('CREATE_UNCONFIRMED', 'Marketing Cloud Engagement gave no clear answer when SQL Studio created the Data Extension "' + spec.name + '", so it may have made it. ' + createErr.message, createErr.details);
                };
                throw createErr;
            };

            var objectId = xmlValue(block, 'NewObjectID');
            if (objectId === '') {
                objectId = null;
            };
            var key = spec.key;
            if (key === null) {
                progress.stage = 'the key in the answer';
                /* The echoed object's own CustomerKey: the nested objects carry keys of their own. */
                var echoed = xmlWithout(xmlWithout(xmlWithout(xmlWithout(block, 'Fields'), 'SendableDataExtensionField'), 'SendableSubscriberField'), 'Template');
                key = xmlValue(echoed, 'CustomerKey');
                if (key === '') {
                    key = null;
                };
            };
            if (key === null || objectId === null) {
                var filterProperty = 'Name';
                var filterValue = spec.name;
                if (spec.key !== null) {
                    filterProperty = 'CustomerKey';
                    filterValue = spec.key;
                } else if (objectId !== null) {
                    filterProperty = 'ObjectID';
                    filterValue = objectId;
                };
                /* The Data Extension exists now, so a read that fails is no reason to fail the call: the key it
                could not read is reported below, with that fact. */
                var found = null;
                progress.stage = 'the read of the key';
                try {
                    found = retrieveDataExtensionInfo(authRow.token, filterProperty, filterValue);
                } catch (readErr) {
                    found = null;
                };
                if (found !== null) {
                    if (key === null && found.key !== null && found.key !== '') {
                        key = found.key;
                    };
                    if (objectId === null && found.objectId !== null && found.objectId !== '') {
                        objectId = found.objectId;
                    };
                };
            };
            if (key === null) {
                /* Its own code: MCE_ERROR says nothing was made, and the app would say so. */
                throw apiError('CREATED_NO_KEY', 'The Data Extension "' + spec.name + '" was created, but Marketing Cloud Engagement did not answer its key. Find it by its name in Contact Builder.', null);
            };

            /* The Data Extension exists now: a hash the platform cannot compute leaves it without a signature, so no move
            writes into it, rather than failing a call whose Create worked. */
            progress.stage = 'the signature';
            var targetSig = null;
            try {
                targetSig = saveTargetSignature(key, userHash);
            } catch (sigErr) {
                targetSig = null;
            };

            var data = {
                objectId: objectId,
                key: key,
                name: spec.name,
                targetSig: targetSig
            };
            return data;
        };

        /**
         * @function quoteIdentifier
         * @description Writes a name as one SQL Server bracketed identifier: the name in brackets, with each closing
         *              bracket in it doubled, so no name ends the identifier early.
         * @param {string} name
         * @returns {string}
         */
        function quoteIdentifier(name) {
            return '[' + String(name).split(']').join(']]') + ']';
        };

        /**
         * @function validateMoveColumns
         * @description Validates the columns moveToDataExtension reads from a run's Data Extension: 1 to 500 entries, each
         *              a column name or an object { name, as } where as is the name of the new field, for a user who
         *              renamed it. Every name is 1 to 128 characters with no control character, as createDataExtension's
         *              field names are, and a column is never the row mark column, which only the Frontend's reads use.
         *              The names the target gets (as, else name) must differ without regard to case. A bracket in a
         *              name is allowed, since quoteIdentifier escapes it.
         * @param {*} columns
         * @returns {Array<{name: string, alias: ?string}>} the trimmed names, alias null for a plain name or an object without as
         * @throws {Object} apiError BAD_REQUEST
         */
        function validateMoveColumns(columns) {
            requireArray(columns, 'from.columns');
            if (columns.length < 1 || columns.length > DE_FIELD_MAX_COUNT) {
                throw apiError('BAD_REQUEST', 'Field "from.columns" must contain 1 to ' + DE_FIELD_MAX_COUNT + ' items.', null);
            };
            var cleaned = [];
            var seen = {};
            for (var i = 0; i < columns.length; i++) {
                var label = 'from.columns[' + i + ']';
                var entry = columns[i];
                var name = null;
                var alias = null;
                if (isGiven(entry) && typeof entry === 'object' && !isArray(entry)) {
                    name = requireLabel(entry.name, label + '.name', 128);
                    if (isGiven(entry.as)) {
                        alias = requireLabel(entry.as, label + '.as', DE_FIELD_NAME_MAX_LENGTH);
                    };
                } else {
                    name = requireLabel(entry, label, 128);
                };
                if (name.toLowerCase() === ROW_MARK_FIELD.toLowerCase()) {
                    throw apiError('BAD_REQUEST', 'Field "' + label + '" is the row mark column, which is not moved.', null);
                };
                var targetName = (alias === null) ? name : alias;
                var lower = targetName.toLowerCase();
                if (seen.hasOwnProperty('n:' + lower)) {
                    throw apiError('BAD_REQUEST', 'Field "from.columns" gives the name "' + targetName + '" to two columns.', null);
                };
                seen['n:' + lower] = true;
                cleaned.push({
                    name: name,
                    alias: alias
                });
            };
            return cleaned;
        };

        /**
         * @function actionMoveToDataExtension
         * @description Moves rows into a Data Extension the user set up (createDataExtension): it points the slot's own
         *              Query Activity, the one the tab's runs use (found as runQuery finds it: the id the app sent
         *              once its key is this user's key for the slot, else SOAP Retrieve by key, or WSProxy first with
         *              the inBackendBu hint), at the new SQL and the target with Overwrite, and starts it with the
         *              user's token (startQueryActivity). It never touches a Query Activity outside the pool, and
         *              never makes a temporary Data Extension. The SQL is either `SELECT [a], [b] AS [c] FROM [deKey]`
         *              from a run's own temporary Data Extension, without the row mark column, or the user's SQL as given.
         *              The target is read once with the user's token (1 API call), for the ObjectID and Name the
         *              activity's target needs, and a missing one is NOT_FOUND. The target must not be a temporary
         *              Data Extension of SQL Studio, so a move can never overwrite a run's results, nor one of SQL
         *              Studio's own Data Extensions, and it must carry the targetSig createDataExtension answered for
         *              its key and this user (isSaveTargetSignatureOk), else BAD_REQUEST before any call. A target whose
         *              name, as the read answers it, is one of SQL Studio's own is BAD_REQUEST too, before the activity is
         *              touched. A slot whose activity is still running is RUN_IN_PROGRESS. The activity is created, as
         *              runQuery creates it, when the slot has none. A start whose answer cannot be read (startQueryActivity
         *              marks it isStartUnclear) is START_UNCONFIRMED, not MCE_ERROR: the move may have started, and the
         *              Frontend says it could not confirm the move instead of saying the rows were not moved. The answer
         *              carries what runQuery answers for the same follow-up: the Frontend follows the move with
         *              getRunStatus and taskOnly.
         * @param {Object} payload - { slot, targetKey, targetSig, from: { deKey, columns } } or { slot, targetKey, targetSig,
         *        sql }, and optionally queryId (the app's cached id for the slot), queryFolderId and inBackendBu, as runQuery
         *        takes them. Exactly one of from and sql. A column of from is a name, written `[name]`, or an object
         *        { name, as } for a field the user renamed, written `[name] AS [as]`.
         * @param {Object} authRow
         * @returns {{queryId: string, slot: number, targetKey: string, taskId: ?string, taskSig: ?string,
         *           startMethod: string, startResponse: string}} taskSig binds taskId to this user, as runQuery's does.
         * @throws {Object} apiError BAD_REQUEST, NOT_FOUND, RUN_IN_PROGRESS, START_UNCONFIRMED or MCE_ERROR.
         */
        function actionMoveToDataExtension(payload, authRow) {
            var slot = requireInt(payload.slot, 'slot', 1, QUERY_SLOT_COUNT);
            var targetKey = requireLabel(payload.targetKey, 'targetKey', DE_KEY_MAX_LENGTH);
            if (isTempDeKey(targetKey)) {
                throw apiError('BAD_REQUEST', 'A temporary Data Extension of SQL Studio cannot be the target of a move.', null);
            };
            if (isAppDataExtension(targetKey)) {
                throw apiError('BAD_REQUEST', 'SQL Studio\'s own Data Extensions cannot be the target of a move.', null);
            };
            var userHash = computeUserHash(authRow);
            /* Only a Data Extension this user made with createDataExtension: its answer signed the key. */
            if (!isSaveTargetSignatureOk(targetKey, payload.targetSig, userHash)) {
                throw apiError('BAD_REQUEST', 'Field "targetSig" must be the one createDataExtension answered for this Data Extension.', null);
            };

            var hasFrom = isGiven(payload.from);
            var hasSql = isGiven(payload.sql);
            if (hasFrom === hasSql) {
                throw apiError('BAD_REQUEST', 'Give either "from" or "sql", not both and not neither.', null);
            };
            var sql = null;
            if (hasSql) {
                sql = payload.sql;
                requireString(sql, 'sql', 1, 100000);
            } else {
                var from = payload.from;
                if (typeof from !== 'object' || isArray(from)) {
                    throw apiError('BAD_REQUEST', 'Field "from" must be an object.', null);
                };
                var deKey = from.deKey;
                requireString(deKey, 'from.deKey', 1, DE_KEY_MAX_LENGTH);
                if (!isOwnTempDeKey(authRow, deKey)) {
                    throw apiError('BAD_REQUEST', 'Only SQL Studio\'s own temporary Data Extensions can be moved.', null);
                };
                var columns = validateMoveColumns(from.columns);
                var columnsSql = '';
                for (var c = 0; c < columns.length; c++) {
                    columnsSql += (c === 0 ? '' : ', ') + quoteIdentifier(columns[c].name);
                    if (columns[c].alias !== null) {
                        columnsSql += ' AS ' + quoteIdentifier(columns[c].alias);
                    };
                };
                sql = 'SELECT ' + columnsSql + ' FROM ' + quoteIdentifier(deKey);
            };

            var queryFolderId = null;
            if (isGiven(payload.queryFolderId)) {
                queryFolderId = requireInt(payload.queryFolderId, 'queryFolderId', 1, null);
            };
            var cachedQueryId = payload.queryId;
            var hasCachedQueryId = (isGiven(cachedQueryId) && cachedQueryId !== '');
            if (hasCachedQueryId) {
                requireGuid(cachedQueryId, 'queryId');
            };

            var isBackendBu = (payload.inBackendBu === true);

            /* The target first: a Data Extension that is gone is the likelier failure, and it costs the least. */
            var target = retrieveDataExtensionInfo(authRow.token, 'CustomerKey', targetKey);
            if (target === null || !target.objectId) {
                throw apiError('NOT_FOUND', 'The Data Extension "' + targetKey + '" was not found.', null);
            };
            /* Its name too, which the read gives for free: the data functions find the history and the snippets by name, so a
            Data Extension renamed to one of theirs in Contact Builder would be read in their place. */
            if (target.name && isAppDataExtension(target.name)) {
                throw apiError('BAD_REQUEST', 'SQL Studio\'s own Data Extensions cannot be the target of a move.', null);
            };

            /* The slot's own activity, as runQuery resolves it: a cached id counts only once its key is this
            user's key for the slot, and anything else is found by key. */
            var activityKey = adHocActivityKey(userHash, slot);
            var isCachedQueryIdOwn = hasCachedQueryId && isOwnActivity(authRow.token, cachedQueryId, activityKey, isBackendBu);
            var queryId = isCachedQueryIdOwn ? cachedQueryId : findActivityIdByKey(authRow.token, activityKey, isBackendBu);
            if (queryId !== null && isActivityRunning(authRow.token, queryId)) {
                throw apiError('RUN_IN_PROGRESS', 'Your SQL Studio query activity ' + slot + ' is still running one of your queries, from another tab or window. Try again in a moment.', null);
            };

            var activityBody = {
                name: adHocActivityName(authRow.userName, userHash, slot),
                key: activityKey,
                description: adHocActivityDescription(authRow.userEmail),
                queryText: sql,
                targetName: target.name || targetKey,
                targetKey: target.key || targetKey,
                targetId: target.objectId,
                targetUpdateTypeId: updateTypeIdFromName('Overwrite'),
                targetUpdateTypeName: 'Overwrite'
            };
            if (queryFolderId !== null) {
                activityBody.categoryId = queryFolderId;
            };

            if (queryId !== null) {
                var patchRes = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(queryId), activityBody, authRow.token);
                if (patchRes.status < 200 || patchRes.status >= 300) {
                    throw sfmcErrorFromResponse(patchRes);
                };
            } else {
                var createRes = httpJSON('POST', restBase + '/automation/v1/queries/', activityBody, authRow.token);
                if (createRes.status < 200 || createRes.status >= 300 || !createRes.json || !createRes.json.queryDefinitionId) {
                    throw sfmcErrorFromResponse(createRes);
                };
                queryId = createRes.json.queryDefinitionId;
            };

            var started = null;
            try {
                started = startQueryActivity(queryId, userHash, authRow.token);
            } catch (startErr) {
                if (startErr && startErr.isStartUnclear === true) {
                    throw apiError('START_UNCONFIRMED', 'Marketing Cloud Engagement gave no clear answer to the start of the move, so it may have started it. ' + startErr.message, startErr.details);
                };
                /* An error of the platform itself, not an apiError, may come after the start went out (the author's RC3
                test, 2026-10-08, saw one in a create): the move may run, and nothing may say that it does not. */
                if (!(startErr && typeof startErr.code === 'string')) {
                    throw apiError('START_UNCONFIRMED', 'SQL Studio could not read what Marketing Cloud Engagement answered to the start of the move, so it may have started it. ' + describeError(startErr) + ' (moveToDataExtension, at the start)', null);
                };
                throw startErr;
            };

            var data = {
                queryId: queryId,
                slot: slot,
                targetKey: activityBody.targetKey,
                taskId: started.taskId,
                taskSig: started.taskSig,
                startMethod: started.startMethod,
                startResponse: started.startResponse
            };
            return data;
        };

        /**
         * @function actionSaveQueryActivity
         * @description Creates a new, permanent Query Activity ("Save as"), distinct from the reused
         *              per-user ad-hoc activity actionRunQuery manages.
         * @param {Object} payload - { name, key, description, sql, targetKey, targetName, updateType, targetId, categoryId }
         * @param {Object} authRow
         * @returns {{queryId: string, key: string, name: string}}
         */
        function actionSaveQueryActivity(payload, authRow) {
            var name = payload.name;
            requireString(name, 'name', 1, 100);

            var key = payload.key;
            if (key !== undefined && key !== null && key !== '') {
                requireString(key, 'key', 1, 36);
            } else {
                key = (name.length > 36) ? name.substring(0, 36) : name;
            };

            var description = payload.description;
            if (description === undefined || description === null) {
                description = '';
            };

            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var targetKey = payload.targetKey;
            requireString(targetKey, 'targetKey', 1, 36);

            var targetName = payload.targetName;
            requireString(targetName, 'targetName', 1, 128);

            var updateType = payload.updateType;
            if (updateType !== 'Overwrite' && updateType !== 'Update' && updateType !== 'Append') {
                throw apiError('BAD_REQUEST', 'Field "updateType" must be one of Overwrite, Update, Append.', null);
            };

            var body = {
                name: name,
                key: key,
                description: description,
                queryText: sql,
                targetName: targetName,
                targetKey: targetKey,
                targetUpdateTypeId: updateTypeIdFromName(updateType),
                targetUpdateTypeName: updateType
            };
            if (payload.targetId !== undefined && payload.targetId !== null) {
                body.targetId = payload.targetId;
            };
            if (payload.categoryId !== undefined && payload.categoryId !== null) {
                body.categoryId = payload.categoryId;
            };

            var res = httpJSON('POST', restBase + '/automation/v1/queries/', body, authRow.token);
            if (res.status < 200 || res.status >= 300 || !res.json || !res.json.queryDefinitionId) {
                throw sfmcErrorFromResponse(res);
            };

            var data = {
                queryId: res.json.queryDefinitionId,
                key: res.json.key || key,
                name: res.json.name || name
            };
            return data;
        };

        /**
         * @function actionUpdateQueryActivity
         * @description Patches an existing (permanently saved) Query Activity in place.
         * @param {Object} payload - { id, sql, targetKey, targetName, updateType, name, description, targetId, categoryId }
         * @param {Object} authRow
         * @returns {{queryId: string, key: ?string, name: ?string}}
         */
        function actionUpdateQueryActivity(payload, authRow) {
            var id = payload.id;
            requireGuid(id, 'id');

            var sql = payload.sql;
            requireString(sql, 'sql', 1, 100000);

            var targetKey = payload.targetKey;
            requireString(targetKey, 'targetKey', 1, 36);

            var targetName = payload.targetName;
            requireString(targetName, 'targetName', 1, 128);

            var updateType = payload.updateType;
            if (updateType !== 'Overwrite' && updateType !== 'Update' && updateType !== 'Append') {
                throw apiError('BAD_REQUEST', 'Field "updateType" must be one of Overwrite, Update, Append.', null);
            };

            var body = {
                queryText: sql,
                targetName: targetName,
                targetKey: targetKey,
                targetUpdateTypeId: updateTypeIdFromName(updateType),
                targetUpdateTypeName: updateType
            };
            if (payload.name !== undefined && payload.name !== null && payload.name !== '') {
                requireString(payload.name, 'name', 1, 100);
                body.name = payload.name;
            };
            if (payload.description !== undefined && payload.description !== null) {
                body.description = payload.description;
            };
            if (payload.targetId !== undefined && payload.targetId !== null) {
                body.targetId = payload.targetId;
            };
            if (payload.categoryId !== undefined && payload.categoryId !== null) {
                body.categoryId = payload.categoryId;
            };

            var res = httpJSON('PATCH', restBase + '/automation/v1/queries/' + urlEncode(id), body, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var json = res.json || {};
            var data = {
                queryId: id,
                key: json.key || null,
                name: json.name || (payload.name || null)
            };
            return data;
        };

        /**
         * @function actionListQueryActivities
         * @description Lists saved Query Activities, one page at a time, with an optional
         *              name-substring search.
         * @param {Object} payload - { page, pageSize, search }
         * @param {Object} authRow
         * @returns {{count: number, page: number, pageSize: number, items: Object[]}}
         */
        function actionListQueryActivities(payload, authRow) {
            var page = payload.page;
            page = (page === undefined || page === null) ? 1 : requireInt(page, 'page', 1, null);

            var pageSize = payload.pageSize;
            pageSize = (pageSize === undefined || pageSize === null) ? 50 : requireInt(pageSize, 'pageSize', 1, 200);

            var search = payload.search;
            if (search !== undefined && search !== null && search !== '') {
                requireString(search, 'search', 1, 128);
            } else {
                search = null;
            };

            var url = restBase + '/automation/v1/queries/?$page=' + page + '&$pageSize=' + pageSize;
            if (search) {
                url += '&$filter=' + likeFilter('Name', search);
            };

            var res = httpJSON('GET', url, null, authRow.token);
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var body = res.json || {};
            var rawItems = body.items || [];
            var items = [];
            for (var i = 0; i < rawItems.length; i++) {
                var item = rawItems[i];
                items.push({
                    id: item.queryDefinitionId || item.id,
                    key: item.key,
                    name: item.name,
                    description: item.description,
                    targetKey: item.targetKey,
                    targetName: item.targetName,
                    targetId: item.targetId,
                    updateType: item.targetUpdateTypeName,
                    categoryId: item.categoryId,
                    modifiedDate: item.modifiedDate
                });
            };

            var data = {
                count: (body.count !== undefined) ? body.count : items.length,
                page: page,
                pageSize: pageSize,
                items: items
            };
            return data;
        };

        /**
         * @function actionGetQueryActivity
         * @description Fetches one saved Query Activity by id, for the Open dialog.
         * @param {Object} payload - { id }
         * @param {Object} authRow
         * @returns {Object} The Query Activity's fields (see actionListQueryActivities for the shape).
         * @throws {Object} apiError NOT_FOUND when the activity does not exist.
         */
        function actionGetQueryActivity(payload, authRow) {
            var id = payload.id;
            requireGuid(id, 'id');

            var res = httpJSON('GET', restBase + '/automation/v1/queries/' + urlEncode(id), null, authRow.token);
            if (res.status === 404) {
                throw apiError('NOT_FOUND', 'Query activity not found.', null);
            };
            if (res.status < 200 || res.status >= 300) {
                throw sfmcErrorFromResponse(res);
            };

            var json = res.json || {};
            var data = {
                id: json.queryDefinitionId || id,
                key: json.key,
                name: json.name,
                description: json.description,
                sql: json.queryText,
                targetKey: json.targetKey,
                targetName: json.targetName,
                targetId: json.targetId,
                updateType: json.targetUpdateTypeName,
                categoryId: json.categoryId,
                modifiedDate: json.modifiedDate
            };
            return data;
        };

        /**
         * @function isReferrerUnder
         * @description Tells whether a referrer is the allowed prefix itself or lies under it: the
         *              prefix matches, and then the referrer ends, or continues with '/', '?' or '#'. A
         *              plain starts-with test let `https://host` allow `https://host.evil.io`. A prefix
         *              that ends in '/' is already at a boundary, so anything after it is under it.
         * @param {string} referrer
         * @param {string} prefix - one allowedReferrers entry
         * @returns {boolean}
         */
        function isReferrerUnder(referrer, prefix) {
            var allowed = String(prefix);
            if (allowed === '' || referrer.indexOf(allowed) !== 0) {
                return false;
            };
            if (referrer.length === allowed.length || allowed.charAt(allowed.length - 1) === '/') {
                return true;
            };
            var nextChar = referrer.charAt(allowed.length);
            return nextChar === '/' || nextChar === '?' || nextChar === '#';
        };

        /* ---------------------- 5.1 to 5.3. Parse, authenticate, dispatch ------ */

        var response;

        try {
            /* 4.1. Parse and validate the request. */
            var postedData = Platform.Request.GetPostData('utf-8');

            var parsedData;
            try {
                parsedData = Platform.Function.ParseJSON(postedData);
            } catch (parseErr) {
                throw apiError('BAD_REQUEST', 'Request body is not valid JSON.', null);
            };

            if (!parsedData || typeof parsedData !== 'object') {
                throw apiError('BAD_REQUEST', 'Request body must be a JSON object.', null);
            };

            var action = parsedData.action;
            var session = parsedData.session;
            var payload = parsedData.payload;
            if (!payload || typeof payload !== 'object') {
                payload = {};
            };

            if (typeof action !== 'string' || trimString(action) === '') {
                throw apiError('BAD_REQUEST', 'Field "action" is required.', null);
            };
            if (typeof session !== 'string' || !/^[0-9a-fA-F-]{36}$/.test(session)) {
                throw apiError('BAD_REQUEST', 'Field "session" must be a valid session id.', null);
            };

            /* 4.1. Optional referrer allowlist. */
            if (allowedReferrers && allowedReferrers.length > 0) {
                var referrer = String(Platform.Request.ReferrerURL || '');
                var isReferrerOk = false;
                for (var ri = 0; ri < allowedReferrers.length; ri++) {
                    if (isReferrerUnder(referrer, allowedReferrers[ri])) {
                        isReferrerOk = true;
                        break;
                    };
                };
                if (!isReferrerOk) {
                    throw apiError('BAD_REQUEST', 'Request referrer is not allowed.', null);
                };
            };

            /* 4.2. Session lookup, expiry and refresh. One field at a time with Platform.Function.Lookup,
            as the author's Cloud Page App template does in production. Reading the whole row with
            LookupRows ended every call on the first org deployment with a .NET "Years value must be
            between +/-10000" error while turning the stored date back into a JavaScript date. */
            var sessionKey = sha256Hex(session);
            var sessionToken = Platform.Function.Lookup(authDE, 'token', ['appName', 'session'], [appName, sessionKey]);
            if (sessionToken === null || sessionToken === undefined || String(sessionToken) === '') {
                throw apiError('SESSION_INVALID', 'No session found. Please sign in again.', null);
            };
            /* The row holds the token encrypted for this row and user. One that cannot be read (a new
            clientSecret, a value this release did not write, or one copied from another row or user)
            ends the session like a missing row does. */
            var sessionUserId = lookupSessionText('userId', sessionKey);
            var plainToken = (trimString(sessionUserId) === '') ? '' : decryptToken(String(sessionToken), sessionKey, sessionUserId);
            if (plainToken === '') {
                throw apiError('SESSION_INVALID', 'No session found. Please sign in again.', null);
            };
            /* From here on, any error text this request writes is masked of the token too. */
            currentAccessToken = plainToken;
            var authRow = {
                token: plainToken,
                userName: lookupSessionText('userName', sessionKey),
                userEmail: lookupSessionText('userEmail', sessionKey),
                userId: sessionUserId,
                sessionKey: sessionKey,
                tokenExpire: null
            };
            var expiryReadError = null;
            try {
                authRow.tokenExpire = Platform.Function.Lookup(authDE, 'tokenExpire', ['appName', 'session'], [appName, sessionKey]);
            } catch (expireErr) {
                expiryReadError = describeError(expireErr);
            };

            /* H3: no refresh tokens. An expired session always ends the request here; the frontend's
            expiry modal re-authenticates with one click, which also writes a fresh expiry. See
            docs/EXTENDING.md. */
            var secondsLeft = (expiryReadError === null) ? secondsUntil(authRow.tokenExpire) : null;
            /* Written as !(x > 0): an expiry that cannot be read (null) counts as expired, with the reason
            in the details, since that is what it takes to fix the reader, and an expiry is not a secret. */
            if (!(secondsLeft > 0)) {
                var expiryDetails = null;
                if (expiryReadError !== null) {
                    expiryDetails = 'The stored tokenExpire could not be read: ' + expiryReadError;
                } else if (secondsLeft === null) {
                    expiryDetails = 'The stored tokenExpire value "' + truncate(String(authRow.tokenExpire), 80) + '" could not be read as a date.';
                };
                if (expiryDetails !== null) {
                    /* Not a normal expiry: log it, since the app's Session expired dialog shows no details. */
                    logError('Session expiry could not be read', expiryDetails);
                };
                throw apiError('SESSION_EXPIRED', 'Your session has expired. Please sign in again.', expiryDetails);
            };

            /* 4.3. Action dispatch (object lookup instead of switch: the SSJS engine mishandles default clauses). */
            var handlers = {
                whoami: actionWhoami,
                finishSetup: actionFinishSetup,
                getWorkspace: actionGetWorkspace,
                listFolders: actionListFolders,
                listDataExtensions: actionListDataExtensions,
                listParentDataExtensions: actionListParentDataExtensions,
                getDataExtensionFields: actionGetDataExtensionFields,
                getDataExtensionDetails: actionGetDataExtensionDetails,
                validateQuery: actionValidateQuery,
                runQuery: actionRunQuery,
                getRunStatus: actionGetRunStatus,
                getRunOutcome: actionGetRunOutcome,
                getResults: actionGetResults,
                exportRows: actionExportRows,
                deleteRun: actionDeleteRun,
                listRuns: actionListRuns,
                createDataExtension: actionCreateDataExtension,
                moveToDataExtension: actionMoveToDataExtension,
                saveQueryActivity: actionSaveQueryActivity,
                updateQueryActivity: actionUpdateQueryActivity,
                listQueryActivities: actionListQueryActivities,
                getQueryActivity: actionGetQueryActivity,
                addHistory: actionAddHistory,
                listHistory: actionListHistory,
                clearHistory: actionClearHistory,
                listSnippets: actionListSnippets,
                saveSnippet: actionSaveSnippet,
                deleteSnippet: actionDeleteSnippet
            };
            if (!handlers.hasOwnProperty(action)) {
                throw apiError('UNKNOWN_ACTION', 'Unknown action: ' + action, null);
            };
            var handler = handlers[action];
            var data = handler(payload, authRow);
            response = {
                ok: true,
                data: data,
                meta: callMeta()
            };

            /* ---------------------- 5.5. Backend error handling ----------------- */
        } catch (err) {
            response = buildErrorResponse(err);
            response.meta = callMeta();
        };

        Platform.Response.SetResponseHeader('Content-Type', 'application/json; charset=utf-8');
        Platform.Response.SetResponseHeader('Cache-Control', 'no-store');

        var stringifiedResponse = Stringify(response);
    };
</script>
